[workspace]
members = ["inflate", "plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
idenso = { path = "../crates/idenso", default-features = false, features = ["wasm"] }
spenso = { path = "../crates/spenso", default-features = false, features = ["portable-payload", "shadowing", "wasm"] }
symbolica = { version = "3.0.0", default-features = false, features = ["wasm"] }
symbolica-utils = { path = "../crates/symbolica-utils", default-features = false, features = ["wasm"] }
symbolica-typst-plugin = { version = "0.1.0", default-features = false, features = ["wasm"] }

# Consuming workspaces choose these sources through their own root patches.
[patch.crates-io]
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "06906976bca24fefc5203aee699d90d62ebe08cd" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
