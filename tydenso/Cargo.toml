[workspace]
members = ["inflate", "plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
idenso = { path = "../crates/idenso", default-features = false, features = ["wasm"] }
spenso = { path = "../crates/spenso", default-features = false, features = ["portable-payload", "shadowing", "wasm"] }
symbolica = { version = "3.0.0", default-features = false, features = ["wasm"] }
symbolica-utils = { path = "../crates/symbolica-utils", default-features = false, features = ["wasm"] }
symbolica-typst-atom-payload = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "18e0491628f9eac5c788659cabfcdb7575f6986d", default-features = false, features = ["wasm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
