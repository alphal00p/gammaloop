[workspace]
members = ["inflate", "plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
idenso = { path = "../crates/idenso", default-features = false, features = ["wasm"] }
spenso = { path = "../crates/spenso", default-features = false, features = ["portable-payload", "shadowing", "wasm"] }
symbolica = { version = "2.2.0", default-features = false, features = ["wasm"] }
symbolica-utils = { path = "../crates/symbolica-utils", default-features = false, features = ["wasm"] }
tymbolica-atom-payload = { git = "https://github.com/lcnbr/tymbolica", rev = "32ae00483b4845161401afac8be755cc336cb2bb", default-features = false, features = ["wasm"] }

[patch.crates-io]
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "1814278ea103258bcdb059276b760f19d25b46e3" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "1814278ea103258bcdb059276b760f19d25b46e3" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "1814278ea103258bcdb059276b760f19d25b46e3" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
