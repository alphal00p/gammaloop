[workspace]
resolver = "2"
members = ["crates/*", "tests"]
default-members = ["crates/gammaloop-api"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
ahash = "0.8.12"
alphal00p-docs-macros = { path = "crates/alphal00p-docs-macros/" }
alphal00p-docs-schema = { path = "crates/alphal00p-docs-schema/" }
bincode = "2.0.1"
bincode-trait-derive = "0.1.1"
chrono = "0.4.44"
clinnet = { path = "crates/clinnet/", default-features = false }
clap = "4.6.1"
color-eyre = { version = "0.6.5", default-features = false, features = ["capture-spantrace", "track-caller"] }
colored = "3.1.1"
dirs = "6.0.0"
dot-parser = "0.5"
eyre = "0.6.12"
feynkit = { version = "0.1.0", path = "crates/feynkit/" }
feynkit-cff = { version = "0.1.0", path = "crates/feynkit-cff/" }
feynkit-generator = { version = "0.1.0", path = "crates/feynkit-generator/" }
feynkit-graph = { version = "0.1.0", path = "crates/feynkit-graph/" }
feynkit-kinematics = { version = "0.1.0", path = "crates/feynkit-kinematics/" }
feynkit-model = { version = "0.1.0", path = "crates/feynkit-model/" }
feynkit-py = { version = "0.1.0", path = "crates/feynkit-py/" }
feynkit-tensor = { version = "0.1.0", path = "crates/feynkit-tensor/" }
feynkit-ufo = { version = "0.1.0", path = "crates/feynkit-ufo/" }
gammaloop-api = { path = "crates/gammaloop-api/" }
gammaloop-tracing-filter = { path = "crates/gammaloop-tracing-filter/" }
gammaloop-tracing-filter-macros = { path = "crates/gammaloop-tracing-filter-macros/" }
gammalooprs = { path = "crates/gammalooprs/" }
idenso = { path = "crates/idenso/", default-features = false }
include_dir = "0.7"
indexmap = "2.14.0"
indicatif = "0.18.4"
insta = "1.46.3"
itertools = "0.14"
json5 = "0.4.1"
linnest = { path = "crates/linnest/" }
linnet = { path = "crates/linnet/", default-features = false }
momtrop = "0.3.0"
ndarray = "0.17.2"
notify = "8.2.0"
numerica = { version = "2.2.0", default-features = false }
nu-ansi-term = "0.50.3"
numpy = "0.28"
pyo3 = "0.28"
pyo3-build-config = "0.28"
pyo3-stub-gen = { version = "0.17", default-features = false }
pyo3-stub-gen-derive = { version = "0.17", default-features = false }
percent-encoding = "2.3.2"
rand = "0.9.4"
ratatui = "0.30.0"
rayon = "1.5"
regex = "1.12.3"
schemars = "1.2.1"
serde = "1.0.228"
self_cell = "1.2.2"
serde_json = "1"
serde_repr = "0.1.20"
serde_yaml = "0.9.34"
smartstring = "1.0.1"
spenso = { path = "crates/spenso/", default-features = false }
spenso-hep-lib = { path = "crates/spenso-hep-lib/", default-features = false }
spenso-macros = { path = "crates/spenso-macros/", default-features = false }
symbolica-utils = { path = "crates/symbolica-utils/", default-features = false }
symbolica = { version = "3.0.0", default-features = false }
sysinfo = "0.33.1"
tabled = "0.22.0"
thiserror = "2.0"
tiny_http = "0.12.0"
toml = "0.9.12"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-indicatif = "0.3.13"
tracing-subscriber = "0.3.23"
symbolica-typst-atom-payload = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "18e0491628f9eac5c788659cabfcdb7575f6986d", default-features = false }
typed-index-collections = "3.5.0"
vakint = { path = "crates/vakint/" }
walkdir = "2.5.0"

which = "8.0.0"

[profile.bench]
opt-level = 3
lto = "fat"

[profile.release]
lto = "fat"

[profile.dev-optim]
inherits = "dev"
opt-level = 2
# lto=true

[profile.dev-optim.package."*"]
opt-level = 3

[profile.dev-optim.package.gammaloop-workspace-hack]
opt-level = 3

[profile.dev-optim.package.gammaloop-api]
opt-level = 2

[profile.dev-optim.package.gammalooprs]
opt-level = 2

# Documentation binaries validate and generate content, so keep their cold
# codegen cheap without carrying debug information into reusable artifacts.
[profile.docs]
inherits = "dev"
debug = false

# Typst's compiler crates are prohibitively slow without optimization. Keep the
# long-lived watcher itself quick to compile while matching Typst's own
# dependency optimization level for incremental rebuilds.
[profile.docs-watch]
inherits = "dev"
debug = false

[profile.docs-watch.package."*"]
opt-level = 2

# Keep CI archives small enough for cache upload while preserving dev-optim
# debuginfo for local diagnostics.
[profile.ci-optim]
inherits = "dev-optim"
debug = false

[profile.profiling]
inherits = "release"
opt-level = 3
debug = true
lto = "fat"
