[patch.crates-io]
# Match the shared HEPKit host's optional notebook components.
typst-library = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }

# Share the maintained FeynKit owner with local GammaLoop consumers.
[patch."https://github.com/alphal00p/gammaloop"]
clinnet = { path = "crates/clinnet" }
dot-parser = { path = "vendor/dot-parser" }
feynkit = { path = "crates/feynkit" }
feynkit-amplitude = { path = "crates/feynkit-amplitude" }
feynkit-cff = { path = "crates/feynkit-cff" }
feynkit-generator = { path = "crates/feynkit-generator" }
feynkit-graph = { path = "crates/feynkit-graph" }
feynkit-kinematics = { path = "crates/feynkit-kinematics" }
feynkit-model = { path = "crates/feynkit-model" }
feynkit-py = { path = "crates/feynkit-py" }
feynkit-tensor = { path = "crates/feynkit-tensor" }
feynkit-ufo = { path = "crates/feynkit-ufo" }
idenso = { path = "crates/idenso" }
kurvst = { path = "crates/kurvst" }
linnest = { path = "crates/linnest" }
linnet = { path = "crates/linnet" }
linnet-py = { path = "crates/linnet-py" }
linnet-render-py = { path = "crates/linnet-render-py" }
spenso = { path = "crates/spenso" }
spenso-hep-lib = { path = "crates/spenso-hep-lib" }
spenso-macros = { path = "crates/spenso-macros" }
spynso3 = { path = "crates/spynso3" }
symbolica-data = { path = "crates/symbolica-data" }
symbolica-utils = { path = "crates/symbolica-utils" }
three-dimensional-reps = { path = "crates/three-dimensional-reps" }
typst-renderer = { path = "crates/typst-renderer" }

[profile.bench]
opt-level = 3
lto = "fat"

[profile.release]
lto = "fat"

[profile.dev-optim]
inherits = "dev"
opt-level = 2
# lto=true

[profile.dev-optim.package."*"]
opt-level = 3

[profile.dev-optim.package.gammaloop-workspace-hack]
opt-level = 3

[profile.dev-optim.package.gammaloop-api]
opt-level = 2

[profile.dev-optim.package.gammalooprs]
opt-level = 2

# Documentation binaries validate and generate content, so keep their cold
# codegen cheap without carrying debug information into reusable artifacts.
[profile.docs]
inherits = "dev"
debug = false

# Typst's compiler crates are prohibitively slow without optimization. Keep the
# long-lived watcher itself quick to compile while matching Typst's own
# dependency optimization level for incremental rebuilds.
[profile.docs-watch]
inherits = "dev"
debug = false

[profile.docs-watch.package."*"]
opt-level = 2

# Keep CI archives small enough for cache upload while preserving dev-optim
# debuginfo for local diagnostics.
[profile.ci-optim]
inherits = "dev-optim"
debug = false

[profile.profiling]
inherits = "release"
opt-level = 3
debug = true
lto = "fat"
