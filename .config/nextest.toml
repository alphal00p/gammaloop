path = "junit.xml"
store-success-output = true

# This one mandatory main check supplies a pinned external runtime. Inherit
# the existing full-main timeout, while all ordinary cases retain 240 seconds.
[profile.ci_os_mass_reference]
inherits = "ci_full"
default-filter = "package(gammalooprs) and test(=uv::approx::integrated::native_mass_tests::native_two_loop_qcd_bare_mass_matches_primary_reference)"
test-threads = 1

[[profile.ci_os_mass_reference.overrides]]
filter = "all()"
threads-required = "num-test-threads"

[profile.ci_os_mass_reference.junit]
path = "junit.xml"
store-success-output = true

[test-groups]
integration = { max-threads = 2 }
memory-intensive = { max-threads = 2 }
flaky = { max-threads = 1 }
symbolica-singleton = { max-threads = 1 }
gammalooprs-diagnostics = { max-threads = 1 }
soft-ct-serial = { max-threads = 1 }
scalar-lu-serial = { max-threads = 1 }
