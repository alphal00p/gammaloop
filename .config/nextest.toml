slow-timeout = { period = "120s", terminate-after = 2, on-timeout = "fail" }
test-threads = 16
retries = 0
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "fail"

[profile.default.junit]
path = "junit.xml"

# Resource reservations apply to every selected profile. Per-test overrides of
# an inherited custom profile are not inherited by Nextest, so keep them here.

# Integration workers and evaluator-heavy fixtures retain their existing budgets.

# Previously unmeasured slow generators may allocate large evaluators or share
# fixture directories. Run one at a time within a worker; main shards use
# isolated workers. The measured scalar family already reserves all slots.
[[profile.default.overrides]]
filter = "test(/(^|::)slow::/)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(integration)"
test-group = "integration"

[[profile.default.overrides]]
# This thermal acceptance does not match the generic integration-name filter.
filter = "test(=cool_qm_eos::cool_qm_eos_nlo_matches_example_target)"
test-group = "integration"

[[profile.default.overrides]]
filter = "test(/(^|::)epem_a_ddx_nlo_is_alpha_s_over_pi_times_lo_in_all_local_uv_routes$/) or test(/(^|::)epem_a_ttx_msbar_nlo_matches_the_published_inclusive_ratio_in_all_local_uv_routes$/) or test(/(^|::)gamma_star_ddx_msbar_nlo_matches_the_published_graph_cross_sections$/) or test(/(^|::)gamma_star_ttx_msbar_nlo_matches_the_published_absolute_cross_sections$/) or test(=test_integrated_uv_cts::scalar_bubble_integrated) or test(=sunrise_scalar_1_uv) or test(=dotted_sunrise_uv) or test(=thermal_sunrise_uv)"
test-group = "integration"
threads-required = 10

# Nextest isolates tests in separate processes, so the public Typst fixture
# cache does not share its expensive render across these SVG probes. Bound
# concurrent renderer children using the existing resource group.
[[profile.default.overrides]]
filter = "package(clinnet) and binary(=public_typst_behavior)"
test-group = "memory-intensive"

# Inclusive OS scale scans are a full-main workload; reserve a worker.
[[profile.default.overrides]]
filter = "test(=gamma_star_ttx::gamma_star_ttx_os_nlo_matches_the_analytic_inclusive_cross_section_and_auxiliary_scales)"
test-group = "integration"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(heavy) or test(memory) or test(large)"
test-group = "memory-intensive"

[[profile.default.overrides]]
filter = "package(vakint)"
test-group = "symbolica-singleton"

[[profile.default.overrides]]
filter = "package(gammalooprs) and test(/^uv::approx::local_(3d|4d)::tests::/)"
test-group = "symbolica-singleton"

[[profile.default.overrides]]
filter = "test(/^uv::hedge_poset::tests::bugblatter$/) or test(/^aaa$/)"
test-group = "gammalooprs-diagnostics"

[[profile.default.overrides]]
filter = "test(/^uv::approx::direct_3d::kernel::on_shell_tests::direct_os_quark_in_gluon_complete_forest_matches_at_(first|second)_point$/)"
# Each complete open-spinor comparison peaks near 11 GiB. Reserve the worker
# while retaining the ordinary four-minute bound for each case.
threads-required = "num-test-threads"

# These UV fixtures share generated-state directories across test processes.

[[profile.default.overrides]]
filter = "package(gammaloop-integration-tests) and binary(uv) and (test(/^local_os_performance_/) or test(/^slow::local_os_/))"
test-group = "soft-ct-serial"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "package(gammaloop-integration-tests) and binary(uv) and test(/^(dgse_local_ir_profiles_are_non_vacuous|dgse_local_ir_generation_orientation_filter_profiles_one_orientation|massless_quark_self_energy_local_ir_profile_is_non_vacuous|massless_gluon_self_energy_local_ir_profile_is_non_vacuous|soft_cff_state_survives_a_fresh_process_reload|massive_top_self_energy_local_os_dispatch_uses_projected_four_d|paper_appendix_b1_os_child_direct_dispatch_keeps_mixed_prescriptions|paper_appendix_b1_os_child_projects_with_live_parent_momentum|local_ir_disconnected_completed_components_form_nonzero_union|consecutive_soft_components_have_exact_forest_and_cli_profile|local_ir_integrated_generation_succeeds_across_local_uv_routes|genuine_vacuum_tadpole_matches_all_local_uv_routes_and_vakint_inputs|local_os_primitive_orientations_have_local_uv_controls|local_os_integrated_generation_agrees_across_three_routes|local_os_fixed_boosted_integrated_generation_agrees_across_three_routes|local_os_fixed_boosted_rotation_policy_survives_state_reload|local_os_nested_generation_agrees_across_three_routes|local_ir_and_pole_part_wood_is_rejected_by_run_generate|local_ir_child_under_positive_degree_muv_parent_is_rejected_by_run_generate)$/)"
test-group = "soft-ct-serial"

[[profile.default.overrides]]
filter = "test(=test_generate_amplitude_1l_sm_jets) or test(=test_generate_amplitude_1l_sm_jets_with_grouping) or test(=test_dis_isr) or test(=test_vacuum_amplitude_generation_full_sm_two_loop) or test(=test_vacuum_amplitude_generation_full_sm_three_loop_raw)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(=integrations::scalar_sunrise) or test(=integrations::scalar_mercedes) or test(=aa_aa::aa_aa_integrated_graph_histogram_bins) or test(=smoke::test_epem_dd_dt)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "binary(=test_runs) and (\n    test(=approach::approach_amplitude_json_has_synthetic_cut_and_threshold_weights)\n    or test(=events::amplitude_events_surface_threshold_counterterms_and_reproduce_weight)\n    or test(=events::amplitude_threshold_counterterms_follow_lmb_channel_normalization)\n    or test(=events::amplitude_selectors_generate_internal_events_without_surfacing_them)\n    or test(=events::amplitude_observables_accumulate_without_returning_events)\n    or test(=inspect::inspect_x_space_reports_missing_discrete_dimensions_cleanly)\n    or test(=aa_aa::important::aa_aa_local_inspect_backend_consistency)\n)\n"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(/^gl20_multichannel_local_inspect_event_snapshot$/) or test(=scalar_3l_cross_section_inspects::scalar_3l_gl00_higher_power_cff_is_invariant_under_nonzero_sampling_scale)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "binary(=test_runs) and test(/^scalar_3l_cross_section_inspects::/)"
test-group = "scalar-lu-serial"
threads-required = "num-test-threads"

# Mandatory soft-CT acceptances generate large symbolic fixtures and must not
# contend. The full/slow profiles retain their bounded two-hour timeout.
[[profile.default.overrides]]
filter = "test(/^slow::(paper_figure_b1_massless_bubble_uses_a_complete_soft_wood|paper_figure_b1_double_triangle_is_a_non_vacuous_uv_fixture|local_nested_soft_fixture_generates|paper_appendix_b1_ir_specialization_generates_and_profiles|gamma_star_ddbar_top_bubble_child_only_has_two_power_soft_improvement|gamma_star_ddbar_top_bubble_has_two_power_soft_improvement)$/)"
test-group = "soft-ct-serial"
threads-required = "num-test-threads"

# Feyngen tests use one generated-state directory; in-process locks cannot
# protect that directory across Nextest's separate test processes.
[[profile.default.overrides]]
filter = "package(gammaloop-integration-tests) and binary(=test_feyngen)"
test-group = "feyngen-serial"

[profile.ci_gammaloop]
inherits = "default"

# A selected-profile override takes priority over future default overrides.
# Every fast test must fail after 240 seconds, including explicit selections.
[[profile.ci_gammaloop.overrides]]
filter = "all()"
slow-timeout = { period = "120s", terminate-after = 2, on-timeout = "fail" }

[profile.ci_gammaloop.junit]
path = "junit.xml"

