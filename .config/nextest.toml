# Runtime selection and resource policy for local tests, NixCI and main.
# Package/archive/shard callers select a profile; they must not repeat these lists.
nextest-version = "0.9.137"

# Existing quarantine, pending a dedicated assertion/reference audit. These are
# not established unsupported physics cases and are not counted as passed.
# Keep all 44 exact exclusions below visible; a new `failing` module is not
# automatically excluded. There are 17 integration, 25 gammalooprs and two
# Idenso color-matrix investigations; their existing assertions are unchanged.
# Ignored tests retain Rust's explicit opt-in semantics. Vakint PySecDec cases
# remain manual. The separately owned OS mass reference has one pinned main-only
# runtime/profile; it is excluded from the general package selections.

[profile.default]
# Strict fast lane. Seven cases exceeded 240s in the matched CI-optim runs;
# the other 36 slow cases have not been timed. The remaining 139 scalar cases
# are included despite their `slow` module names. See docs/architecture/ci.typ.
# The fixed-statistics self-energy acceptance and inclusive OS auxiliary-scale
# scan also run in the main-only lane.
