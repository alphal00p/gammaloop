# Nextest configuration for gammaloop
# This file configures test execution, timeouts, and partitioning behavior

# Required for emulated libtest `--skip` and `--exact` arguments used by the
# test recipes. Older versions fail before running the selected tests.
# Custom profile inheritance additionally requires nextest 0.9.115.
nextest-version = "0.9.115"

[profile.default]
# Slow tests get extra time
slow-timeout = { period = "10s", terminate-after = 6 }
# Test threads - use all available cores for maximum parallelism
test-threads = "num-cpus"
fail-fast = false
# Failure output configuration
failure-output = "immediate"
success-output = "never"
# Retry configuration for flaky tests
retries = 1
# Status level configuration
status-level = "fail"
final-status-level = "fail"

[[profile.default.overrides]]
# Mark integration tests as slow
filter = "test(integration)"
test-group = "integration"

[[profile.default.overrides]]
# Each NLO acceptance internally launches ten integration workers. Account for
# those workers in nextest's scheduler and cap these acceptances with the
# existing integration-test group.
filter = "test(/^epem_a_ddx_nlo_is_alpha_s_over_pi_times_lo_in_all_local_uv_routes$/) or test(/^epem_a_ttx_msbar_nlo_matches_the_published_inclusive_ratio_in_all_local_uv_routes$/) or test(/^gamma_star_ddx_msbar_nlo_matches_the_published_graph_cross_sections$/) or test(/^gamma_star_ttx_msbar_nlo_matches_the_published_absolute_cross_sections$/)"
test-group = "integration"
threads-required = 10

[[profile.default.overrides]]
# Mark tests with "heavy" in the name as memory-intensive
filter = "test(heavy) or test(memory) or test(large)"
test-group = "memory-intensive"

[[profile.default.overrides]]
# Mark benchmark-style tests as very slow
filter = "test(bench) or test(benchmark)"

[[profile.default.overrides]]
# This production GL20 event snapshot intentionally generates the fully grouped NLO graph before
# selecting it, and its Symbolica evaluator construction exceeds the generic one-minute timeout.
filter = "test(/^gl20_multichannel_local_inspect_event_snapshot$/)"
slow-timeout = { period = "5m", terminate-after = 2 }

[profile.default.junit]
# Default JUnit output location
path = "target/nextest/default/junit.xml"

[profile.test_gammaloop]
inherits = "default"
# Reuse the default profile behavior but disable early termination for this curated suite.
slow-timeout = "30y"
test-threads = 5
retries = 0
default-filter = "not test(/(^|::)(slow|failing)::/)"

[[profile.test_gammaloop.overrides]]
# These tests construct large evaluators or launch their own integration workers.
# Reserve the complete local budget without changing their modes or sample counts.
# Spectacles is named "integrated", so the generic "integration" rule misses it.
filter = "test(/^gl20_multichannel_local_inspect_event_snapshot$/) or test(/^epem_a_ddx_nlo_is_alpha_s_over_pi_times_lo_in_all_local_uv_routes$/) or test(/^epem_a_ttx_msbar_nlo_matches_the_published_inclusive_ratio_in_all_local_uv_routes$/) or test(/^gamma_star_ddx_msbar_nlo_matches_the_published_graph_cross_sections$/) or test(/^gamma_star_ttx_msbar_nlo_matches_the_published_absolute_cross_sections$/) or test(/(^|::)scalar_spectacles_integrated_uv_factorizes_over_bridge$/)"
threads-required = 5
# Report long executions without turning a timeout into a pass or dropping a test.
slow-timeout = "1m"

[[profile.test_gammaloop.overrides]]
# These six gg->hhh fixture users each construct the same large evaluator.
# Their serial_test locks do not coordinate nextest's separate processes, so
# reserve the local budget to keep their peak allocations from overlapping.
filter = '''
binary(=test_runs) and (
    test(=approach::approach_amplitude_json_has_synthetic_cut_and_threshold_weights)
    or test(=events::amplitude_events_surface_threshold_counterterms_and_reproduce_weight)
    or test(=events::amplitude_threshold_counterterms_follow_lmb_channel_normalization)
    or test(=events::amplitude_selectors_generate_internal_events_without_surfacing_them)
    or test(=events::amplitude_observables_accumulate_without_returning_events)
    or test(=inspect::inspect_x_space_reports_missing_discrete_dimensions_cleanly)
)
'''
threads-required = 5

[profile.ci]
slow-timeout = { period = "120s", terminate-after = 2 }
# Use all available cores in CI for faster execution
test-threads = "num-cpus"
# More verbose output for debugging CI failures
failure-output = "immediate-final"
success-output = "never"
# No retries in CI to avoid masking real issues
retries = 0
# Fail fast disabled to collect all failures
fail-fast = false
# Enhanced status reporting
status-level = "fail"
final-status-level = "fail"

[profile.ci.junit]
# JUnit output for CI systems
path = "junit.xml"

[profile.ci_gammaloop]
inherits = "ci"
default-filter = "not test(/(^|::)(slow|failing)::/)"

[profile.ci_gammaloop.junit]
path = "junit.xml"

[[profile.ci_gammaloop.overrides]]
# Vakint tests can end up running restricted Symbolica instances in nix-ci,
# which behaves as a singleton per machine when the full license is unavailable.
filter = "package(vakint)"
test-group = "symbolica-singleton"

[[profile.ci_gammaloop.overrides]]
# These diagnostics pass in isolation but can exceed the CI profile timeout when
# they contend with the full gammalooprs suite.
filter = "test(/^uv::hedge_poset::tests::bugblatter$/) or test(/^aaa$/)"
test-group = "gammalooprs-diagnostics"
slow-timeout = { period = "5m", terminate-after = 2 }

[[profile.ci.overrides]]
# In CI, be extra conservative with timeouts
filter = "test(integration) or test(heavy) or test(memory) or test(large)"

[[profile.ci.overrides]]
# The NLO acceptances launch ten internal integration workers. The CI profile
# does not inherit profile.default overrides, so reserve the same resources
# explicitly and allow the two-iteration numerical integrations to complete.
filter = "test(/^epem_a_ddx_nlo_is_alpha_s_over_pi_times_lo_in_all_local_uv_routes$/) or test(/^epem_a_ttx_msbar_nlo_matches_the_published_inclusive_ratio_in_all_local_uv_routes$/) or test(/^gamma_star_ddx_msbar_nlo_matches_the_published_graph_cross_sections$/) or test(/^gamma_star_ttx_msbar_nlo_matches_the_published_absolute_cross_sections$/)"
test-group = "integration"
threads-required = 10
slow-timeout = { period = "15m", terminate-after = 2 }

[[profile.ci.overrides]]
# These six gg->hhh fixture users and the aa->aa backend comparison construct
# large evaluators. Reserve the complete CI budget as in the local suite so
# their allocations cannot overlap, regardless of the runner's CPU count.
filter = '''
binary(=test_runs) and (
    test(=approach::approach_amplitude_json_has_synthetic_cut_and_threshold_weights)
    or test(=events::amplitude_events_surface_threshold_counterterms_and_reproduce_weight)
    or test(=events::amplitude_threshold_counterterms_follow_lmb_channel_normalization)
    or test(=events::amplitude_selectors_generate_internal_events_without_surfacing_them)
    or test(=events::amplitude_observables_accumulate_without_returning_events)
    or test(=inspect::inspect_x_space_reports_missing_discrete_dimensions_cleanly)
    or test(=aa_aa::important::aa_aa_local_inspect_backend_consistency)
)
'''
threads-required = "num-test-threads"

[[profile.ci.overrides]]
# Benchmark tests get even more time in CI
filter = "test(bench) or test(benchmark)"

[[profile.ci.overrides]]
# Keep the production GL20 event snapshot under the same explicit bound in CI.
filter = "test(/^gl20_multichannel_local_inspect_event_snapshot$/)"
threads-required = "num-test-threads"
slow-timeout = { period = "5m", terminate-after = 2 }

[profile.partition]
slow-timeout = { period = "120s", terminate-after = 2 }
# Use multiple threads even in partitions for better performance
test-threads = "num-cpus"
failure-output = "immediate"
success-output = "never"
retries = 0
fail-fast = false

[test-groups]
# Group integration tests that might be slow - allow some parallelism
integration = { max-threads = 2 }
# Group tests that use a lot of memory - limit but don't serialize completely
memory-intensive = { max-threads = 2 }
# Group tests that might be flaky - serialize these for stability
flaky = { max-threads = 1 }
# Serialize packages that depend on a singleton external runtime in CI.
symbolica-singleton = { max-threads = 1 }
# Serialize long gammalooprs diagnostics so they do not time out under suite contention.
gammalooprs-diagnostics = { max-threads = 1 }

[profile.local_test]
fail-fast = true
slow-timeout = { period = "1m", terminate-after = 3, on-timeout = "pass" }
global-timeout = "120m"

[profile.local_test_all]
slow-timeout = { period = "5m" }
fail-fast = false
