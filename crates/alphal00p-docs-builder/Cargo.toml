[package]
name = "alphal00p-docs-builder"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
watch = [
  "dep:comemo",
  "dep:notify",
  "dep:tiny_http",
  "dep:typst",
  "dep:typst-bundle",
  "dep:typst-kit",
  "dep:typst-pdf",
]

[dependencies]
alphal00p-docs-schema = { path = "../alphal00p-docs-schema" }
alphal00p-persistence.workspace = true
alphal00p-workspace = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chrono.workspace = true
comemo = { version = "=0.5.1", optional = true }
eyre.workspace = true
linnest = { workspace = true, features = ["svg"] }
notify = { workspace = true, optional = true }
percent-encoding.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3.8"
tiny_http = { workspace = true, optional = true }
toml.workspace = true
# `Cargo.lock` deliberately holds Typst's internal component family at 0.15.1
# as well, matching the Nix-provided CLI used for release output parity.
typst = { version = "=0.15.1", optional = true }
typst-bundle = { version = "=0.15.1", optional = true }
typst-kit = { version = "=0.15.1", default-features = false, features = [
  "datetime",
  "embedded-fonts",
  "emit-diagnostics",
  "scan-fonts",
  "system-downloader",
  "system-files",
], optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
walkdir.workspace = true

