[package]
name = "spenso"
version = "0.6.0"
edition = "2024"
description = "A tensor (n-dim array) network, iterating, and contraction (using automatic abstract index matching) library."
documentation = "https://docs.rs/spenso/latest/spenso/"
license = "MIT OR Apache-2.0"
keywords = ["contraction", "tensors"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/spenso.rs"

[[example]]
name = "symbolica_lazy_deadlock_mwe"
path = "examples/symbolica_lazy_deadlock_mwe.rs"
required-features = ["symbolica"]

[[bench]]
name = "symbolic_parallelism"
harness = false
required-features = ["symbolica"]

# [[test]]
# name = "three_loop"
# path = "tests/three_loop.rs"
# required-features = ["symbolica"]

[dependencies]
ahash = { workspace = true, features = ["serde"] }
append-only-vec = "0.1.6"
# approxim = "0.6.6"
# auto_enums = "0.8.6"
bincode = { workspace = true, features = ["serde"] }
# ambassador = "0.3.6"
#
bincode-trait-derive = { version = "0.1.1" }
# bincode = "2"
bitvec = { version = "1.0.1", features = ["serde"] }
# const_format = { version = "0.2.32", features = ["rust_1_51"] }
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "display", "from", "index", "into", "into_iterator", "mul", "mul_assign"] }
# disjoint_impls = "0.7.1"
dyn-clone = { version = "1.0.17", optional = true }
enum-try-as-inner = "0.1.1"
eyre = { workspace = true }
# flexi_logger = "0.28.5"
gat-lending-iterator = "0.1.5"
indexmap = { workspace = true, features = ["serde"] }
linnet = { workspace = true, default-features = false, features = ["bincode", "serde"] }

log = "0.4.22"
num-traits = "0.2.19"
rand = { version = "0.9", optional = true }
rayon = "1.10.0"
ref-ops = "0.2.5"
serde = "1.0"
spenso-macros = { workspace = true, default-features = false }
# serde_toml = "0.0.1"
# slotmap = { version = "1.0.7", features = ["serde"] }
# smartstring = { version = "1.0.1", features = ["serde"] }
symbolica-utils = { workspace = true, default-features = false, optional = true }
tabled = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
# approx-derive = "0.2.6"

pyo3 = { workspace = true, optional = true }

colored = { workspace = true, optional = true }
nu-ansi-term = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
gammaloop-workspace-hack = { version = "0.1", path = "../gammaloop-workspace-hack", optional = true }
ciborium = { version = "0.2.2", optional = true }
blake3 = { version = "1.8.3", optional = true }
symbolica-typst-atom-payload = { workspace = true, optional = true }

[dependencies.symbolica]
version = "3.0.0"
default-features = false
features = ["bincode", "serde"]
optional = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1.38.0"

[features]
default = ["native"]
native = [
  "linnet/native",
  "symbolica-utils?/native",
  "symbolica-typst-atom-payload?/native",
]
native-code-generation = [
  "native",
  "symbolica",
  "symbolica/native_code_generation",
  "dep:gammaloop-workspace-hack",
]
portable-payload = [
  "symbolica",
  "dep:blake3",
  "dep:ciborium",
  "dep:symbolica-typst-atom-payload",
]
python = ["dep:pyo3"]
python-stubs = ["dep:pyo3-stub-gen", "python"]
symbolica = [
  "dep:symbolica",
  "dep:symbolica-utils",
  "dep:rand",
  "dep:colored",
  "dep:dyn-clone",
  "dep:nu-ansi-term",
  "dep:tracing",
  "linnet/symbolica",
]
wasm = [
  "linnet/wasm",
  "symbolica-utils?/wasm",
  "symbolica-typst-atom-payload?/wasm",
]
