[package]
name = "feynkit-model"
version = "0.1.0"
edition.workspace = true
description = "Standalone particle-physics model types for the feynkit ecosystem"
repository = "https://github.com/alphal00p/gammaloop"
license = "MIT OR Apache-2.0"
keywords = ["feynman", "hep", "physics", "ufo"]
categories = ["science"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
vectorize = "0.2.0"
