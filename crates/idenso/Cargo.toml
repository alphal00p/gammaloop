[package]
name = "idenso"
version = "0.3.0"
edition = "2024"
description = "Tensor identities for symbolica"

[dependencies]
symbolica-notation = { workspace = true }
ahash = { workspace = true }
bincode = { workspace = true, optional = true }
bincode-trait-derive = { workspace = true, optional = true }
eyre = { workspace = true }
itertools = { workspace = true }
linnet = { workspace = true, default-features = false, features = ["serde"] }
spenso = { workspace = true, default-features = false, features = ["symbolica"] }
spenso-macros = { workspace = true, default-features = false }
symbolica = { workspace = true }
symbolica-utils = { workspace = true, default-features = false }

nu-ansi-term = { workspace = true }
thiserror = { workspace = true }

blake3 = "1.8.3"
delegate = "0.13.5"

[dev-dependencies]
base64 = "0.22.1"
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.18.1"
insta = { workspace = true }

[[bench]]
name = "schoonschip_modes"
harness = false

[[bench]]
name = "schoonschip_modes_time"
harness = false

[[bench]]
name = "vertex_algebra"
harness = false

[[bench]]
name = "vertex_algebra_time"
harness = false

[[bench]]
name = "vertex_algebra_once"
harness = false

[[example]]
name = "metric_contraction_benchmark"
required-features = ["reference-cases"]

[[example]]
name = "contraction_phase_benchmark"
required-features = ["reference-cases"]

[features]
default = ["native"]
bincode = ["dep:bincode", "dep:bincode-trait-derive"]
native = [
  "linnet/native",
  "spenso/native",
  "symbolica/integer-gmp",
  "symbolica/float-mpfr",
  "symbolica-utils/native",
]
reference-cases = []
wasm = [
  "linnet/wasm",
  "spenso/wasm",
  "symbolica/wasm",
  "symbolica-utils/wasm",
]
