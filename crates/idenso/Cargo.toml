[package]
name = "idenso"
version = "0.3.0"
edition = "2024"
description = "Tensor identities for symbolica"

[dependencies]
bincode = { workspace = true }
bincode-trait-derive = { workspace = true }
eyre = { workspace = true }
itertools = { workspace = true }
linnet = { workspace = true, default-features = false, features = ["serde"] }
spenso = { workspace = true, default-features = false, features = ["symbolica"] }
spenso-macros = { workspace = true, default-features = false }
symbolica = { workspace = true }
symbolica-utils = { workspace = true, default-features = false }

nu-ansi-term = { workspace = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
thiserror = { workspace = true }

blake3 = "1.8.3"
delegate = "0.13.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.18.1"
insta = { workspace = true }

[[bench]]
name = "schoonschip_modes"
harness = false

[[bench]]
name = "schoonschip_modes_time"
harness = false

[[bench]]
name = "vertex_algebra"
harness = false

[[bench]]
name = "vertex_algebra_time"
harness = false

[[bench]]
name = "vertex_algebra_once"
harness = false

[features]
default = ["native"]
native = ["spenso/native"]
reference-cases = []
python = ["dep:pyo3", "symbolica/python_export"]
python-stubs = ["dep:pyo3-stub-gen", "python", "symbolica/python_stubgen"]
wasm = ["spenso/wasm"]
