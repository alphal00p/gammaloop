# The normal gammalooprs CI graph enables arrayvec's std/default feature set
# through Symbolica. Keep this small anchor so reusable native consumers
# retain the same feature set outside Hakari's managed section.
[dependencies.arrayvec]
version = "0.7"
features = ["std"]

# The root gammalooprs graph also enables indenter/std through color-eyre.
# Without this, vakint is built against eyre -> indenter(default), while the
# final gammalooprs graph asks for eyre -> indenter(default,std), causing vakint
# to be rebuilt in the root derivation.
[dependencies.indenter]
version = "0.3"
features = ["std"]

[build-dependencies.arrayvec]
version = "0.7"
features = ["std"]

[build-dependencies.indenter]
version = "0.3"
features = ["std"]

# Documentation and tests activate these additive features on dependencies of
# the GammaLoop libraries. Keep their native library artifacts interchangeable.
[dependencies.figment]
version = "0.10"
features = ["json"]

[dependencies.derive_more]
version = "2"
features = ["add", "add_assign", "as_ref", "deref", "deref_mut", "display", "from", "index", "into", "into_iterator", "is_variant", "mul", "mul_assign"]

[build-dependencies.derive_more]
version = "2"
features = ["add", "add_assign", "as_ref", "deref", "deref_mut", "display", "from", "index", "into", "into_iterator", "is_variant", "mul", "mul_assign"]

[build-dependencies.syn]
version = "2"
features = ["extra-traits", "fold", "full", "visit", "visit-mut"]

# Table formatting is target-only. Preserve the native CI feature union without
# compiling the ANSI table stack again for the hack's build script.
[dependencies.tabled]
version = "0.22"
default-features = false
features = ["ansi", "derive", "std"]
