[package]
name = "gammaloop-api"
version = "0.1.0"
edition = "2021"

description = "An implementation of the Local Unitarity method for computing differential collider cross-sections."
repository = "https://github.com/alphal00p/gammaloop"
license = "MIT OR Apache-2.0"
keywords = ["cross-section", "loop", "perturbative", "physics"]
categories = ["science"]
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
bench = false
name = "gammaloop"
path = "src/cli.rs"
required-features = ["cli"]

[dependencies]
ahash = { workspace = true, features = ["serde"] }
bincode = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["unstable-ext"] }
clap_complete = { version = "4.5.57", optional = true }
clap_complete_nushell = { version = "4.5.10", optional = true }
# clap-repl = "0.3.2"
color-eyre = { workspace = true }
colored = { workspace = true }
console = "0.16.3"
crossterm = "0.29"
dirs = { workspace = true }
eyre = { workspace = true }
figment = { version = "0.10.19", features = ["json"] }
gammaloop-tracing-filter = { workspace = true, features = ["clap"] }
gammalooprs = { workspace = true }
three-dimensional-reps = { workspace = true, features = ["display", "cli"] }
idenso = { workspace = true, features = ["native"] }
include_dir = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
json5 = { workspace = true }

ndarray = { workspace = true }
nu-ansi-term = { workspace = true }
numpy = { workspace = true, optional = true }
ratatui = { workspace = true }
rayon = { workspace = true }
reedline = { version = "0.44", optional = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = "1.3.0"
smartstring = { workspace = true, features = ["serde"] }
spenso = { workspace = true, features = ["native", "symbolica"] }
# symbolica = { version = "0.18.0", default-features = false }
tabled = { workspace = true, features = ["ansi", "derive"] }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }

unicode-width = "0.2.2"
walkdir = { workspace = true }
gammaloop-workspace-hack = { version = "0.1", path = "../gammaloop-workspace-hack" }

[dependencies.linnet]
workspace = true
features = [
  "bincode",
  "serde",
  "symbolica",
]
# PyO3: optional for embedding. Auto-init at runtime.
[dependencies.pyo3]
workspace = true
# The abi3 feature changes compatibility without activating Python support.
features = ["auto-initialize", "eyre"]
optional = true

[dependencies.pyo3-stub-gen]
workspace = true
optional = true
features = ["numpy"]

[dependencies.pyo3-stub-gen-derive]
workspace = true
optional = true

[dependencies.symbolica]
workspace = true
default-features = false
features = [
  "bincode",
  "serde",
]

[dependencies.tracing-subscriber]
workspace = true
features = [
  "env-filter",
  "fmt",
  "json",
  "time",
]

[dependencies.typed-index-collections]
workspace = true
features = [
  "bincode",
  "serde",
  "serde-alloc",
]
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
pyo3-build-config = { workspace = true, optional = true }
walkdir = { workspace = true }

[features]
# Keep Python optional unless explicitly enabled.
default = ["cli"]
cli = ["dep:clap_complete", "dep:clap_complete_nushell", "dep:reedline"]
extension-module = [
  "python",
  "pyo3/extension-module"
]
abi3 = ["pyo3?/abi3-py37"]
python = [
  "dep:pyo3-stub-gen-derive",
  "dep:numpy",
  "dep:pyo3-build-config",
  "gammaloop-tracing-filter/python",
  "gammalooprs/python",
  "ufo-import",
]
python-stubs = [
  "dep:pyo3-stub-gen",
  "gammalooprs/python-stubs",
  "python",
]
ufo-import = ["dep:pyo3"]
