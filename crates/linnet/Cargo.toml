[package]
name = "linnet"
version = "0.17.0"
edition = "2021"
description = "A library for working with half-edge data structures, and subgraphs, and drawing them"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "linnet"
path = "src/lib.rs"

[dependencies]
bincode = { workspace = true, features = ["serde"], optional = true }
bincode-trait-derive = { workspace = true, optional = true }
bitvec = { version = "1.0.1" }
cgmath = { version = "0.18.0", optional = true }
# derive_more = "0.99.17"
# hibit_tree = "0.1.0-alpha.3"
dot-parser = "0.5"
figment = { version = "0.10.19" }
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
indenter = { version = "0.3.3", features = ["std"] }
indexmap = { workspace = true }
itertools = "0.14.0"
paste = "1.0.15"
rand = { version = "0.8.5", features = ["small_rng"] }
rkyv = { version = "0.7", features = ["bitvec", "validation"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
symbolica = { workspace = true, default-features = false, optional = true }
symbolica-utils = { workspace = true, optional = true }
thiserror = { workspace = true }

[dependencies.ahash]
version = "0.8.11"
default-features = false
features = ["std"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash = { version = "0.8.11", default-features = false, features = ["runtime-rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ahash = { version = "0.8.11", default-features = false, features = ["compile-time-rng"] }

[target.x86_64-unknown-linux-gnu.dependencies]
gammaloop-workspace-hack = { version = "0.1", path = "../gammaloop-workspace-hack", optional = true }

[dev-dependencies]
figment = "0.10.19"
# vers-vecs = { version = "1.6.1", features = ["simd"] }
# vob = "3.0.3"
# smallbitvec = "2.6.0"
# bit-vec = "0.8.0"
# roaring = { version = "0.10.10" }
# hi_sparse_bitset = { version = "0.6.1", features = ["simd"] }
# hibitset = "0.6.4"
# fixedbitset = "0.5.7"
insta = { workspace = true, features = ["ron"] }
kurbo = "0.13"
# Keep optional drawing and serialization covered by isolated Linnet tests.
linnet = { path = ".", features = ["drawing", "rkyv", "serde"] }
serde = "1.0"

[features]
default = ["native", "serde"]
bincode = ["dep:bincode", "dep:bincode-trait-derive", "serde"]
drawing = ["dep:cgmath", "cgmath/serde"]
energy-timing = ["drawing"]
nodestore-forest-child-vec = []
nodestore-forest-parent-child = []
rkyv = ["dep:rkyv"]
serde = ["bitvec/serde", "dep:serde"]
symbolica = ["dep:symbolica", "dep:symbolica-utils"]
native = [
  "dep:gammaloop-workspace-hack",
  "symbolica-utils?/native",
]
wasm = ["symbolica-utils?/wasm"]
# layout = ["dep:argmin"]
