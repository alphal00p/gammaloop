[package]
name = "feynkit-graph"
version = "0.1.0"
edition.workspace = true
description = "Standalone Feynman-diagram representation and topology tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphal00p/gammaloop"
keywords = ["feynman", "graph", "physics"]
categories = ["science"]

[dependencies]
feynkit-kinematics = { version = "0.1.0", path = "../feynkit-kinematics" }
feynkit-model = { version = "0.1.0", path = "../feynkit-model" }
linnet = { version = "0.17.0", path = "../linnet", default-features = false, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
symbolica = { workspace = true, default-features = false }
thiserror = { workspace = true }
spenso = { workspace = true, features = ["shadowing"] }

[features]
default = ["native"]
native = ["linnet/native", "feynkit-model/native"]
wasm = ["linnet/wasm", "symbolica/wasm", "spenso/wasm"]
