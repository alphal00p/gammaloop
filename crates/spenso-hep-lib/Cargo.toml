[package]
name = "spenso-hep-lib"
version = "0.1.7"
edition = "2024"
description = "A spenso tensor library for high energy physics"

[dependencies]
idenso = { workspace = true, features = ["reference-cases"] }
spenso = { workspace = true, features = ["symbolica"] }
symbolica = { workspace = true }

gammaloop-workspace-hack = { version = "0.1", path = "../gammaloop-workspace-hack", optional = true }

[features]
default = ["native"]
native = ["idenso/native", "dep:gammaloop-workspace-hack"]
wasm = ["idenso/wasm"]

[dev-dependencies]
ahash = { workspace = true, features = ["serde"] }
insta = { workspace = true }
tabled = { workspace = true, features = ["derive"] }
