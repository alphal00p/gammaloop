[package]
name = "typst-renderer"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Offline in-process Typst compilation for notebook rendering"

[features]
default = []
# Standalone document rendering retains export formats and font discovery.
full = [
    "typst-library/full",
    "typst-svg/pdf",
    "dep:typst-pdf",
    "dep:typst-render",
    "typst-kit/embedded-fonts",
    "typst-kit/scan-fonts",
]

[dependencies]
typst = "=0.15.1"
# The paths name the workspace patches, so Maturin also carries them into sdists.
typst-library = { version = "=0.15.1", path = "../../vendor/typst-library" }
typst-kit = { version = "=0.15.1", default-features = false }
comemo = "0.5"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = { version = "=0.15.1", optional = true }
typst-render = { version = "=0.15.1", optional = true }
typst-svg = { version = "=0.15.1", path = "../../vendor/typst-svg" }

tempfile = "3.8"
