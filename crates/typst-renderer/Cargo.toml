[package]
name = "typst-renderer"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Offline in-process Typst compilation for notebook rendering"

[dependencies]
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts"] }
comemo = "0.5"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"

[dev-dependencies]
tempfile = "3.8"
