[package]
name = "vakint"
version = "0.1.2"
edition = "2024"
description = "Computation of single-scale vacuum integrals for High-Energy Physics"
readme = "README.md"
homepage = "https://alphal00p.github.io/"
repository = "https://github.com/alphal00p/vakint"
license = "MIT"
keywords = ["QFT", "integral", "physics", "vaccuum"]
categories = ["science"]

[dependencies]
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, default-features = false, optional = true }

ahash = "0.8.12"
colored = { workspace = true }
eyre = { workspace = true }
log = "0.4.29"
regex = "1.12.2"
rug = "1.28.0"
thiserror = { workspace = true }
version-compare = "0.2.1"

[dependencies.symbolica]
workspace = true
default-features = false
features = ["integer-gmp", "float-mpfr", "tracing_max_level_info"]

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "tracing-log"] }

[features]
python-stubs = [
  "python",
  "dep:pyo3-stub-gen",
  "symbolica/python_stubgen",
]
python = ["dep:pyo3", "symbolica/python_export"]
