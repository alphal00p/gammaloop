[package]
name = "vakint"
version = "0.1.2"
edition = "2024"
description = "Computation of single-scale vacuum integrals for High-Energy Physics"
readme = "README.md"
homepage = "https://alphal00p.github.io/"
repository = "https://github.com/alphal00p/vakint"
license = "MIT"
keywords = ["QFT", "integral", "physics", "vaccuum"]
categories = ["science"]

[dependencies]
pyo3 = { workspace = true, features = ["anyhow"], optional = true }
pyo3-stub-gen = { workspace = true, default-features = false, optional = true }
pyo3-stub-gen-derive = { workspace = true, optional = true }

ahash = "0.8.12"
arrayvec = "0.7.4"
colored = { workspace = true }
eyre = { workspace = true }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", optional = true }
feynkit-tensor = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
flate2 = "1.1.9"
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
log = "0.4.29"
once_cell.workspace = true
regex = "1.12.2"
ratatui = { workspace = true, features = ["crossterm_0_28"], optional = true }
crossterm = { version = "0.28.1", optional = true }
rug = "1.28.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rustred.workspace = true
rustred-app.workspace = true
sha2 = "0.10.9"
spenso = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
spenso-macros = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
string-template-plus = "0.4.3"
thiserror = { workspace = true }
version-compare = "0.2.1"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
tar = "0.4.46"
tempfile = "3.27.0"
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }

[dependencies.phf]
version = "0.13.1"
features = ["macros"]

[dependencies.symbolica]
workspace = true
default-features = false
features = ["integer-gmp", "float-mpfr", "tracing_max_level_info"]

[dev-dependencies]
linnet = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
feynkit-generator = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces" }
test-log = "0.2.19"

[features]
progress-tui = ["dep:ratatui", "dep:crossterm", "rustix/termios"]
feynkit-ingress = []
# Expose candidate diagnostics and offline validation helpers.
experimental-rustred = []
# Local dependent-libtest gate; no default runtime observation or policy knob.
weighted-lowering-diagnostics = ["rustred/weighted-lowering-diagnostics"]
python_stubgen = [
  "dep:pyo3-stub-gen",
  "feynkit-py/python_stubgen",
  "symbolica/python_export",
  "symbolica/python_stubgen",
]
symbolica_community_module = ["dep:pyo3", "dep:pyo3-stub-gen-derive", "symbolica/python_export", "feynkit-ingress", "dep:feynkit-py"]

[[example]]
name = "external_data_acceptance"
required-features = ["feynkit-ingress"]

[[example]]
name = "five_loop_scalar_diagrams"
required-features = ["feynkit-ingress"]

[[example]]
name = "five_loop_saved_application"
required-features = ["feynkit-ingress"]

[[example]]
name = "five_loop_qcd_ladder"
required-features = ["feynkit-ingress"]
