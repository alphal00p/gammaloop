[package]
name = "symbolica-data"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Verified external assets shared by native and WASM Symbolica hosts"

[dependencies]
pyo3 = { version = "0.28", default-features = false, features = ["macros"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
python = ["dep:pyo3"]

