[package]
name = "gammalooprs"
version = "0.3.4"
edition = "2024"

description = "An implementation of the Local Unitarity method for computing differential collider cross-sections."
# license-file = "../../LICENSE"
readme = "../../README.md"
repository = "https://github.com/alphal00p/gammaloop"
license = "MIT OR Apache-2.0"
keywords = ["cross-section", "loop", "perturbative", "physics"]
categories = ["science"]
build = "build.rs"

[lib]
bench = false

[dependencies]
feynkit-amplitude = { version = "0.1.0", path = "../feynkit-amplitude", default-features = false }
ahash = { workspace = true, features = ["serde"] }
base62 = "2.2.4"
bincode = { workspace = true, features = ["serde"] }
bincode-trait-derive = { workspace = true }
clarabel = "0"
color-eyre = { workspace = true }
colored = { workspace = true }
ctrlc = "3.5.2"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["from", "into"] }
dirs = { workspace = true }
dot-parser = { workspace = true }
dyn-clone = "1.0.17"
enum_dispatch = "*"
eyre = { workspace = true }
feynkit-cff = { workspace = true }
feynkit-generator = { workspace = true }
feynkit-graph = { workspace = true }
feynkit-kinematics = { workspace = true }
feynkit-model = { workspace = true }
gammaloop-tracing-filter = { workspace = true, features = ["symbolica"] }
idenso = { workspace = true, features = ["native"] }
include_dir = { workspace = true }
indicatif = { workspace = true, features = ["improved_unicode", "rayon"] }
itertools = { workspace = true }
json5 = { workspace = true }
# cgmath = "0.18.0"
# argmin = "0.10.0"
# by_address = "1.2.1"
# pyo3-pylogger = { version = "0.3.0", optional = true }
# humantime = "2.1.0"
# vakint = { git = "https://github.com/alphal00p/vakint", rev = "a32723f7c56ce73dd6a35713880e3a924e72c51b" } # "e44c210ded3936048615d39872022a0b6ef18454"
momtrop = { workspace = true }
# log = { version = "*", features = ["release_max_level_debug"] }
nu-ansi-term = { workspace = true }
paste = "1.0.15"
rand = { workspace = true, features = ["small_rng"] }
ratatui = { workspace = true }
rayon = { workspace = true }
# constcat = "0.5.0"
ref-ops = "0.2.5"
# gmp-mpfr-sys = { version = "1.6", features = ["use-system-libs"] }
rug = { version = "1.29.0", features = ["serde"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml = { workspace = true }
slotmap = { version = "1.1.1", features = ["serde"] }
smallvec = { version = "1.15.1", features = ["const_generics", "serde"] }
smartstring = { workspace = true, features = ["serde"] }
spenso = { workspace = true, features = ["native-code-generation", "symbolica"] }
spenso-hep-lib = { workspace = true, features = ["native"] }
symbolica-utils = { workspace = true, features = ["native"] }
# compensated-summation = "0.3.0"
# serde_with = "3.9.0"
tabled = { workspace = true, features = ["ansi", "derive"] }
three-dimensional-reps = { workspace = true, features = ["json_schema"] }
# gxhash = "3.4.1"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["release_max_level_info"] }
tracing-appender = { workspace = true }
tracing-indicatif = { workspace = true }
vakint = { workspace = true }
gammaloop-workspace-hack = { version = "0.1", path = "../gammaloop-workspace-hack" }

[dependencies.clap]
workspace = true
features = [
  "derive",
  "env",
  "unicode",
  "wrap_help",
]

[dependencies.linnet]
workspace = true
features = [
  "bincode",
  # "drawing",
  "serde",
  "symbolica",
]

[dependencies.pyo3]
workspace = true
features = ["auto-initialize", "eyre"]
optional = true

[dependencies.pyo3-stub-gen]
workspace = true
optional = true

[dependencies.symbolica]
workspace = true
default-features = false
features = [
  "bincode",
  "float-mpfr",
  "integer-gmp",
  "native_code_generation",
  "serde",
]

[dependencies.tracing-subscriber]
workspace = true
features = [
  "env-filter",
  "fmt",
  "json",
  "time",
]

[dependencies.typed-index-collections]
workspace = true
features = [
  "bincode",
  "serde",
  "serde-alloc",
]

[dev-dependencies]
insta = { workspace = true, features = ["json", "ron", "serde"] }
# oneloop_bridge = { git = "https://github.com/SecretGmG/OneLOopBridge", version = "0.2.0" }

[build-dependencies]
# pyo3-build-config = "*"
# pyo3-build-config = "*"

[features]
default = []
fail-on-warnings = []
higher_loops = []
python = ["dep:pyo3", "three-dimensional-reps/python"]
# insta.opt-level = 3
python-stubs = ["dep:pyo3-stub-gen", "python"]

# use-system-gmp = ["rug/gmp-mpfr-sys/use-system-libs"]
