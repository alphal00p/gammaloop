[package]
name = "gammaloop-statistics"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Exact additive moments and checked reporting for represented binary64 samples"
repository = "https://github.com/alphal00p/gammaloop"

[dependencies]
numerica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
