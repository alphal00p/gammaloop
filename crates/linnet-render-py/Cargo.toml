[package]
name = "linnet-render-py"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Shared Python rendering settings and snapshots backed by Linnet"

[dependencies]
linnet = { workspace = true }
linnest = { workspace = true, features = ["svg"] }
pyo3 = { workspace = true }
pyo3-stub-gen = { workspace = true, default-features = false, features = ["infer_signature"], optional = true }
pyo3-stub-gen-derive = { workspace = true }
serde_json = { workspace = true }
typst-renderer = { path = "../typst-renderer" }

[features]
python_stubgen = ["dep:pyo3-stub-gen"]
