[package]
name = "feynkit-generator"
version = "0.1.0"
edition.workspace = true
description = "Standalone model-driven Feynman-diagram generation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphal00p/gammaloop"
keywords = ["feynman", "generator", "physics"]
categories = ["science"]

[dependencies]
feynkit-graph = { version = "0.1.0", path = "../feynkit-graph" }
feynkit-model = { version = "0.1.0", path = "../feynkit-model" }
idenso = { workspace = true }
linnet = { workspace = true, features = ["symbolica"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
spenso = { workspace = true, features = ["shadowing"] }
symbolica = { workspace = true, default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
