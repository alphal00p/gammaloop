[package]
name = "kurvst"
version = "0.1.0"
edition.workspace = true
description = "Kurbo-backed Bezier and path pattern helpers for Typst"
repository = "https://github.com/alphal00p/gammaloop"
license = "MIT"
publish = false

[lib]
name = "kurvst"
crate-type = ["cdylib", "rlib"]

[dependencies]
ciborium = "0.2.2"
kurbo = "0.13"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-minimal-protocol = { version = "0.2.0", optional = true }

[features]
typst-plugin = ["dep:wasm-minimal-protocol"]
