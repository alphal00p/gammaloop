[package]
name = "linnet-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for linnet"
license = "MIT"

[lib]
crate-type = ["rlib"]
name = "linnet_py"

[[bin]]
name = "stubgen"
path = "src/bin/stubgen.rs"
required-features = ["python_stubgen"]

[dependencies]
symbolica = { workspace = true, features = ["python_export"] }
ciborium = "0.2.2"
dot-parser = { workspace = true }
linnet = { workspace = true, features = ["nodestore-vec", "serde"] }
linnet-render-py = { workspace = true, default-features = false }
linnest = { workspace = true, features = ["svg"] }
pyo3 = { workspace = true, features = ["multiple-pymethods"] }
pyo3-stub-gen = { workspace = true, default-features = false, features = ["infer_signature"], optional = true }
pyo3-stub-gen-derive = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = ["native"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr", "linnet-render-py/native"]
wasm = ["symbolica/wasm", "linnet-render-py/wasm"]
python_stubgen = ["dep:pyo3-stub-gen", "symbolica/python_stubgen", "linnet-render-py/python_stubgen"]
