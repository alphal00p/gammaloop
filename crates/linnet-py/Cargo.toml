[package]
name = "linnet-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for linnet"
license = "MIT"

[lib]
crate-type = ["rlib"]
name = "linnet_py"

[[bin]]
name = "stubgen"
path = "src/bin/stubgen.rs"
required-features = ["community", "python_stubgen"]

[dependencies]
symbolica = { workspace = true, features = ["python_export"], optional = true }
ciborium = "0.2.2"
linnet = { workspace = true, features = ["serde"] }
linnest = { workspace = true, features = ["svg"] }
# Maturin follows path dependencies into sdists; render.rs embeds Kurvst's Typst assets.
kurvst = { path = "../kurvst" }
pyo3 = { workspace = true, features = ["multiple-pymethods"] }
pyo3-stub-gen = { workspace = true, default-features = false, features = ["infer_signature"], optional = true }
pyo3-stub-gen-derive = { workspace = true, default-features = false }
rust-embed = { version = "8.4", features = ["debug-embed", "include-exclude", "interpolate-folder-path"] }
roxmltree = "0.21.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
self_cell = "1.2"
tempfile = "3.8"
typst-renderer = { path = "../typst-renderer", features = ["full"] }
walkdir = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }
walkdir = { workspace = true }

[features]
# Symbolica Community registration, and Symbolica expressions as keys of their own kind. The
# final extension selects Symbolica's arithmetic backends.
community = ["dep:symbolica"]
# The `linnet_py` extension module, built only for the standalone `linnet-py` wheel. Rust
# consumers link these bindings into their own extension module and must leave it off.
standalone = []
abi3-py310 = ["pyo3/abi3-py310"]
python_stubgen = ["dep:pyo3-stub-gen"]
