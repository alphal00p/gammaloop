[package]
name = "linnet-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for linnet"
license = "MIT"

[package.metadata.maturin]
name = "linnet_py"

[lib]
crate-type = ["cdylib", "rlib"]
name = "linnet_py"

[dependencies]
dot-parser = { workspace = true }
linnet = { workspace = true }
linnest = { workspace = true }
# Maturin follows path dependencies into sdists; render.rs embeds Kurvst's Typst assets.
kurvst = { path = "../kurvst" }
pyo3 = { workspace = true, features = ["multiple-pymethods"] }
pyo3-stub-gen = { workspace = true, default-features = false }
rust-embed = { version = "8.4", features = ["debug-embed", "include-exclude", "interpolate-folder-path"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3.8"
walkdir = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[features]
default = []
abi3-py310 = ["pyo3/abi3-py310"]
extension-module = ["pyo3/extension-module"]
