[package]
name = "linnet-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for linnet"
license = "MIT"

[package.metadata.maturin]
name = "linnet_py"

[lib]
crate-type = ["cdylib", "rlib"]
name = "linnet_py"

[[bin]]
name = "stubgen"
path = "src/bin/stubgen.rs"
required-features = ["python-stubs"]

[dependencies]
include_dir = { workspace = true }
ciborium = "0.2.2"
dot-parser = { workspace = true }
linnet = { workspace = true, features = ["serde"] }
linnest = { workspace = true }
# Maturin follows path dependencies into sdists; render.rs embeds Kurvst's Typst assets.
kurvst = { path = "../kurvst" }
pyo3 = { workspace = true }
pyo3-stub-gen = { workspace = true, default-features = false, optional = true }
pyo3-stub-gen-derive = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3.8"
walkdir = { workspace = true }


[features]
default = []
abi3 = ["pyo3/abi3-py310"]
extension-module = ["pyo3/extension-module"]
python-stubs = ["dep:pyo3-stub-gen"]
