[project]
name = "linnet"
version = "0.1.0"
description = "Native Python bindings and in-process Typst rendering for Linnet graphs"
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE",
  "vendor/typst-packages/PROVENANCE.typ",
  "vendor/typst-packages/archives/LICENSE.cetz",
  "vendor/typst-packages/preview/oxifmt/1.0.0/LICENSE*",
  "vendor/typst-packages/preview/mitex/0.2.6/LICENSE",
]
requires-python = ">=3.10"
dependencies = []

[tool.maturin]
module-name = "linnet"
features = ["extension-module", "abi3-py310"]

[tool.cibuildwheel]
build = "cp314-*"

[tool.cibuildwheel.pyodide]
repair-wheel-command = ""
test-sources = ["crates/linnet-py/tests/test_wasm.py", "crates/linnet-py/tests/test_streaming.py"]
test-command = "python -m unittest crates/linnet-py/tests/test_wasm.py crates/linnet-py/tests/test_streaming.py"

[build-system]
requires = ["maturin>=1.13.2,<2"]
build-backend = "maturin"
