[package]
name = "clinnet"
version = "0.1.8"
edition = "2024"
description = "Incrementally render Typst figures from DOT graphs and assemble them into a grid PDF."
readme = "README.md"
homepage = "https://github.com/lcnbr/linnet/tree/main/clinnet"
repository = "https://github.com/lcnbr/linnet"
license = "MIT"
keywords = ["cli", "dot", "graph", "pdf", "typst"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "linnet"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:blake3",
    "dep:clap",
    "dep:indicatif",
    "dep:parking_lot",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:walkdir",
]

[dependencies]
blake3 = { version = "1.5", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
eyre = { workspace = true }
indicatif = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
pathdiff = "0.2"
rayon = { version = "1.8", optional = true }
rust-embed = { version = "8.4", features = ["debug-embed", "include-exclude", "interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tempfile = "3.8"
walkdir = { version = "2.5", optional = true }
