[package]
name = "feynkit-cff"
version = "0.1.0"
edition = { workspace = true }
description = "Standalone Cross-Free Family combinatorics"
repository = "https://github.com/alphal00p/gammaloop"
license = "MIT OR Apache-2.0"
keywords = ["feynman", "hep", "physics", "cff"]
categories = ["science"]

[dependencies]
feynkit-graph = { version = "0.1.0", path = "../feynkit-graph" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
