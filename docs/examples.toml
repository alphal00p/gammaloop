schema = 1

# This registry covers the ten canonical manual journeys. The example harness
# still checks every fenced block; repository examples and scheduled scientific
# cases must be added here as they are promoted to maintained user journeys.

[[example]]
id = "gammaloop-first-state"
product = "gammaloop"
task = "Create and resume a persisted GammaLoop state"
audience = "beginner"
source = "docs/products/gammaloop/content/tutorial.typ"
route = "tutorial/"
prerequisites = ["Repository checkout", "Nix development shell or the documented Rust/just toolchain"]
expected = "The generated state contains the run manifest and can be loaded again explicitly."
verification = "syntax"
tier = "pull-request"
owner = "GammaLoop maintainers"
test_command = "cargo test --locked -p alphal00p-docs-examples"

