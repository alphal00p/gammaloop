schema = 2

# This registry covers the canonical manual journeys. The example harness
# still checks every fenced block; repository examples and scheduled scientific
# cases must be added here as they are promoted to maintained user journeys.

[[example]]
id = "gammaloop-quickstart-scalar-bubble"
marker = "gammaloop-quickstart-scalar-bubble"
product = "gammaloop"
task = "Generate, persist, and inspect one scalar one-loop topology"
audience = "beginner"
source = "docs/products/gammaloop/content/quickstart-cli.typ"
route = "quickstart/cli/"
prerequisites = ["Built or installed GammaLoop CLI", "A Symbolica license mode appropriate for the user"]
expected = "The CLI lists process bubble and integrand one_loop, writes state_manifest.toml, and can evaluate one finite point from the saved state."
verification = "syntax"
tier = "pull-request"
owner = "GammaLoop maintainers"
test_command = "cargo test --locked -p alphal00p-docs-examples"

