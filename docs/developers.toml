# build paths still enforce registry, scope, catalogue, and link validity.
# No documentation-system architecture impact: the getting-started guides use the
# existing registry, Typst renderer, example harness, and generated navigation pipeline.
# No-impact attestation: collision-safe Python symbol routes change generated
# API navigation only; architecture-note lifecycle enforcement is unchanged.
# Snapshot validation checks intentional developer links to the deployed latest
# tree against the same generated route without changing publication topology.
# Its validation-state grouping is a Clippy-only refactor with identical behavior.
# Snapshot candidates are now normalized before immutable comparison, replace
# stale global output, and retain existing product channels and snapshot tags.
# No documentation-system architecture impact 2026-08-28: portal dependency
# validation follows the GammaLoop-owned template path, and generated Linnet
# navigation describes domain templates instead of the removed physics route.
# No lifecycle-policy impact 2026-09-11: the source changes update GammaLoop
# rendering tests and exclude top-level generated dist exports from authored
# prose discovery. Verified-scope enforcement and developer HTML restrictions
# remain byte-identical to the previous reviewed implementation.
# Reviewed 2026-09-14: verified ranges hash exact selected content. Watch
