# Vakint's explicitly registered Python surface and evaluation contracts are unchanged.
# Reviewed 2026-10-19: The architecture now records immutable RustRed snapshots, explicit
# master modes, exact-combination capability checks, and the in-process FeynKit tensor
# default.
# Reviewed 2026-10-20: FORM input now follows the existing upstream exact-tree
# serializer, with explicit complex components, symbol identities and parentheses.
# FORM programs, master formulas, output decoding and ownership are unchanged.
# Reviewed 2026-10-20: factorized Lorentz closure preserves original index
# multiplicities before expansion, and protects validated loop invariants as
# coefficients through the existing checked tensor reducer. Raw legacy powers
# retain their shared rank bound; projection and ambiguity guards are unchanged.
# Reviewed 2026-10-20: saved FORM indices return in the caller's epsilon
# convention, and literal indices reuse exact registered representation data.
# Vector mappings stay consistent; conflicting declarations are still errors.
# Reviewed 2026-10-21: numerical outputs stage finite input and normalization
# sources before backend algebra, then use the shared tracked materializer.
# Named result records, explicit inspection and native input precision are documented.
# Reviewed 2026-10-21 final correction: all RustRed modes lift finite input
# occurrences before collection, preserving shared factors and separating requests
# through one checked counter. PySecDec rejects retained source leaves before generation.
# Reviewed 2026-10-21 Laurent boundary correction: all four public numerical
# entry points pass their configured epsilon symbol to the shared input preflight
# before dot-notation expansion; backend and normalization ownership are unchanged.
