commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model scalars-default.json",
  "remove processes",
  "import graphs ./tests/resources/graphs/local_ir_dod2_scalar_spectacles.dot -p local_ir_dod2_scalar_spectacles -i local_ir_dod2_scalar_spectacles",
  "generate existing -p local_ir_dod2_scalar_spectacles -i local_ir_dod2_scalar_spectacles",
]

[[command_blocks]]
name = "profile_uv"
commands = [
  "profile ultra-violet -p local_ir_dod2_scalar_spectacles -i local_ir_dod2_scalar_spectacles --min-scaling 8 --max-scaling 12 --n-points 25 --seed 1337 --per-orientation",
]

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
  [1.0, 0.0, 0.0, 0.0],
  "dependent",
]
helicities = [0, 0]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"

[cli_settings.global]
logfile_directive = "off"
display_directive = "off"

[cli_settings.global.generation.uv]
generate_integrated = false
add_marker = false
inner_products = true
orchestrator = "hedge_poset"

[cli_settings.global.generation.uv.renormalization_prescription]
log_divergent = "IR"
massive_power_divergent = "IR"
massless_power_divergent = "IR"

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = false
disable_tropical_generation = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.evaluator]
# This fixture exercises the summed SingleParametric CFF. Building the unused
# all-orientation evaluator splits the completed local atom before cancellations.
iterative_orientation_optimization = false
