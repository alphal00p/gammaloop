[general]
m_uv = 91.188
mu_r = 91.188
integral_unit = "picobarn"

[kinematics]
e_cm = 1000.0

[kinematics.externals]
type = "constant"

[kinematics.externals.data]
momenta = [
    [
    500.0,
    0.0,
    0.0,
    500.0,
],
    [
    500.0,
    0.0,
    0.0,
    -500.0,
],
]
helicities = [
    "summed_averaged",
    "summed_averaged",
]

[integrator]
n_bins = 16
min_samples_for_update = 64
n_start = 2048
n_increase = 0
n_max = 2048
discrete_dim_learning_rate = 0.25
continuous_dim_learning_rate = 0.25
seed = 1337

[stability]
escalate_if_exact_zero = false

[[stability.levels]]
precision = "Double"
required_precision_for_re = 0.000001
required_precision_for_im = 0.000001
escalate_for_large_weight_threshold = 0.9

[[stability.levels]]
precision = "Quad"
required_precision_for_re = 0.0000000001
required_precision_for_im = 0.0000000001
escalate_for_large_weight_threshold = -1.0

[[stability.levels]]
precision = "Arb"
required_precision_for_re = 0.000000000001
required_precision_for_im = 0.000000000001
escalate_for_large_weight_threshold = -1.0

[sampling]
graphs = "monte_carlo"
sampling_multichanneling = true
sampling_channels = "monte_carlo"
b = 0.3
default_channel_selection = ["auto:optimized_lmb"]

[sampling.channel_selection]
GL638 = ["auto:optimized_lmb"]

[subtraction]
esurface_existence_threshold = 0.00000000000001

[h_function]
power = 3
