[package]
name = "feynkit-generator"
version = "0.1.0"
edition.workspace = true
description = "Standalone model-driven Feynman-diagram generation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphal00p/gammaloop"
keywords = ["feynman", "generator", "physics"]
categories = ["science"]

[dependencies]
feynkit-amplitude = { version = "0.1.0", path = "../feynkit-amplitude", default-features = false }
bincode-trait-derive = { workspace = true }
bincode = { workspace = true, features = ["serde"] }
feynkit-graph = { version = "0.1.0", path = "../feynkit-graph", default-features = false }
feynkit-model = { version = "0.1.0", path = "../feynkit-model" }
idenso = { workspace = true }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-rational = "0.4.2"
linnet = { workspace = true, features = ["symbolica", "serde", "bincode"] }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
spenso = { workspace = true, features = ["shadowing"] }
spenso-hep-lib = { workspace = true }
symbolica = { workspace = true, default-features = false }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
linnet = { workspace = true, features = ["rayon"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.8"

[features]
default = ["native"]
native = ["feynkit-amplitude/native", "feynkit-graph/native", "spenso-hep-lib/native"]
wasm = ["feynkit-amplitude/wasm", "feynkit-graph/wasm", "spenso-hep-lib/wasm"]
