schema = 2
eyebrow = "Public research software"
title = "Open tools for precision collider physics."
summary = "The αLoop collaboration develops theoretical and algorithmic methods for automated cross-section calculations in quantum field theory, centred on Local Unitarity."
funding = "Research associated with Local Unitarity has been supported by the Swiss National Science Foundation."
funding_url = "https://data.snf.ch/grants/grant/203335"

[[pillar]]
label = "01 · Physics"
title = "Local Unitarity"
summary = "Differential collider cross-sections with local cancellation of infrared singularities."

[[pillar]]
label = "02 · Structures"
title = "Graphs and tensors"
summary = "Half-edge graphs, typed tensors, symbolic identities, and executable contraction networks."

[[pillar]]
label = "03 · Integrals"
title = "Symbolic evaluation"
summary = "Controlled rewrite systems and vacuum-integral matching for reproducible calculations."

