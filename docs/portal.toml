[[topic]]
id = "models"
title = "Models and interactions"
summary = "Define particles, parameters and interaction vertices, or load a UFO model."
products = ["feynkit"]
guide = { product = "feynkit", page = "tutorial" }
examples = { product = "feynkit", page = "showcase-ufo" }

[[topic]]
id = "diagrams"
title = "Diagrams and amplitudes"
summary = "Generate diagrams, assign loop momenta, and construct symbolic numerators and amplitudes."
products = ["feynkit", "linnet", "spenso"]
guide = { product = "feynkit", page = "tutorial" }
examples = { product = "feynkit", page = "showcase-models-and-diagrams" }

[[topic]]
id = "tensors"
title = "Tensor algebra and reduction"
summary = "Contract tensor networks, apply symbolic identities, and reduce covariant tensor numerators."
products = ["spenso", "idenso", "feynkit"]
guide = { product = "spenso", page = "quickstart" }
examples = { product = "feynkit", page = "showcase-tensor-reduction" }

[[topic]]
id = "integrals"
title = "Loop integrals"
summary = "Construct CFF and LTD representations, work with integral families, and evaluate vacuum integrals."
products = ["feynkit", "vakint"]
guide = { product = "feynkit", page = "integral-families" }
examples = { product = "feynkit", page = "showcase-numerical-integration" }

[[topic]]
id = "graphs"
title = "Graphs and drawing"
summary = "Build half-edge graphs, run subgraph algorithms, and draw labeled graphs."
products = ["linnet"]
guide = { product = "linnet", page = "algorithms" }
examples = { product = "linnet", page = "playground" }

[[topic]]
id = "calculations"
title = "Cross-section calculations"
summary = "Generate processes and run numerical cross-section calculations using Local Unitarity."
products = ["gammaloop"]
guide = { product = "gammaloop", page = "quickstart" }
examples = { product = "gammaloop", page = "tutorial" }

[[example]]
title = "Generate a one-loop diagram"
summary = "Start with a scalar model and inspect the generated diagram and its particle metadata."
target = { product = "feynkit", page = "showcase-first-diagram" }
runtime = "browser"

[[example]]
title = "Reduce a tensor numerator"
summary = "Follow a covariant tensor reduction in symbolic dimension."
target = { product = "feynkit", page = "showcase-tensor-reduction" }
runtime = "browser"

[[example]]
title = "Compare CFF and LTD"
summary = "Compare numerical stability and integration in the browser. The independent OneLOop reference requires native Python."
target = { product = "feynkit", page = "showcase-numerical-integration" }
runtime = "browser"

[[pillar]]
label = "01 · Physics"
title = "Local Unitarity"
summary = "Differential collider cross-sections with local cancellation of infrared singularities."

[[pillar]]
label = "02 · Structures"
title = "Graphs and tensors"
summary = "Half-edge graphs, typed tensors, symbolic identities, and executable contraction networks."

[[pillar]]
label = "03 · Integrals"
title = "Symbolic evaluation"
summary = "Controlled rewrite systems and vacuum-integral matching for reproducible calculations."

