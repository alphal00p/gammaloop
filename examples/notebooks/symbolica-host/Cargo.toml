[package]
name = "alphal00p-notebook-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "core"
crate-type = ["cdylib"]

[dependencies]
linnet-py = { path = "../../../crates/linnet-py", default-features = false }
feynkit-py = { path = "../../../crates/feynkit-py", default-features = false, features = ["ufo", "linnet-python"] }
spynso3 = { path = "../../../crates/spynso3", default-features = false }
symbolica = { version = "=3.0.1", default-features = false, features = ["python_export"] }
pyo3 = { version = "0.28", features = ["abi3-py310", "extension-module"] }

[features]
default = ["native"]
native = ["linnet-py/native", "feynkit-py/native", "spynso3/native"]
wasm = ["linnet-py/wasm", "feynkit-py/wasm", "spynso3/wasm"]

[patch.crates-io]
# Match the shared HEPKit host's optional notebook components.
typst-library = { git = "https://github.com/alphal00p/gammaloop", rev = "024f96d67b984195e281e7b8e90a3f752df94733" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", rev = "024f96d67b984195e281e7b8e90a3f752df94733" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
graphica = { git = "https://github.com/alphal00p/symbolica", rev = "1205ec30890f32f6d0083e3bf1e55976b8e07bdd" }
numerica = { git = "https://github.com/alphal00p/symbolica", rev = "1205ec30890f32f6d0083e3bf1e55976b8e07bdd" }
symbolica = { git = "https://github.com/alphal00p/symbolica", rev = "1205ec30890f32f6d0083e3bf1e55976b8e07bdd" }

[profile.dev]
debug = 0

# Match the workspace documentation profile for hermetic installed-wheel checks.
[profile.docs]
inherits = "dev"
debug = false

# Match the canonical documentation check's optimized native profile.
[profile.ci-optim]
inherits = "dev"
opt-level = 2
debug = false

[profile.ci-optim.package."*"]
opt-level = 3
