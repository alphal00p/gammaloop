[build-system]
requires = ["maturin>=1.13.2,<2"]
build-backend = "maturin"

[project]
name = "symbolica"
version = "3.0.1"
requires-python = ">=3.10"
dependencies = ["numpy"]
license-files = ["licenses/*"]

[tool.maturin]
module-name = "symbolica.core"
python-source = "python"

[tool.cibuildwheel]
build = "cp314-*"

[tool.cibuildwheel.pyodide]
repair-wheel-command = ""
environment = { MATURIN_PEP517_ARGS = "--locked --no-default-features --features wasm", RUSTFLAGS = "" }
test-sources = ["crates/feynkit-py/tests/installed_offline_rendering.py"]
test-command = "python crates/feynkit-py/tests/installed_offline_rendering.py"
