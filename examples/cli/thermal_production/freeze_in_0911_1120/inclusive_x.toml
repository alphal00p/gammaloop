# Section 6.3 of https://arxiv.org/pdf/0911.1120: L_int = lambda X B1 B2 B3.
# Forward X self-energy: all final states at order lambda^2 are B1 B2 B3.
# Compare the native cut with the scattering and inverse-decay gain terms.
# Units: MX = T = lambda = 1; all B_i are massless. X initially at rest.
# Run from repository root:
# ./gammaloop -s /tmp/gammaloop-freeze-in-inclusive-state -n examples/cli/thermal_production/freeze_in_0911_1120/inclusive_x.toml run generate export integrate p1 p3
commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_production/freeze_in_0911_1120/model.json",
  "set global kv global.generation.medium.mode=vacuum",
  "generate xs X > B1 B2 B3 FI^2==2 [{{2}}] -p vacuum -i LO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "generate xs X > B1 B2 B3 FI^2==2 [{{2}}] -p thermal -i LO",
]

[[command_blocks]]
name = "integrate"
commands = [
  "set process -p vacuum -i LO string kinematics.externals.data.momenta=\"[[1.0,0.0,0.0,0.0]]\"",
  "set process -p thermal -i LO string kinematics.externals.data.momenta=\"[[1.0,0.0,0.0,0.0]]\"",
  "integrate -p vacuum -i LO -p thermal -i LO --n-cores 2 --workspace-path /tmp/gammaloop-freeze-in-inclusive-p0 --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "export"
commands = [
  "save dot /tmp/gammaloop-freeze-in-inclusive-dot --include-autogenerated-fields true",
  "save standalone /tmp/gammaloop-freeze-in-inclusive-standalone --json",
  "3Drep build -p thermal -i LO -g GL0 --no-pretty --json-out /tmp/gammaloop-freeze-in-inclusive-cff.json --workspace-path /tmp/gammaloop-freeze-in-inclusive-3drep",
]

[[command_blocks]]
name = "p1"
commands = [
  "set process -p vacuum -i LO string kinematics.externals.data.momenta=\"[[1.4142135623730951,0.0,0.0,1.0]]\"",
  "set process -p thermal -i LO string kinematics.externals.data.momenta=\"[[1.4142135623730951,0.0,0.0,1.0]]\"",
  "set process -p vacuum -i LO kv integrator.seed=1537",
  "set process -p thermal -i LO kv integrator.seed=1537",
  "integrate -p vacuum -i LO -p thermal -i LO --n-cores 2 --workspace-path /tmp/gammaloop-freeze-in-inclusive-p1 --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "p3"
commands = [
  "set process -p vacuum -i LO string kinematics.externals.data.momenta=\"[[3.1622776601683795,0.0,0.0,3.0]]\"",
  "set process -p thermal -i LO string kinematics.externals.data.momenta=\"[[3.1622776601683795,0.0,0.0,3.0]]\"",
  "set process -p vacuum -i LO kv integrator.seed=1737",
  "set process -p thermal -i LO kv integrator.seed=1737",
  "integrate -p vacuum -i LO -p thermal -i LO --n-cores 2 --workspace-path /tmp/gammaloop-freeze-in-inclusive-p3 --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
iterative_orientation_optimization = false
summed = false
summed_function_map = true

[cli_settings.global.generation.uv]
subtract_uv = false
generate_integrated = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[default_runtime_settings.general]
inverse_temperature = 1.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"

[default_runtime_settings.kinematics]
e_cm = 1.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.0, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 10000
n_increase = 0
n_max = 1000000
seed = 1337
integrated_phase = "real"
target_relative_accuracy = 0.001
