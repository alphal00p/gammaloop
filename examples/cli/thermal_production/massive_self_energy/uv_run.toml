# Renormalized self-energy insertion: local and integrated UV subtraction.
# Keep the vacuum contribution in the medium; use MSbar at mu_r=1.6.
commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_production/massive_double_triangle/model.json",
  "set model MX=1.6",
  "set global kv global.generation.medium.mode=$(mode:thermodynamic_equilibrium)",
  "import graphs $(graph:./examples/cli/thermal_production/massive_self_energy/self_energy.dot) --process-spec 'X > $(cuts:{ H H, H H L }) [{{2}}]' -p insertion -i NLO -o",
  "generate existing -p insertion -i NLO",
]

[[command_blocks]]
name = "export"
commands = [
  "save standalone $(output:/tmp/gammaloop-self-energy-uv)-standalone --json",
  "save dot $(output:/tmp/gammaloop-self-energy-uv)-dot --include-autogenerated-fields true",
]

[[command_blocks]]
name = "inspect"
commands = [
  "set process -p insertion -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false general.m_uv=$(m_uv:1.0) general.mu_r=$(mu_r:1.6) general.renormalization_localization_scale=$(localization:1.0)",
  "inspect -p insertion -i NLO $(precision:) -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/gammaloop-self-energy-uv)-inspect.json",
]

[[command_blocks]]
name = "integrate"
commands = [
  "set process -p insertion -i NLO kv general.generate_events=false general.m_uv=$(m_uv:1.0) general.mu_r=$(mu_r:1.6) general.renormalization_localization_scale=$(localization:1.0) integrator.n_max=$(samples:1000000) integrator.n_start=$(batch:50000)",
  "integrate -p insertion -i NLO --n-cores 2 --workspace-path $(output:/tmp/gammaloop-self-energy-uv)-integral --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[cli_settings.global.generation.medium]
vacuum_subtraction = false

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
iterative_orientation_optimization = false
summed = false
summed_function_map = true

[cli_settings.global.generation.uv]
subtract_uv = true
generate_integrated = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[default_runtime_settings.general]
inverse_temperature = 2.0
m_uv = 1.0
mu_r = 1.6
renormalization_localization_scale = 1.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"

[default_runtime_settings.kinematics]
e_cm = 1.6

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.6, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 50000
n_increase = 0
n_max = 1000000
seed = 271828
integrated_phase = "real"
target_relative_accuracy = 0.005
