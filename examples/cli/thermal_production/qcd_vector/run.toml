# One massless down-quark flavour, Nc=3, e=g=1, Qd=-1/3.
# Compare the inclusive virtual-photon current with arXiv:1910.07552v2.
commands = []

[[command_blocks]]
name = "model"
commands = [
  "import model sm-default.json",
  "set model aEWM1=12.566370614359172 aS=0.07957747154594767",
  "set global kv global.generation.medium.mode=$(mode:thermodynamic_equilibrium)",
]

[[command_blocks]]
name = "spacelike"
# Keep e_cm as the positive sampling scale sqrt(|K^2|); no rest frame exists.
commands = [
  "set default-runtime kv kinematics.externals.data.momenta=[[1.0,0.0,0.0,4.0]]",
]

[[command_blocks]]
name = "near_lightcone"
# k0/T=4; the default kz gives K^2/T^2=0.1. Hold the sampling scale fixed.
commands = [
  "set default-runtime kv kinematics.externals.data.momenta=[[4.0,0.0,0.0,$(kz:3.987480407475377)]] kinematics.e_cm=$(sampling_scale:3.872983346207417)",
]

[[command_blocks]]
name = "lo"
commands = [
  "generate xs a > d d~ | a d d~ g ghG ghG~ QCD^2==0 QED^2==2 [{{1}} QCD=0] --numerator-grouping group_identical_graphs_up_to_scalar_rescaling --symmetrize-left-right-states true -p vector_lo -i LO --global-prefactor-num 1 --only-diagrams",
  "generate existing -p vector_lo -i LO",
  "set process -p vector_lo -i LO kv integrator.n_max=$(lo_samples:100000) integrator.n_start=50000",
  "integrate -p vector_lo -i LO --n-cores $(cores:4) --workspace-path $(output:/tmp/gammaloop-qcd-vector)-lo-integral --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "nlo"
commands = [
  "generate xs a > d d~ | a d d~ g ghG ghG~ QCD^2==2 QED^2==2 [{{2}} QCD=1] --numerator-grouping group_identical_graphs_up_to_scalar_rescaling --symmetrize-left-right-states true -p vector_nlo -i NLO --global-prefactor-num 1 --only-diagrams",
  "save dot $(output:/tmp/gammaloop-qcd-vector)-diagrams --include-autogenerated-fields true",
  "generate existing -p vector_nlo -i NLO",
]

[[command_blocks]]
name = "export"
commands = [
  "save standalone $(output:/tmp/gammaloop-qcd-vector)-standalone --json",
  "save dot $(output:/tmp/gammaloop-qcd-vector)-dot --include-autogenerated-fields true",
]

[[command_blocks]]
name = "inspect"
commands = [
  "inspect -p vector_nlo -i NLO $(precision:) -m --graph-id $(graph:0) -x 0.17 -0.31 0.43 -0.29 0.53 0.71 --json-output $(output:/tmp/gammaloop-qcd-vector)-inspect.json",
]

[[command_blocks]]
name = "lightcone_nonfinite"
# Reproduce at kz=3.998749804626441 and the default sampling scale.
commands = [
  "inspect -p vector_nlo -i NLO -x 0.38284976323786246 0.42928160419108263 0.010235373341083381 0.9998525100417789 0.43510709710570933 0.010667453207883319 --json-output $(output:/tmp/gammaloop-qcd-vector)-nonfinite-default.json",
  "inspect -p vector_nlo -i NLO -f -x 0.38284976323786246 0.42928160419108263 0.010235373341083381 0.9998525100417789 0.43510709710570933 0.010667453207883319 --json-output $(output:/tmp/gammaloop-qcd-vector)-nonfinite-arb.json",
]

[[command_blocks]]
name = "integrate"
commands = [
  "set process -p vector_nlo -i NLO kv integrator.n_max=$(samples:1000000) integrator.n_start=$(batch:100000) integrator.seed=$(seed:191007552) general.m_uv=$(m_uv:4.0) general.renormalization_localization_scale=$(localization:4.0)",
  "integrate -p vector_nlo -i NLO --n-cores $(cores:4) --workspace-path $(output:/tmp/gammaloop-qcd-vector)-nlo-integral --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[cli_settings.global.generation]
explicit_orientation_sum_only = true
vector_polarization_sum_gauge = "Feynman"

[cli_settings.global.generation.medium]
vacuum_subtraction = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[cli_settings.global.generation.evaluator]
compile = false
do_algebra = false
store_atom = true
iterative_orientation_optimization = false
summed = false
summed_function_map = true

[cli_settings.global.generation.uv]
subtract_uv = true
generate_integrated = true
softct = false
inner_products = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[default_runtime_settings.general]
inverse_temperature = 1.0
m_uv = 4.0
mu_r = 4.0
renormalization_localization_scale = 4.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"

[default_runtime_settings.kinematics]
e_cm = 3.872983346207417

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[4.0, 0.0, 0.0, 1.0]]
helicities = ["summed"]

[default_runtime_settings.sampling]
graphs = "summed"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "summed"
lmb_channel_weight = "ose"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 100000
n_increase = 0
n_max = 1000000
seed = 191007552
integrated_phase = "real"
target_relative_accuracy = 0.002
