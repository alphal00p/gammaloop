# Massive double-triangle above-threshold benchmark: M=1.6, mH=0.6, mL=0.25, T=0.5.
# Isolated labelled graph with factor 1/2; not the complete NLO scalar model.
commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_production/massive_double_triangle/model.json",
  "set model MX=1.6",
  "set global kv global.generation.medium.mode=vacuum",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p vacuum -i NLO -o",
  "generate existing -p vacuum -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p thermal -i NLO -o",
  "generate existing -p thermal -i NLO",
  "set global kv global.generation.medium.mode=zero_temperature_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p zero_temperature -i NLO -o",
  "generate existing -p zero_temperature -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L } [{{2}}]' -p virtual -i NLO -o",
  "generate existing -p virtual -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > H H L [{{2}}]' -p real -i NLO -o",
  "generate existing -p real -i NLO",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > H H [{{2}}]' -p virtual_hh -i NLO -o",
  "generate existing -p virtual_hh -i NLO",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > L L [{{2}}]' -p virtual_ll -i NLO -o",
  "generate existing -p virtual_ll -i NLO",
]

[[command_blocks]]
name = "export"
commands = [
  "save standalone /tmp/gammaloop-massive-double-triangle-above-standalone --json",
  "save dot /tmp/gammaloop-massive-double-triangle-above-dot --include-autogenerated-fields true",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "3Drep build -p thermal -i NLO -g massive_double_triangle --no-pretty --json-out /tmp/gammaloop-massive-double-triangle-above-cff.json --workspace-path /tmp/gammaloop-massive-double-triangle-above-3drep",
]

[[command_blocks]]
name = "inspect"
commands = [
  "set process -p virtual -i NLO kv general.generate_events=true",
  "set process -p real -i NLO kv general.generate_events=true",
  "set process -p thermal -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-above-inspect.json",
  "inspect -p virtual -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-above-inspect-virtual.json",
  "inspect -p real -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-above-inspect-real.json",
  "set process -p thermal -i NLO kv general.generate_events=false",
  "set process -p virtual -i NLO kv general.generate_events=false",
  "set process -p real -i NLO kv general.generate_events=false",
  "inspect -p virtual_hh -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-above-inspect-hh.json",
  "inspect -p virtual_ll -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-above-inspect-ll.json",
]

[[command_blocks]]
name = "integrate"
commands = [
  "integrate -p vacuum -i NLO -p thermal -i NLO -p virtual -i NLO -p real -i NLO -p zero_temperature -i NLO --n-cores 4 --workspace-path /tmp/gammaloop-massive-double-triangle-above-final --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

