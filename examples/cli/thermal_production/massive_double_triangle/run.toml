# Massive double-triangle real-virtual benchmark: M=1, mH=0.6, mL=0.25, T=0.5.
# Isolated labelled graph with factor 1/2; not the complete NLO scalar model.
commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_production/massive_double_triangle/model.json",
  "set global kv global.generation.medium.mode=vacuum",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p vacuum -i NLO -o",
  "generate existing -p vacuum -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p thermal -i NLO -o",
  "generate existing -p thermal -i NLO",
  "set global kv global.generation.medium.mode=zero_temperature_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p zero_temperature -i NLO -o",
  "generate existing -p zero_temperature -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > L L [{{2}}]' -p virtual -i NLO -o",
  "generate existing -p virtual -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "import graphs ./examples/cli/thermal_production/massive_double_triangle/double_triangle.dot --process-spec 'X > H H L [{{2}}]' -p real -i NLO -o",
  "generate existing -p real -i NLO",
]

[[command_blocks]]
name = "export"
commands = [
  "save standalone /tmp/gammaloop-massive-double-triangle-standalone --json",
  "save dot /tmp/gammaloop-massive-double-triangle-dot --include-autogenerated-fields true",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium",
  "3Drep build -p thermal -i NLO -g massive_double_triangle --no-pretty --json-out /tmp/gammaloop-massive-double-triangle-cff.json --workspace-path /tmp/gammaloop-massive-double-triangle-3drep",
]

[[command_blocks]]
name = "inspect"
commands = [
  "set process -p virtual -i NLO kv general.generate_events=true",
  "set process -p real -i NLO kv general.generate_events=true",
  "set process -p thermal -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-inspect.json",
  "inspect -p virtual -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-inspect-virtual.json",
  "inspect -p real -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output /tmp/gammaloop-massive-double-triangle-inspect-real.json",
  "set process -p thermal -i NLO kv general.generate_events=false",
  "set process -p virtual -i NLO kv general.generate_events=false",
  "set process -p real -i NLO kv general.generate_events=false",
]

[[command_blocks]]
name = "integrate"
commands = [
  "integrate -p vacuum -i NLO -p thermal -i NLO -p virtual -i NLO -p real -i NLO -p zero_temperature -i NLO --n-cores 2 --workspace-path /tmp/gammaloop-massive-double-triangle-final --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "lower_temperature"
commands = [
  "set process -p thermal -i NLO kv general.inverse_temperature=4.0",
  "set process -p virtual -i NLO kv general.inverse_temperature=4.0",
  "set process -p real -i NLO kv general.inverse_temperature=4.0",
  "integrate -p thermal -i NLO -p virtual -i NLO -p real -i NLO --n-cores 2 --workspace-path /tmp/gammaloop-massive-double-triangle-t025 --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
iterative_orientation_optimization = false
summed = false
summed_function_map = true

[cli_settings.global.generation.uv]
subtract_uv = false
generate_integrated = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[default_runtime_settings.general]
inverse_temperature = 2.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"

[default_runtime_settings.kinematics]
e_cm = 1.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.0, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 50000
n_increase = 0
n_max = 1000000
seed = 271828
integrated_phase = "real"
target_relative_accuracy = 0.002
