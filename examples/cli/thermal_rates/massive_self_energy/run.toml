# Raised massive insertion with shared local/integrated UV subtraction.
commands = []

[cli_settings.state]
folder = "/tmp/gammaloop-thermal-self-energy-state"

[cli_settings.global.n_cores]
feyngen = 1
generate = 1
compile = 1
integrate = 1

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
summed = false
summed_function_map = true
iterative_orientation_optimization = false

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = false

[cli_settings.global.generation.uv]
subtract_uv = true
generate_integrated = true
softct = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[default_runtime_settings.general]
inverse_temperature = 2.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"
generate_events = false
mu_r = 1.6
m_uv = 1.0
renormalization_localization_scale = 1.0

[default_runtime_settings.kinematics]
e_cm = 1.6

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.6, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.h_function]
function = "poly_exponential"
sigma = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 25000
n_increase = 0
n_max = 250000
seed = 271828
integrated_phase = "real"
target_relative_accuracy = 0.005

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_rates/massive_double_triangle/model.json",
  "set model MX=1.6",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > { H H, H H L } [{{2}}]' -p thermal -i NLO -o",
  "generate existing -p thermal -i NLO",
  "set global kv global.generation.medium.mode=vacuum global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > { H H, H H L } [{{2}}]' -p vacuum -i NLO -o",
  "generate existing -p vacuum -i NLO",
  "set global kv global.generation.medium.mode=zero_temperature_equilibrium global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > { H H, H H L } [{{2}}]' -p zero_temperature -i NLO -o",
  "generate existing -p zero_temperature -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > H H [{{2}}]' -p thermal_hh -i NLO -o",
  "generate existing -p thermal_hh -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > H H L [{{2}}]' -p thermal_hhl -i NLO -o",
  "generate existing -p thermal_hhl -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > { H H, H H L } [{{2}}]' -p thermal_aux -i NLO -o",
  "generate existing -p thermal_aux -i NLO",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.uv.subtract_uv=false global.generation.uv.generate_integrated=false",
  "import graphs ./examples/cli/thermal_rates/massive_self_energy/self_energy.dot --process-spec 'X > { H H, H H L } [{{2}}]' -p thermal_bare -i NLO -o",
  "generate existing -p thermal_bare -i NLO",
  "set process -p thermal_aux -i NLO kv general.m_uv=1.4 general.renormalization_localization_scale=0.7",
  "set global kv global.generation.uv.subtract_uv=true global.generation.uv.generate_integrated=true",
]

[[command_blocks]]
name = "export"
commands = [
  "save standalone $(output:/tmp/thermal-self-energy)-standalone --json",
  "save dot $(output:/tmp/thermal-self-energy)-dot --include-autogenerated-fields true",
]

[[command_blocks]]
name = "inspect"
commands = [
  "set process -p thermal -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-thermal-point.json",
  "set process -p vacuum -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p vacuum -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-vacuum-point.json",
  "set process -p zero_temperature -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p zero_temperature -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-zero_temperature-point.json",
  "set process -p thermal_hh -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal_hh -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-thermal_hh-point.json",
  "set process -p thermal_hhl -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal_hhl -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-thermal_hhl-point.json",
  "set process -p thermal_aux -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal_aux -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-thermal_aux-point.json",
  "set process -p thermal_bare -i NLO kv general.generate_events=true general.store_additional_weights_in_event=false",
  "inspect -p thermal_bare -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2 --json-output $(output:/tmp/thermal-self-energy)-thermal_bare-point.json",
  "set process -p thermal -i NLO kv general.generate_events=false",
  "set process -p vacuum -i NLO kv general.generate_events=false",
  "set process -p zero_temperature -i NLO kv general.generate_events=false",
  "set process -p thermal_hh -i NLO kv general.generate_events=false",
  "set process -p thermal_hhl -i NLO kv general.generate_events=false",
  "set process -p thermal_aux -i NLO kv general.generate_events=false",
  "set process -p thermal_bare -i NLO kv general.generate_events=false",
]


[[command_blocks]]
name = "integrate"
commands = [
  "set process -p thermal -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "set process -p vacuum -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "set process -p zero_temperature -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "set process -p thermal_hh -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "set process -p thermal_hhl -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "set process -p thermal_aux -i NLO kv integrator.n_max=$(samples:250000) integrator.n_start=$(batch:25000)",
  "integrate -p thermal -i NLO -p vacuum -i NLO -p zero_temperature -i NLO -p thermal_hh -i NLO -p thermal_hhl -i NLO -p thermal_aux -i NLO --n-cores $(cores:2) --workspace-path $(workspace:/tmp/thermal-self-energy-integral) --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "save"
commands = ["save state -o"]
