# Hard timelike current: T=1, K=(4,0,0,1), Nc=3, e=g=1, Qd=-1/3.
# From the repository root: ./gammaloop -n <this-card> run model lo nlo inspect
commands = []

[cli_settings.state]
folder = "/tmp/gammaloop-thermal-rates-qcd-vector-state"

[cli_settings.global.n_cores]
feyngen = 1
generate = 1
compile = 1
integrate = 1

[cli_settings.global.generation]
explicit_orientation_sum_only = true
vector_polarization_sum_gauge = "Feynman"

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
iterative_orientation_optimization = false
summed = false
summed_function_map = true

[cli_settings.global.generation.uv]
subtract_uv = true
generate_integrated = true
softct = false
final_integrand = "ThreeD"
local_uv_cts_from_expanded_4d_integrands = false
inner_products = true

[cli_settings.global.generation.uv.renormalization_prescription]
log_divergent = "MUV"
massive_power_divergent = "MUV"
massless_power_divergent = "MUV"

[cli_settings.global.generation.uv.vakint]
normalization = "MSbar"
additional_normalization = "1"

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[default_runtime_settings.general]
inverse_temperature = 1.0
m_uv = 4.0
mu_r = 4.0
renormalization_localization_scale = 4.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"

[default_runtime_settings.kinematics]
e_cm = 3.872983346207417

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[4.0, 0.0, 0.0, 1.0]]
helicities = ["summed"]

[default_runtime_settings.sampling]
graphs = "summed"
orientations = "summed"
sampling_multichanneling = true
sampling_channels = "summed"
sampling_channel_weight = "ose"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.h_function]
function = "poly_exponential"
sigma = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 100000
n_increase = 0
n_max = 1000000
seed = 191007552
integrated_phase = "real"
target_relative_accuracy = 0.002

[[command_blocks]]
name = "model"
commands = [
  "import model sm-default.json",
  "set model aEWM1=12.566370614359172 aS=0.07957747154594767",
  "set global kv global.generation.medium.mode=$(mode:thermodynamic_equilibrium)",
]

[[command_blocks]]
name = "lo"
commands = [
  "generate xs a > d d~ | a d d~ g ghG ghG~ QCD^2==0 QED^2==2 [{{1}} QCD=0] --numerator-grouping group_identical_graphs_up_to_scalar_rescaling --symmetrize-left-right-states true -p vector_lo -i LO --global-prefactor-num 1 --only-diagrams",
  "generate existing -p vector_lo -i LO",
]

[[command_blocks]]
name = "nlo"
commands = [
  "generate xs a > d d~ | a d d~ g ghG ghG~ QCD^2==2 QED^2==2 [{{2}} QCD=1] --numerator-grouping group_identical_graphs_up_to_scalar_rescaling --symmetrize-left-right-states true -p vector_nlo -i NLO --global-prefactor-num 1 --only-diagrams",
  "generate existing -p vector_nlo -i NLO",
]

[[command_blocks]]
name = "save"
commands = ["save state -o"]

[[command_blocks]]
name = "export"
commands = [
  "save standalone $(output:/tmp/thermal-rates-qcd-vector)-standalone --json",
  "save dot $(output:/tmp/thermal-rates-qcd-vector)-dot --include-autogenerated-fields true",
]

[[command_blocks]]
name = "inspect"
commands = [
  "inspect -p vector_lo -i LO -m -x 0.17 -0.31 0.43 --json-output $(output:/tmp/thermal-rates-qcd-vector)-lo-inspect.json",
  "inspect -p vector_nlo -i NLO -m -x 0.17 -0.31 0.43 -0.29 0.53 0.71 --json-output $(output:/tmp/thermal-rates-qcd-vector)-nlo-inspect.json",
]

[[command_blocks]]
name = "integrate_lo"
commands = [
  "set process -p vector_lo -i LO kv integrator.n_max=$(lo_samples:100000) integrator.n_start=50000 integrator.seed=$(seed:191007552)",
  "integrate -p vector_lo -i LO --n-cores $(cores:4) --workspace-path $(output:/tmp/thermal-rates-qcd-vector)-lo-integral --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]

[[command_blocks]]
name = "auxiliary_scales"
commands = [
  "set process -p vector_nlo -i NLO kv general.m_uv=$(m_uv:2.0) general.renormalization_localization_scale=$(localization:2.0)",
]

[[command_blocks]]
name = "integrate"
commands = [
  "set process -p vector_nlo -i NLO kv integrator.n_max=$(samples:1000000) integrator.n_start=$(batch:100000) integrator.seed=$(seed:191007552)",
  "integrate -p vector_nlo -i NLO --n-cores $(cores:4) --workspace-path $(output:/tmp/thermal-rates-qcd-vector)-nlo-integral --restart --renderer tabled --no-stream-iterations --no-stream-updates",
]
