# Causal LU centers for thermal two-point functions; see report.typ.
# The double triangle reuses the massive_double_triangle model and normalization.
commands = []

[cli_settings.state]
folder = "/tmp/gammaloop-thermal-lu-centers-state"

[cli_settings.global.n_cores]
feyngen = 1
generate = 1
compile = 1
integrate = 1

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
summed = false
summed_function_map = true
iterative_orientation_optimization = false

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = false

[cli_settings.global.generation.uv]
subtract_uv = false
generate_integrated = false
softct = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[default_runtime_settings.general]
inverse_temperature = 2.0
integral_unit = "none"
evaluator_method = "SummedFunctionMap"
generate_events = false

[default_runtime_settings.kinematics]
e_cm = 1.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.0, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.h_function]
function = "poly_exponential"
sigma = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.integrator]
n_start = 10000
n_increase = 0
n_max = 1000000
seed = 271828
integrated_phase = "real"
show_max_wgt_info = true

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_rates/massive_double_triangle/model.json",
  "import graphs ./examples/cli/thermal_rates/massive_double_triangle/double_triangle.dot --process-spec 'X > { H H, L L, H H L } [{{2}}]' -p dt -i NLO -o",
  "generate existing -p dt -i NLO",
]

[[command_blocks]]
name = "generate_tbt"
commands = [
  "import graphs ./examples/cli/thermal_rates/lu_centers/triangle_box_triangle.dot --process-spec 'X > { H H, L L, H H L, H H L L } [{{3}}]' -p tbt -i NLO -o",
  "generate existing -p tbt -i NLO",
]

[[command_blocks]]
name = "save"
commands = ["save state -o"]

# `kinematics` sets the probe four-momentum P=(E,0,0,p) of `process`; `centers` is `origin`
# or `search`. The inspect point is a momentum-space smoke check.
[[command_blocks]]
name = "kinematics"
commands = [
  "set process -p $(process:dt) -i NLO kv kinematics.externals.data.momenta=[[$(energy:1.0),0.0,0.0,$(momentum:0.0)]] kinematics.e_cm=$(e_cm:1.0) lu_flow.centers=$(centers:search)",
]

# `apex_<process>` fixes the center of every loop momentum (generation loop edges) at the
# hyperboloid center p/2, which replaces the `centers` prescription of that process's graph.
[[command_blocks]]
name = "apex_dt"
commands = [
  "set process -p dt -i NLO kv lu_flow.fixed_centers.massive_double_triangle=[[3,[0.5]],[5,[0.5]]]",
]

[[command_blocks]]
name = "apex_tbt"
commands = [
  "set process -p tbt -i NLO kv lu_flow.fixed_centers.massive_triangle_box_triangle=[[6,[0.5]],[3,[0.5]],[8,[0.5]]]",
]

[[command_blocks]]
name = "inspect"
commands = [
  "inspect -p dt -i NLO -m --graph-id 0 -x 0.4 0.2 0.1 -0.3 0.5 0.2",
]

# Approach the spacelike double-triangle overlap of the LL and HH two-particle absorption cuts
# probed by tests/tests/test_runs/thermal_lu_centers.rs; run it after `kinematics` with
# energy=0.5, momentum=1.5, e_cm=1.4142135623730951. The midpoint K0=s0 (sin 0.3, 0, cos 0.3),
# K1 lies on both cut surfaces; the axis rescales K0, so t is the relative distance between the
# two roots. Per-cut event weights show whether their overlap poles cancel.
[[command_blocks]]
name = "approach_dt_overlap"
commands = [
  "set process -p dt -i NLO kv general.generate_events=true",
  "approach -p dt -i NLO -m --graph-id 0 -x 0.3212345456393843 0.0 1.0384639564382658 0.0 0.22539501322019227 0.41258280423477773 --approach-axis 0.3212345456393843,0.0,1.0384639564382658,0.0,0.0,0.0 --axis-label LL_root_shift --n-points 9 --skip-midpoint --logarithmic --min-abs-t 1e-10 --max-abs-t 1e-2 --n-cores $(cores:8) --output-results $(output:/tmp/thermal-lu-centers-approach.json)",
]

# Adapt for `training` iterations of `batch` samples, then sample the frozen grid up to `samples`.
# The defaults above set n_increase = 0 and no target accuracy. Per-iteration archives separate
# the frozen samples. campaign.py runs `kinematics`, `apex_<process>` for apex centers, and this
# block on a read-only state generated by this card, which rejects changed block definitions.
[[command_blocks]]
name = "integrate"
commands = [
  "set process -p $(process:dt) -i NLO kv integrator.n_start=$(batch:10000) integrator.n_max=$(samples:1000000) integrator.seed=$(seed:271828) integrator.training_iterations=$(training:10)",
  "integrate -p $(process:dt) -i NLO --n-cores $(cores:8) --workspace-path $(workspace:/tmp/thermal-lu-centers-integral) --restart --write-results-for-each-iteration --renderer tabled --no-stream-iterations --no-stream-updates",
]
