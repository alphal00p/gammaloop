# From the repository root: ./gammaloop -n <this-card> run generate rest_decay inspect
commands = []

[cli_settings.state]
folder = "/tmp/gammaloop-thermal-rates-bubble-state"

[cli_settings.global.n_cores]
feyngen = 1
generate = 1
compile = 1
integrate = 1

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = false

[cli_settings.global.generation.uv]
subtract_uv = false
generate_integrated = false
softct = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[cli_settings.global.generation.evaluator]
compile = false
summed = false
summed_function_map = true
iterative_orientation_optimization = false

[default_runtime_settings.general]
evaluator_method = "SummedFunctionMap"
integral_unit = "none"
inverse_temperature = 1.6666666666666667
generate_events = true

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[default_runtime_settings.sampling]
graphs = "summed"
orientations = "summed"
lmb_multichanneling = false
lmb_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.h_function]
function = "poly_exponential"
sigma = 1.0

[default_runtime_settings.kinematics]
e_cm = 2.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[2.0, 0.0, 0.0, 0.0]]
helicities = [0]

[default_runtime_settings.integrator]
integrated_phase = "real"
n_start = 50000
n_increase = 0
n_max = 1000000
seed = 181026
target_relative_accuracy = 0.01

[[command_blocks]]
name = "generate"
commands = [
  "import model ./examples/cli/thermal_rates/scalar_bubble/model.json",
  "set global kv global.generation.medium.mode=thermodynamic_equilibrium global.generation.medium.vacuum_subtraction=false",
  "generate xs X > B1 B2 FI^2==2 [{{1}}] -p equilibrium -i LO",
  "generate existing -p equilibrium -i LO",
  "set global kv global.generation.medium.vacuum_subtraction=true",
  "generate xs X > B1 B2 FI^2==2 [{{1}}] -p thermal_excess -i LO",
  "generate existing -p thermal_excess -i LO",
  "set global kv global.generation.medium.mode=vacuum global.generation.medium.vacuum_subtraction=false",
  "generate xs X > B1 B2 FI^2==2 [{{1}}] -p vacuum -i LO",
  "generate existing -p vacuum -i LO",
]

[[command_blocks]]
name = "rest_decay"
commands = [
  "set model MX=2.0",
  "set model M1=0.4",
  "set model M2=0.7",
  "set process -p equilibrium -i LO kv kinematics.e_cm=2.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.0,0.0,0.0,0.0]]",
  "set process -p thermal_excess -i LO kv kinematics.e_cm=2.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.0,0.0,0.0,0.0]]",
  "set process -p vacuum -i LO kv kinematics.e_cm=2.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.0,0.0,0.0,0.0]]",
]

[[command_blocks]]
name = "boosted_decay"
commands = [
  "set model MX=2.0",
  "set model M1=0.4",
  "set model M2=0.7",
  "set process -p equilibrium -i LO kv kinematics.e_cm=2.5 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.5,0.0,0.0,1.5]]",
  "set process -p thermal_excess -i LO kv kinematics.e_cm=2.5 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.5,0.0,0.0,1.5]]",
  "set process -p vacuum -i LO kv kinematics.e_cm=2.5 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[2.5,0.0,0.0,1.5]]",
]

[[command_blocks]]
name = "closed"
commands = [
  "set model MX=1.0",
  "set model M1=0.6",
  "set model M2=0.8",
  "set process -p equilibrium -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
  "set process -p thermal_excess -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
  "set process -p vacuum -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
]

[[command_blocks]]
name = "absorption"
commands = [
  "set model MX=1.0",
  "set model M1=0.3",
  "set model M2=1.8",
  "set process -p equilibrium -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
  "set process -p thermal_excess -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
  "set process -p vacuum -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.6666666666666667 kinematics.externals.data.momenta=[[1.0,0.0,0.0,0.0]]",
]

[[command_blocks]]
name = "spacelike"
commands = [
  "set model MX=1.0",
  "set model M1=0.5",
  "set model M2=0.5",
  "set process -p equilibrium -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.0 kinematics.externals.data.momenta=[[1.0,0.0,0.0,2.0]]",
  "set process -p thermal_excess -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.0 kinematics.externals.data.momenta=[[1.0,0.0,0.0,2.0]]",
  "set process -p vacuum -i LO kv kinematics.e_cm=1.0 general.inverse_temperature=1.0 kinematics.externals.data.momenta=[[1.0,0.0,0.0,2.0]]",
]

[[command_blocks]]
name = "inspect"
commands = [
  "inspect -p equilibrium -i LO -m -x 0.6 0.0 0.8 --json-output /tmp/thermal-rates-bubble-equilibrium-inspect.json",
  "inspect -p thermal_excess -i LO -m -x 0.6 0.0 0.8 --json-output /tmp/thermal-rates-bubble-thermal_excess-inspect.json",
  "inspect -p vacuum -i LO -m -x 0.6 0.0 0.8 --json-output /tmp/thermal-rates-bubble-vacuum-inspect.json",
]

[[command_blocks]]
name = "integrate"
commands = [
  "set process -p equilibrium -i LO kv general.generate_events=false",
  "set process -p thermal_excess -i LO kv general.generate_events=false",
  "set process -p vacuum -i LO kv general.generate_events=false",
  "integrate -p equilibrium -i LO -p thermal_excess -i LO -p vacuum -i LO --n-cores 3 --restart --workspace-path /tmp/thermal-rates-bubble-integral",
]
