# Run from the repository root; see README.md for the bounded command.
# Ordinary UV (MUV) reproduces scalar growth on the current soft-CT branch.
# This card does not establish whether the growth predates that branch.
commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default",
  "remove processes",
  "import graphs ./tests/resources/graphs/paper_figure_b1_double_triangle_soft_ir.dot -p paper_figure_b1_double_triangle_soft_ir -i paper_figure_b1_double_triangle_soft_ir",
  "generate existing -p paper_figure_b1_double_triangle_soft_ir -i paper_figure_b1_double_triangle_soft_ir",
]

[cli_settings.global]
# Keep stage timings and packed expression sizes; omit full expression dumps.
logfile_directive = "off,[{#generation,#summary}]=debug,[{#generation,#cff,#profile}]=debug"
display_directive = "warn"

[cli_settings.global.n_cores]
generate = 1

[cli_settings.global.generation]
explicit_orientation_sum_only = false

[cli_settings.global.generation.orientation_pattern]
# Source map 58 in the measured 102-entry parent CFF inventory. Its central
# bubble and nested child-to-overall forest coefficients are represented.
pat = "(0,0,+,+,-,-,+,+,+,-)"

[cli_settings.global.generation.uv]
final_integrand = "ThreeD"
local_uv_cts_from_expanded_4d_integrands = false
subtract_uv = true
generate_integrated = false
add_marker = false
inner_products = true
orchestrator = "hedge_poset"

[cli_settings.global.generation.uv.renormalization_prescription]
# These prescriptions select ordinary U; the legacy softct flag is not used.
log_divergent = "MUV"
massive_power_divergent = "MUV"
massless_power_divergent = "MUV"
overrides = []

[cli_settings.global.generation.evaluator]
do_algebra = false
compile = false
iterative_orientation_optimization = false
summed = false
summed_function_map = false
spenso_execution_mode = ["Sequential", "MinResultRank"]
tensor_network_contraction_order = "intermediate_cost"
horner_iterations = 1

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = false
disable_tropical_generation = true

[default_runtime_settings.kinematics]
e_cm = 300.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[300.0, 0.0, 0.0, 0.0], "dependent"]
helicities = [1, -1]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
m_uv = 20.0
mu_r = 20.0
