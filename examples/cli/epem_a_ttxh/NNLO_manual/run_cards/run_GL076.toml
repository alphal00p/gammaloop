[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

# Mandatory remediation UV audit in the generation LMB. The selected masks
# cover q13=K2-K1, q12=K3, q14=K1-K2-K3, and the overall four-loop limit in
# every orientation, using a reproducible random ray.
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 7620260809
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6,8,14,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL076/uv_profiles/pristine_random_g0_lmb0_masks6_8_14_15_per_orientation_n5_exp6_10_seed7620260809""",
]

[[command_blocks]]
name = "uv_profile_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --use_f128
      --per-orientation --seed 7620260809
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6,8,14,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL076/uv_profiles/pristine_random_f128_g0_lmb0_masks6_8_14_15_per_orientation_n5_exp6_10_seed7620260809""",
]

[[command_blocks]]
name = "uv_profile_f128_low"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 4 --max-scaling 8 --use_f128
      --per-orientation --seed 7620260809
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6,8,14,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL076/uv_profiles/pristine_random_f128_g0_lmb0_masks6_8_14_15_per_orientation_n5_exp4_8_seed7620260809""",
]

[[command_blocks]]
name = "final_generate_and_uv"
commands = [
  "run generate_full",
  "run uv_profile",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

