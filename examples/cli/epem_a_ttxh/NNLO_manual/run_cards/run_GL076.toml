# Precision follow-up for the cancellation-limited soft/collinear totals. The
# fixed paths are unchanged; only the active numerical lane differs.
[[command_blocks]]
name = "probe_precision_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_soft_e12_arb",
  "run approach_soft_e14_generic_arb",
  "run approach_collinear_e12_e13_arb",
  "run approach_collinear_e12_e14",
  "run approach_collinear_e13_e14_arb",
]

[[command_blocks]]
