[cli_settings]
override_state = true

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL076"
name = "NNLO_manual_GL076"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL076.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

# Structural candidate probe only. UV subtraction is deliberately absent, so
# this cannot become the accepted campaign state.
[[command_blocks]]
name = "probe_threshold_structure"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation orientation cuts --show-threshold-functions",
]

# Candidate triage and complete no-UV regression. Both regenerate from the
# current DOT before evaluating any all-cut/all-orientation approach.
[[command_blocks]]
name = "probe_candidate_quick_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_soft_e12_arb",
  "run approach_correlated_soft_e12_bridge",
  "run approach_correlated_soft_e12_2627",
  "run approach_collinear_e13_e14_arb",
]

[[command_blocks]]
name = "probe_candidate_center_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_soft_e12_arb",
  "run approach_collinear_e13_e14_arb",
]

[[command_blocks]]
name = "probe_candidate_collinear_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_collinear_e13_e14_arb",
]

[[command_blocks]]
name = "probe_all_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run all_approaches",
]

[[command_blocks]]
name = "probe_threshold_only_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run threshold_only_approaches",
]

[[command_blocks]]
name = "probe_threshold_remainder_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_threshold_691214",
  "run approach_threshold_71112",
  "run approach_threshold_67",
]

[[command_blocks]]
name = "probe_candidate_A_acceptance_no_uv"
commands = [
