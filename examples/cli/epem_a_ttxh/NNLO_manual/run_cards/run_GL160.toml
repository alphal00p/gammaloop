# q14=K1-K2, q12=K2-K3, their union, and the overall UV limit are exact
# masks 6, 12, 14, and 15 in generation LMB #0=(e2,e4,e6,e9).
[[command_blocks]]
name = "remediation_uv_random_masks6_12_14_15"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 16020260809
      --graph-index 0 --lmb-index 0
      --loop-subset-mask 6,12,14,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL160/uv_profiles/remediation_random_g0_lmb0_masks6_12_14_15_n5_exp6_10_seed16020260809""",
]

