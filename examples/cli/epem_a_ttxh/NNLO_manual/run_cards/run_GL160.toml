# The first structural test uses the same nondegenerate E19 root in Arb and a
# separate candidate state. K3 is nonzero and E27 remains 632 GeV away, avoiding
# the radial-center ambiguity of the original K3=0 path.
[[command_blocks]]
name = "candidate_shared9_soft_e14_E19_arb16"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,37,-29,409.8001916343071,37,-29,409.8001916343071,37,-29,41
      --approach-axis 0,0,0,0,0,0,211,-157,193,19,-23,41
      --axis-label 'candidate shared-[9] nondegenerate e14 soft at E19' --parameter-name lambda
      --n-points 16 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL160_candidate_shared9/candidate_soft_e14_E19_arb16.json""",
]

[[command_blocks]]
name = "approach_correlated_double_soft_E19_E27"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,0,0,469.11725613113
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'independent double soft at coalescing E19 E27' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL160/approach_correlated_double_soft_E19_E27.json""",
]

