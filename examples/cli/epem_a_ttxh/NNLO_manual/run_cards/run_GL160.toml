[[command_blocks]]
name = "inspect_max_weights_GL160"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"
    '""",
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
  """inspect -p epem_a_tth -i NNLO
      -x 0.15873329432784430 0.62872345889402714 0.21366559887903705 0.18802960704739649 0.50748321307604305 0.34528407656751681 0.16666251273908955 0.053960778627259544 0.17123935086664144 0.082572801153901268 0.68944138785465026 0.83068993615283526
      -d 0,1""",
  """inspect -p epem_a_tth -i NNLO
      -x 0.057008616895385167 0.99076013738649771 0.22940905237287323 0.18650426269697973 0.071246793080345039 0.38695059235008716 0.051357492288614796 0.46180164310615784 0.81887912507727179 0.066004220491050258 0.50253801969773548 0.48126221966469097
      -d 0,1""",
  """inspect -p epem_a_tth -i NNLO
      -x 0.10972623466025451 0.99118847071714000 0.49789102450967843 0.20333605818166042 0.54914270964716383 0.20952880263449006 0.25472342575431661 0.72875103003230579 0.038757914299823344 0.22859789775561820 0.013640363910327994 0.74117680039598088
      -d 0,1""",
