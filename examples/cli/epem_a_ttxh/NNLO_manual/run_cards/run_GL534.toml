[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534"
name = "NNLO_manual_GL534"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL534.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 53420260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/uv_profiles/final_exp8_12_seed53420260809""",
]

[[command_blocks]]
name = "uv_profile_final_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12 --use_f128
      --per-orientation --seed 53420260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/uv_profiles/final_f128_exp8_12_seed53420260809""",
]

[[command_blocks]]
name = "uv_profile_final_low_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 6 --max-scaling 10 --use_f128
      --per-orientation --seed 53420260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/uv_profiles/final_f128_exp6_10_seed53420260809""",
]

# Mask 14 is the exact K1/K2/K3 sector entering q13 in generated LMB 0;
# mask 15 adds the full four-loop scaling.  Random rays supersede the old
# incomplete exhaustive fixed-ray profile.
[[command_blocks]]
name = "remediation_uv_random_masks14_15"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 53420260810
      --graph-index 0 --lmb-index 0 --loop-subset-mask 14 --subset-cardinality 3
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/trials/remediation/uv_random_g0_lmb0_mask14_n5_exp6_10_seed53420260810""",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 53420260811
      --graph-index 0 --lmb-index 0 --loop-subset-mask 15 --subset-cardinality 4
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/trials/remediation/uv_random_g0_lmb0_mask15_n5_exp6_10_seed53420260811""",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_threshold_off_diagnostic"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

# q12=K3.
[[command_blocks]]
name = "approach_soft_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,74,-52,137,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e12 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/approach_soft_e12.json""",
]

