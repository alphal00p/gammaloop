[[command_blocks]]
name = "all_approaches"
commands = [
  "run base_ir_approaches",
  "run GL534_correlated_ir_approaches",
]

[[command_blocks]]
name = "integrate"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [integrator]
    n_start = 100
    n_increase = 0
    n_max = 10000000000
    seed = 1337

    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"

    [stability]
    escalate_if_exact_zero = false
    loop_momenta_norm_escalation_factor = -1.0
    rotation_axis = [{ type = "z" }]

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 1.0e99
    '""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration
      --restart""",
]

[[command_blocks]]
name = "remediation_integrate_lean"
commands = [
  "run runtime_uv_profile",
  """set process -p epem_a_tth -i NNLO string '
    [integrator]
    n_start = 20
    n_increase = 0
    n_max = 10000000000
    seed = 53420260812

    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"

    [stability]
    escalate_if_exact_zero = false
    loop_momenta_norm_escalation_factor = -1.0
    rotation_axis = [{ type = "z" }]

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 1.0e99
    '""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --workspace-path ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/trials/remediation_integration_workspace
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration
      --restart""",
]

