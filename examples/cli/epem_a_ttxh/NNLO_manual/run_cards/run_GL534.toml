# Since q12+q13+q14=0, any two soft gluons force the third soft. The two
# independent soft momenta approach along independent three-vectors.
[[command_blocks]]
name = "approach_double_soft"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'independent double soft (all e12 e13 e14 soft)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL534/approach_double_soft.json""",
]

# Hard nonzero collinear sectors at V_36. In each path only the two independent
# relative transverse components vanish; the third gluon carries the recoil.
[[command_blocks]]
name = "approach_collinear_e12_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
