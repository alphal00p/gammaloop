[[command_blocks]]
name = "inspect_max_weights"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"
    '""",
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
  # Signed re+ and componentwise-absolute re maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.19768791593765309 0.21606899637612301 0.68391096443088573 0.17360274249853727 0.23227784115047401 0.67978860740877112 0.15478177586952796 0.89204751851665531 0.97923014937111419 0.26347070570911985 0.68223783955827877 0.22818888302110465
      -d 0,4""",
  # Signed re- maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.25195199562942466 0.10277751017297479 0.24464256201050472 0.22268282497182632 0.11624121572182738 0.31384973844870762 0.12158987439045658 0.60923802396586291 0.52157226741943941 0.34541081316157918 0.64775796208041059 0.39728838496057400
      -d 0,2""",
  # Signed im+ maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.25706097397800498 0.28018398279789886 0.92685194559995387 0.37218961063673478 0.34633782466179250 0.71567675043434720 0.42649935407108824 0.74688576204904156 0.93201862923368251 0.83647731718376328 0.78780247287125906 0.29733602933272568
      -d 0,4""",
  # Signed im- and componentwise-absolute im maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.087056638190459806 0.24248679381649374 0.020064276539581399 0.18168324906205932 0.71623632496308698 0.36657621009219954 0.26719974701021321 0.92453854107994027 0.10529945145074970 0.32560225700961887 0.83278256536014716 0.22735761244656194
      -d 0,2""",
]

