      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL292/approach_double_soft_arb.json""",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run approach_soft_e11",
  "run approach_soft_e14",
  "run approach_soft_e14_generic",
