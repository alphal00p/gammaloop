      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 29220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL292/uv_profiles/final_exp8_12_seed29220260809""",
]

