# High-precision adjudicator for the f64 cancellation of individually stable
# rank-six original-cut contributions. No orientation or cut is filtered.
[[command_blocks]]
name = "approach_double_soft_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 91,64,83,31,-47,59,0,0,0,0,0,0
      --approach-axis 98,-86,342,0,0,0,211,-157,193,-113,71,149
