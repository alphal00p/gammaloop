[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL368"
name = "NNLO_manual_GL368"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL368.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_approach_threshold_off"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

# Spatial routing: q12=K0-K1+K3 and q13=K3.
[[command_blocks]]
name = "approach_soft_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 43,-5,78,74,-52,137,-91,64,83,31,-47,59
      --approach-axis 98,-86,342,0,0,0,0,0,0,0,0,0
      --axis-label 'e12 gluon soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL368/approach_soft_e12.json""",
]

[[command_blocks]]
name = "approach_soft_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,74,-52,137,-91,64,83,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e13 gluon soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL368/approach_soft_e13.json""",
]

[[command_blocks]]
name = "approach_double_soft_e12_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 74,-52,137,74,-52,137,-91,64,83,0,0,0
      --approach-axis 0,0,0,113,-71,-149,0,0,0,211,-157,193
      --axis-label 'independent e12 e13 double soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL368/approach_double_soft_e12_e13.json""",
]

# At q12=0 the active E7=(5,13,14) and E52=(4,5,12,13) surfaces coalesce.
[[command_blocks]]
name = "approach_correlated_e12_E7_E52"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 0,0,364.966128135779,0,0,464.966128135779,-91,64,83,0,0,100
      --approach-axis 98,-86,365,0,0,23,0,0,0,0,0,0
      --axis-label 'e12 soft at coalescing E7 E52' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL368/approach_correlated_e12_E7_E52.json""",
]

