      --point 0,0,180.474374912340,0,0,180.474374912340,0,0,180.474374912340,0,0,0
      --approach-axis 0,0,23,113,-71,-126,0,0,29,211,-157,193
      --axis-label 'double soft at coalescing starred E6 E17' --parameter-name lambda
