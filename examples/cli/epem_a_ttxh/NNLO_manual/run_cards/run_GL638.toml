[[command_blocks]]
name = "integration"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"
    '""",
  """set process -p epem_a_tth -i NNLO kv
      general.m_uv=91.188
      general.evaluator_method=SingleParametric
      general.generate_events=false
      general.store_additional_weights_in_event=false
      subtraction.disable_threshold_subtraction=false
      integrator.n_start=100
      integrator.n_increase=0
      integrator.n_max=10000000000
      integrator.seed=1337
      integrator.discrete_dim_learning_rate=0.0
      integrator.continuous_dim_learning_rate=0.25
      integrator.n_bins=16""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration --restart""",
]

# Mandatory remediation UV audit: every visible LMB subset and orientation.
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 63820260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL638/uv_profiles/final_exp8_12_seed63820260809""",
]

# Adaptive precision/range fallbacks, used only when the baseline windows
# lose coverage, fit quality, or slope stability.
[[command_blocks]]
name = "uv_profile_final_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12 --use_f128
      --per-orientation --seed 63820260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL638/uv_profiles/final_f128_exp8_12_seed63820260809""",
]

