[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL638"
name = "epem_a_ttxh_NNLO_manual_GL638"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL638.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_uv_fallback"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_events"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "approach_soft_q13"
commands = [
  "run runtime_events",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0
      --point 31,-47,83,-59,101,-73,127,41,-109,31,-47,83
      --approach-axis 47,29,-31,0,0,0,0,0,0,258,-128,162
      --axis-label 'q13 single soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL638/approaches/soft_q13.json""",
]

