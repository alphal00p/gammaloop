[[command_blocks]]
name = "inspect_max_weights"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"
    '""",
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
  # Signed/absolute real and signed/absolute imaginary-positive maxima.
  """inspect -p epem_a_tth -i NNLO
      -x 0.21481895929070438 0.54927075399870784 0.52751066480503128 0.14620812540287725 0.10900227037626352 0.61921220283136147 0.19237513152509453 0.46746840507162662 0.14606375816162961 0.16069744698572114 0.11595330880284258 0.20964503967586992
      -d 0,1""",
  # Signed imaginary-negative maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.22161353957759281 0.12243281464548342 0.70919785823253345 0.13783552281749478 0.97871498526834577 0.38094531297076872 0.14912950605957782 0.21998797851472818 0.44770807507709831 0.097529778579808546 0.12390399788446391 0.035556028872697890
