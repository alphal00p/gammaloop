[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

# Summed-orientation screening uses the same fixed ray and still enumerates all
# 15 nonempty loop subsets; it is the required first UV gate before the more
# expensive 232-orientation decomposition below.
[[command_blocks]]
name = "uv_profile_fixed_screen"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 17 --min-scaling 8 --max-scaling 12
      --seed 49020260809
      --uv-ray-directions 37,126,-109,-91,64,83,74,-52,137,211,-157,193
      --uv-ray-norms 1000,1000,1000,1000
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/uv_profiles/fixed_screen_exp8_12_seed49020260809""",
]

# Focused per-orientation UV adjudication in generated LMB 0 = (4,7,11,13).
# Mask 6 scales the rejected genuine-two-loop [7,11] candidate, mask 8
# scales the q13=K3 defect coordinate, and mask 14 checks their overlap.
[[command_blocks]]
name = "uv_profile_gl490_focus_lmb0_masks6_8_14_f64"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 17 --min-scaling 8 --max-scaling 12 --per-orientation
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6,8,14
      --seed 49020260809
      --uv-ray-directions 37,126,-109,-91,64,83,74,-52,137,211,-157,193
      --uv-ray-norms 1000,1000,1000,1000
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/uv_profiles/focused_per_orientation_lmb0_masks6_8_14_f64_exp8_12_seed49020260809""",
]

[[command_blocks]]
name = "uv_profile_gl490_focus_lmb0_masks6_8_14_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 17 --min-scaling 8 --max-scaling 12 --per-orientation --use_f128
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6,8,14
      --seed 49020260809
      --uv-ray-directions 37,126,-109,-91,64,83,74,-52,137,211,-157,193
      --uv-ray-norms 1000,1000,1000,1000
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/uv_profiles/focused_per_orientation_lmb0_masks6_8_14_f128_exp8_12_seed49020260809""",
]

# Timing on the first campaign selector profiles motivates independent five-
# point batches. Their completed JSON union covers the same three masks while
# preserving partial evidence if a later batch reaches the lease boundary.
[[command_blocks]]
name = "uv_profile_gl490_focus_lmb0_mask6_f64_n5"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 8 --max-scaling 12 --per-orientation
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6
      --seed 49020260809
      --uv-ray-directions 37,126,-109,-91,64,83,74,-52,137,211,-157,193
      --uv-ray-norms 1000,1000,1000,1000
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/uv_profiles/focused_per_orientation_lmb0_mask6_f64_n5_exp8_12_seed49020260809""",
]

