# Final remediation keeps every massive momentum generic.  The correlated
# points isolate q12/E6-E51, q13/all four active surfaces, and q14/E45-E53;
# the collinear points keep all active threshold surfaces away from zero.
[[command_blocks]]
name = "remediation_final_correlated_collinear_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point=37,126,-109,80,-60,40,80,-60,40,150.93405375788296,-106.0617675055394,279.4319643895941
      --approach-axis=0,0,0,0,0,0,13,17,-11,0,0,47
      --axis-label 'generic q12 soft E6-E51 bridge Arb' --parameter-name lambda
      --n-points 8 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/trials/remediation/correlated_q12_E6_E51_arb.json""",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
