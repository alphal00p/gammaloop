# Random rays replace the inconclusive fixed-ray masks.  Mask 14 is exactly
# the q13-dependent (e7,e11,e13) sector of LMB 0; mask 15 is the full basis.
[[command_blocks]]
name = "remediation_uv_random_masks14_15"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 49020260810
      --graph-index 0 --lmb-index 0 --loop-subset-mask 14 --subset-cardinality 3
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/trials/remediation/uv_random_g0_lmb0_mask14_n5_exp6_10_seed49020260810""",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 49020260811
      --graph-index 0 --lmb-index 0 --loop-subset-mask 15 --subset-cardinality 4
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL490/trials/remediation/uv_random_g0_lmb0_mask15_n5_exp6_10_seed49020260811""",
]

