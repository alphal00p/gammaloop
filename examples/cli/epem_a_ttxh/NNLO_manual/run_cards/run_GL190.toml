      --point 37,126,-109,74,-52,137,0,0,500,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,13,17,19
      --axis-label 'e9 soft at coalescing E30 E34' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL190/approach_correlated_soft_e9_E30_E34.json""",
]

