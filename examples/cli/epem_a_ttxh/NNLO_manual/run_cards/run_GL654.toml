      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL654/approach_correlated_soft_e13_E25.json""",
]

# q14=0 intersects the active E22=(4,5,7,12) surface.
[[command_blocks]]
name = "approach_correlated_soft_e14_E22"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point=150.276498133253,0,0,0,150.276498133253,0,-150.276498133253,150.276498133253,150.276498133253,0,0,150.276498133253
      --approach-axis=19,-23,41,0,0,0,0,0,0,0,0,0
      --axis-label 'e14 soft at E22 threshold' --parameter-name lambda
