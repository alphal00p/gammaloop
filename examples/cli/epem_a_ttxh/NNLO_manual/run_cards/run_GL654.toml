[[command_blocks]]
name = "approach_correlated_soft_e13_E25"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point=150.276498133253,0,0,0,150.276498133253,0,0,0,150.276498133253,150.276498133253,0,0
      --approach-axis=0,0,0,0,0,0,0,0,0,19,-23,41
