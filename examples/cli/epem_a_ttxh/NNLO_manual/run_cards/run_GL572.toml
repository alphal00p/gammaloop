[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572"
name = "NNLO_manual_GL572"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL572.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "inventory_pristine"
commands = [
  "run display_structure",
  "run display_lmb",
]

[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 57220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572/uv_profiles/final_exp8_12_seed57220260809""",
]

[[command_blocks]]
name = "uv_profile_final_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12 --use_f128
      --per-orientation --seed 57220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572/uv_profiles/final_f128_exp8_12_seed57220260809""",
]

[[command_blocks]]
name = "uv_profile_final_low_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 6 --max-scaling 10 --use_f128
      --per-orientation --seed 57220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572/uv_profiles/final_f128_exp6_10_seed57220260809""",
]

# This legacy pre-selector block visits every derived LMB and every nonempty
# loop subset. Its reduced fixed ray focuses four distinct directions of the
# original (e3,e4,e6,e7) generation basis while retaining per-orientation
# evidence.
[[command_blocks]]
name = "uv_profile_basis_focus"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 9 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 57220260809
      --uv-ray-directions=211,-157,193,37,126,-109,98,-86,342,-91,64,83
      --uv-ray-norms=1000,1000,1000,1000
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572/uv_profiles/original_basis_focus_exp8_12_seed57220260809""",
]

# Target the pristine generated graph and its generation LMB #0=(e3,e4,e6,e7).
# Masks 1/2/4/8 test each independent loop coordinate, 5=(e3,e6) and
# 12=(e6,e7) test the two massless-exchange sectors q13=e3-e6 and
# q14=e7-e6, and 15 tests the simultaneous overall UV limit. Cardinalities
# 1/2/4 intentionally exclude unrelated three-coordinate rays.
[[command_blocks]]
name = "uv_profile_GL572_pristine_graph0_lmb0_targeted_masks"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 9 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 57220260809
      --uv-ray-directions=211,-157,193,37,126,-109,98,-86,342,-91,64,83
      --uv-ray-norms=1000,1000,1000,1000
      --graph-index=0 --lmb-index=0
      --loop-subset-mask=1,2,4,5,8,12,15
      --subset-cardinality=1,2,4
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL572/uv_profiles/pristine_graph0_lmb0_masks_1_2_4_5_8_12_15_exp8_12_seed57220260809""",
]

# Five-point split fallbacks serialize each physically decisive sector
# independently, so an interrupted batch cannot erase completed coverage.
# Masks 5 and 12 completed; mask 15 remains an explicit unrun follow-up.
