      --point 37,126,-109,105,-99,196,74,-52,137,31,-47,59
      --approach-axis 0,0,0,211,-157,193,0,0,0,0,0,0
      --axis-label 'e13 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL148/approaches/soft_e13.json""",
]

[[command_blocks]]
