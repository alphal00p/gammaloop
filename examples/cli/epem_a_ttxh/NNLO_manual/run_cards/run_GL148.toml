      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'triple soft at all active threshold families' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL148/approaches/correlated_double_soft.json""",
