# At e12 soft, E33/E21 and E40/E29 coalesce.  Setting |K2| so that
# 2*sqrt(|K2|^2+MT^2)=1000 puts all four surfaces on shell.
[[command_blocks]]
name = "approach_correlated_soft_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,0,0,469.11725613113,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,47,211,-157,193
      --axis-label 'e12 soft at E33/E21 and E40/E29 intersection' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL148/approaches/correlated_soft_e12.json""",
]

# With K2=-K1=220.071 zhat and K3=-440.142 zhat, the common
# E54/E33/E17/E40 threshold condition is met while e13 is soft.
[[command_blocks]]
name = "approach_correlated_soft_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,0,0,-220.071,0,0,220.071,0,0,-440.142
      --approach-axis 0,0,0,47,29,-31,0,0,0,0,0,19
      --axis-label 'e13 soft at E54/E33 and E17/E40 intersection' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL148/approaches/correlated_soft_e13.json""",
]

[[command_blocks]]
name = "approach_correlated_soft_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,0,0,220.071,0,0,220.071,0,0,-440.142
      --approach-axis 0,0,0,0,0,0,47,29,-31,0,0,19
      --axis-label 'e14 soft at E54/E33 and E17/E40 intersection' --parameter-name lambda
