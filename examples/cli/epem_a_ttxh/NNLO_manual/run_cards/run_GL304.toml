# The full-range Arb run is safe in power but its widest fit window reaches a
# subleading transition.  This reduced range tests the same affine geometry
# deeper in the q12 asymptotic region without changing its hard complement.
[[command_blocks]]
name = "approach_soft_e12_arb_reduced"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,0,0,0,37,-178,246
      --approach-axis 0,0,0,0,0,0,211,-157,193,211,-157,193
      --axis-label 'cut gluon e12 soft reduced-range Arb adjudicator' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-8 --max-abs-t 1e-4
      --skip-midpoint --n-cores 3
