      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL304_shared_projection_parent491213/uv_profiles/final_f128_exp10_14_seed30420260809""",
]

# Final seeded-random certification in the accepted (A,C,Q,D) =
# (e4,e9,e12,e13) basis.  The split masks are exactly the q12, q13,
# independent double-soft, and overall four-loop supports.  Fixed-ray
# arguments are deliberately omitted, and every batch covers every orientation.
[[command_blocks]]
name = "uv_profile_final_random_g0_lmb0_mask4_q12_n5_exp4_8"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 4 --max-scaling 8
      --per-orientation --seed 30420260809 --graph-index 0 --lmb-index 0
      --loop-subset-mask 4 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL304_shared_projection_parent491213/uv_profiles/final_random_g0_lmb0_mask4_q12_n5_exp4_8_seed30420260809""",
]

# Adaptive retry for the process-invalid 4..8 mask-4 screen.  The higher UV
# range keeps the same seeded random ray and selector while avoiding the
# low-scale projected-root obstruction; the failed run produced no JSON.
[[command_blocks]]
name = "uv_profile_final_random_g0_lmb0_mask4_q12_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 30420260809 --graph-index 0 --lmb-index 0
      --loop-subset-mask 4 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL304_shared_projection_parent491213/uv_profiles/final_random_g0_lmb0_mask4_q12_n5_exp6_10_seed30420260809""",
]

