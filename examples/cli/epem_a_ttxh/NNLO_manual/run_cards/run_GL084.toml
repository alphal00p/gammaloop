[cli_settings]
override_state = true

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL084"
name = "NNLO_manual_GL084"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL084.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmbs"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis",
]

[[command_blocks]]
name = "uv_profile_runtime"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile"
commands = [
  "run uv_profile_runtime",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 8420260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL084/uv_profiles/base_exp8_12_seed8420260809""",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "run uv_profile_runtime",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 8420260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL084/uv_profiles/final_exp8_12_seed8420260809""",
]

# Final selected random-ray certification in the pristine generation basis
# (K0,K1,K2,K3)=(e2,e4,e6,e12). Each batch covers every orientation.
[[command_blocks]]
name = "uv_profile_final_random_g0_lmb0_mask8_q12_n5_exp4_8"
commands = [
  "run uv_profile_runtime",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 4 --max-scaling 8
      --per-orientation --seed 8420260809 --graph-index 0 --lmb-index 0
      --loop-subset-mask 8 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL084/uv_profiles/final_random_g0_lmb0_mask8_q12_n5_exp4_8_seed8420260809""",
