# E33 and E62 share this bridge equation. At the midpoint K1=0 and
# K3=(0,0,327), hence 2*MT+2*|K3|=1000 while both gluons remain hard.
[[command_blocks]]
name = "approach_threshold_bridge"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,0,0,0,327
      --approach-axis 47,29,-31,0,0,0,0,0,0,0,0,0
      --axis-label 'IR-away eta(5,9,12,13) eta(3,7,12,13)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL297/approach_threshold_bridge.json""",
]

# The full 1e-6..1e-2 paths above expose the cancellation floor. These denser
# asymptotic windows remain far below the hard scales and test the bounded
# double-soft plateau before f64 cancellation noise takes over.
