name = "approach_double_soft_plateau"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,37,126,-109,-91,64,83
      --approach-axis 98,-86,342,0,0,0,0,0,0,211,-157,193
      --axis-label 'e12 e13 double soft precision-safe plateau' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-3 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL297/approach_double_soft_plateau.json""",
]

