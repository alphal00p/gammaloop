[cli_settings]
override_state = true

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL297"
name = "NNLO_manual_GL297"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL297.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

# Candidate regeneration without UV terms. This is a structural/IR gate only;
# it cannot become the accepted final state.
[[command_blocks]]
name = "probe_structure_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "probe_core_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_soft_e12",
  "run approach_soft_e13",
  "run approach_double_soft",
  "run approach_correlated_e12",
  "run approach_correlated_e13",
  "run approach_bridge_e12",
  "run approach_bridge_e13",
  "run approach_double_soft_threshold",
]

[[command_blocks]]
name = "probe_integration_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run integrate_smoke",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "approach_soft_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 202,10,-55,-91,64,83,37,126,-109,74,-52,137
      --approach-axis 211,-157,193,0,0,0,0,0,0,0,0,0
      --axis-label 'e12 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL297/approach_soft_e12.json""",
]

