[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310"
name = "NNLO_manual_GL310"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL310.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_threshold_off_diagnostic"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

# q11=K1-K2 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e11"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,31,-47,59,31,-47,59,-91,64,83
      --approach-axis 0,0,0,211,-157,193,0,0,0,0,0,0
      --axis-label 'e11 gluon soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_soft_e11.json""",
]

# q14=K0+K1-K2-K3 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,31,-47,59,-85,237,-85
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e14 gluon soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_soft_e14.json""",
]

# K2=K1 and K3=K0 make q11=q14=0; the two axes are independent.
[[command_blocks]]
name = "approach_double_soft"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,37,126,-109
      --approach-axis 0,0,0,211,-157,193,0,0,0,98,-86,342
      --axis-label 'independent e11 e14 double soft, thresholds away' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_double_soft.json""",
]

# At q11=0, E26/E31/E36/E48 all reduce to the same two-top surface.
[[command_blocks]]
name = "approach_correlated_e11_E26_E31_E36_E48"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.117256131130,0,0,469.117256131130,-91,64,83
      --approach-axis 0,0,0,211,-157,193,0,0,23,0,0,0
      --axis-label 'e11 soft at coalescing E26 E31 E36 E48' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_e11_E26_E31_E36_E48.json""",
]

# At q11=0, E58/E61 coincide; 2*Et(0)+2*Et(sqrt(77000))=1000.
[[command_blocks]]
name = "approach_correlated_e11_E58_E61"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,100,0,0,100,0,0,0,0,245.311187750594
      --approach-axis 0,0,0,211,-157,193,0,0,0,0,0,23
      --axis-label 'e11 soft at coalescing E58 E61' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_e11_E58_E61.json""",
]

# At q14=0, E26/E48 coincide.  Et(0)+Et(r)+r=1000.
[[command_blocks]]
name = "approach_correlated_e14_E26_E48"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,100,0,0,0,0,374.515170800553,137,126,-483.515170800553
      --approach-axis 0,0,0,0,0,0,0,0,23,211,-157,193
      --axis-label 'e14 soft at coalescing E26 E48' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_e14_E26_E48.json""",
]

# At q14=0, E58/E61 coincide without making q11 soft.
[[command_blocks]]
name = "approach_correlated_e14_E58_E61"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 100,0,0,0,100,0,0,0,224.621966992195,100,100,-224.621966992195
      --approach-axis 0,0,0,0,0,0,0,0,23,211,-157,193
      --axis-label 'e14 soft at coalescing E58 E61' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_e14_E58_E61.json""",
]

# Both soft constraints merge E26/E31/E36/E48 at the two-top surface.
[[command_blocks]]
name = "approach_correlated_double_E26_E31_E36_E48"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.117256131130,0,0,469.117256131130,37,126,-109
      --approach-axis 0,0,0,211,-157,193,0,0,23,98,-86,342
      --axis-label 'double soft at coalescing E26 E31 E36 E48' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_double_E26_E31_E36_E48.json""",
]

# Both soft constraints merge E58/E61 on their four-top surface.
[[command_blocks]]
name = "approach_correlated_double_E58_E61"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 0,0,245.311187750594,100,0,0,100,0,0,0,0,245.311187750594
      --approach-axis 0,0,0,211,-157,193,0,0,0,98,-86,342
      --axis-label 'double soft at coalescing E58 E61' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL310/approach_correlated_double_E58_E61.json""",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run approach_soft_e11",
  "run approach_soft_e14",
  "run approach_double_soft",
  "run approach_correlated_e11_E26_E31_E36_E48",
  "run approach_correlated_e11_E58_E61",
  "run approach_correlated_e14_E26_E48",
  "run approach_correlated_e14_E58_E61",
  "run approach_correlated_double_E26_E31_E36_E48",
  "run approach_correlated_double_E58_E61",
]

# Recovery block retained for the guarded rerun after the first E58/E61
# midpoint exposed a degenerate radial solution before any later block ran.
[[command_blocks]]
name = "remaining_approaches"
commands = [
  "run approach_correlated_e11_E58_E61",
  "run approach_correlated_e14_E26_E48",
  "run approach_correlated_e14_E58_E61",
  "run approach_correlated_double_E26_E31_E36_E48",
  "run approach_correlated_double_E58_E61",
]

[[command_blocks]]
name = "remaining_after_e14_E26"
commands = [
  "run approach_correlated_e14_E26_E48",
  "run approach_correlated_e14_E58_E61",
  "run approach_correlated_double_E26_E31_E36_E48",
  "run approach_correlated_double_E58_E61",
]

[[command_blocks]]
name = "remaining_after_e14_E58"
commands = [
  "run approach_correlated_e14_E58_E61",
  "run approach_correlated_double_E26_E31_E36_E48",
  "run approach_correlated_double_E58_E61",
]

[[command_blocks]]
name = "inspect_max_weights"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"
    '""",
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
  # Signed re+ and im+; componentwise-absolute im maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.22750835376631284 0.30800114013809143 0.90907327647965319 0.27524967632288022 0.70484613385720474 0.77914428735358621 0.25040035552279782 0.30614559621506898 0.78509992454223188 0.018138950044301660 0.078852106467154126 0.83039925865651831
      -d 0,0""",
  # Signed re- and componentwise-absolute re maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.16337390801738627 0.77898938145502339 0.94229833943902352 0.21695710371912719 0.15267503906076471 0.98556055955730881 0.12943138816639954 0.41452453930250843 0.72505742710372123 0.99160965851151095 0.67738349536015008 0.79425430138201447
      -d 0,5""",
  # Signed im- maximum.
  """inspect -p epem_a_tth -i NNLO
      -x 0.30319138749758057 0.99494863104787779 0.29163447489548411 0.030869252102754485 0.43560468843826539 0.64373059714175673 0.081386027411936235 0.88733893393096397 0.023469972013940299 0.19769964284908914 0.079545443190211667 0.37417485441637377
      -d 0,2""",
]

[[command_blocks]]
name = "integrate"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [integrator]
    n_start = 100
    n_increase = 0
    n_max = 10000000000
    seed = 1337

    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"

    [stability]
    escalate_if_exact_zero = false
    loop_momenta_norm_escalation_factor = -1.0
    rotation_axis = [{ type = "z" }]

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 1.0e99
    '""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration
      --restart""",
]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
generate_events = true
store_additional_weights_in_event = true
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
esurface_existence_threshold = 1.0e-7

[default_runtime_settings.integrator]
n_start = 100
n_increase = 0
n_max = 10000000000
seed = 1337

[default_runtime_settings.integrator.observables_output]
format = ["hwu", "json"]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
lmb_channel_weight = "ose"

[default_runtime_settings.stability]
escalate_if_exact_zero = false
loop_momenta_norm_escalation_factor = -1.0

[[default_runtime_settings.stability.rotation_axis]]
type = "z"

[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 1.0e-5
required_precision_for_im = 1.0e-5
escalate_for_large_weight_threshold = 1.0e99

[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = false
summed = false
summed_function_map = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[cli_settings.global.generation.uv]
softct = true
inner_products = true
generate_integrated = true
subtract_uv = true

[cli_settings.global.n_cores]
feyngen = 1
generate = 4
compile = 0
integrate = 3

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = false
