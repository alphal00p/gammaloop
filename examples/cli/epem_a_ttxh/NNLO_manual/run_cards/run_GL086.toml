[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086"
name = "NNLO_manual_GL086"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL086.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

# Mandatory remediation UV audit: every visible LMB subset and orientation.
# The fixed seed and scale range make baseline and final profiles comparable.
[[command_blocks]]
name = "uv_profile_baseline"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 8620260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086_baseline/uv_profiles/baseline_exp8_12_seed8620260809""",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 8620260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086/uv_profiles/final_exp8_12_seed8620260809""",
]

# In pristine generated LMB 0=(e2,e4,e6,e12), mask 8 is q12=K3,
# mask 14 is the K1/K2/K3 sector entering q13, and mask 15 is the complete
# four-loop scaling. Random rays replace the old incomplete exhaustive run.
[[command_blocks]]
name = "remediation_pristine_uv_random_masks8_14_15"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 8620260810
      --graph-index 0 --lmb-index 0 --loop-subset-mask 8 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086/trials/remediation/uv_random_g0_lmb0_mask8_n5_exp6_10_seed8620260810""",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 8620260811
      --graph-index 0 --lmb-index 0 --loop-subset-mask 14 --subset-cardinality 3
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086/trials/remediation/uv_random_g0_lmb0_mask14_n5_exp6_10_seed8620260811""",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 8620260812
      --graph-index 0 --lmb-index 0 --loop-subset-mask 15 --subset-cardinality 4
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL086/trials/remediation/uv_random_g0_lmb0_mask15_n5_exp6_10_seed8620260812""",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_approach_threshold_off"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

