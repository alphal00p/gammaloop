# At q12=0, q3=q11=K3 and q6=q14=K2.  Choosing both independent
# three-momenta with energy 250 GeV puts E72=(3,6,11,14) on shell.
[[command_blocks]]
name = "approach_star_E72_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 120.4743749123404,260.4743749123404,-110,60,-80,110,180.4743749123404,0,0,0,180.4743749123404,0
      --approach-axis 211,-157,193,0,0,0,0,0,0,0,0,0
      --axis-label 'e12 soft with starred E72=(3,6,11,14)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL293/approach_star_E72_e12.json""",
]

# At q13=0, q4=q14=K0 and q5=q11=K1.  The same 250 GeV
# construction independently probes E75=(4,5,11,14).
[[command_blocks]]
name = "approach_star_E75_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 180.4743749123404,0,0,0,180.4743749123404,0,60,-80,110,0,180.4743749123404,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e13 soft with starred E75=(4,5,11,14)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL293/approach_star_E75_e13.json""",
]

