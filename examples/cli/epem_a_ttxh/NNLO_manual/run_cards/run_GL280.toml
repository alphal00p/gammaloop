      --momentum-space --graph-id 0
      --point 37,126,-109,154.47692540288244,257.4615423381374,360.4461592733924,154.47692540288244,257.4615423381374,360.4461592733924,50.358894907105935,211.5073586098449,-90.64601083279068
      --approach-axis 0,0,0,13,-17,19,-23,29,31,0,0,0
      --axis-label 'e11 soft with common E33/E39/E43/E47 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e11_E33_E39_E43_E47.json""",
]

[[command_blocks]]
