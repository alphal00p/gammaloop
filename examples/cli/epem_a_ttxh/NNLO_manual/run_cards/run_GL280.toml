[cli_settings]
override_state = true

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280"
name = "NNLO_manual_GL280"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL280.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

# Diagnostic only: materialize resolved legacy defaults outside the active
# state so candidate subspaces can be derived from actual cut-compatible LMBs.
[[command_blocks]]
name = "save_autogenerated_dot"
commands = [
  "save dot ./examples/cli/epem_a_ttxh/NNLO_manual/states/GL280_autogenerated_diagnostic --include-autogenerated-fields",
]

# Fast structural triage for trial directives. This deliberately omits UV
# subtraction and cannot become the accepted campaign state.
[[command_blocks]]
name = "probe_structure_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "probe_key_limits_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_correlated_soft_e13_E29_E43_E47_E70",
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_correlated_soft_e11_E33_E39_E43_E47",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "probe_all_limits_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run all_required_approaches",
]

# Precision triage after a candidate edit: use the same complete graph sum but
# spend only on the two correlated geometries that are most cancellation-prone.
[[command_blocks]]
name = "probe_precision_geometries_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_correlated_soft_e11_E33_E39_E43_E47",
]

[[command_blocks]]
name = "probe_parent_resolution_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_soft_e13",
  "run approach_soft_e11",
  "run approach_collinear_e13_e14",
  "run approach_collinear_e13_e11",
  "run approach_correlated_soft_e13_E29_E43_E47_E70",
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_correlated_soft_e11_E33_E39_E43_E47",
  "run approach_correlated_soft_e11_E29_E70",
]

[[command_blocks]]
name = "probe_lmb_remap_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run display_lmb",
  "run approach_remap_collinear_e13_e14",
  "run approach_remap_collinear_e13_e11",
  "run approach_remap_correlated_soft_e13_E29_E43_E47_E70",
  "run approach_remap_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_remap_correlated_soft_e11_E33_E39_E43_E47",
]

[[command_blocks]]
name = "probe_partition_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run display_lmb",
  "run approach_collinear_e13_e14",
  "run approach_collinear_e13_e11",
  "run approach_correlated_soft_e13_E29_E43_E47_E70",
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_collinear_e14_e11",
]

[[command_blocks]]
name = "probe_acceptance_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run acceptance_approaches",
]

# Mandatory remediation UV audit: every visible LMB subset and orientation.
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile_final"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 28020260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_exp8_12_seed28020260809""",
]

# Adaptive precision/range fallbacks, used only when the baseline windows
# lose coverage, fit quality, or slope stability.
[[command_blocks]]
name = "uv_profile_final_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12 --use_f128
      --per-orientation --seed 28020260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_f128_exp8_12_seed28020260809""",
]

[[command_blocks]]
name = "uv_profile_final_low_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 6 --max-scaling 10 --use_f128
      --per-orientation --seed 28020260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_f128_exp6_10_seed28020260809""",
]

# Final seeded-random certification in the pristine generation LMB
# (e4,e5,e9,e13). The masks are exactly q11=K2-K1, q13=K3,
# q14=K1-K2-K3, and the overall four-loop support. Keep them split so a
# cancellation-limited series can be moved to a lower range independently.
[[command_blocks]]
name = "uv_profile_final_random_mask6_q11_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 28020260810
      --graph-index 0 --lmb-index 0 --loop-subset-mask 6 --subset-cardinality 2
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_random_g0_lmb0_mask6_q11_n5_exp6_10_seed28020260810""",
]

[[command_blocks]]
name = "uv_profile_final_random_mask8_q13_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 28020260811
      --graph-index 0 --lmb-index 0 --loop-subset-mask 8 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_random_g0_lmb0_mask8_q13_n5_exp6_10_seed28020260811""",
]

# Mask 8 fallback when the upper f64 point becomes an exact cancellation:
# move the same random ray down by two decades and force Arb precision.
[[command_blocks]]
name = "uv_profile_final_random_mask8_q13_n5_exp4_8_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 4 --max-scaling 8 --use_f128
      --per-orientation --seed 28020260811
      --graph-index 0 --lmb-index 0 --loop-subset-mask 8 --subset-cardinality 1
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_random_f128_g0_lmb0_mask8_q13_n5_exp4_8_seed28020260811""",
]

[[command_blocks]]
name = "uv_profile_final_random_mask14_q14_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 28020260812
      --graph-index 0 --lmb-index 0 --loop-subset-mask 14 --subset-cardinality 3
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_random_g0_lmb0_mask14_q14_n5_exp6_10_seed28020260812""",
]

[[command_blocks]]
name = "uv_profile_final_random_mask15_overall_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 28020260813
      --graph-index 0 --lmb-index 0 --loop-subset-mask 15 --subset-cardinality 4
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/uv_profiles/final_random_g0_lmb0_mask15_overall_n5_exp6_10_seed28020260813""",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_approach_threshold_off"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

# Spatial map: q13=K3, q14=K1-K2-K3, q11=-K1+K2, and
# q11+q13+q14=0.
[[command_blocks]]
name = "approach_soft_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,74,-52,137,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e13 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_soft_e13.json""",
]

