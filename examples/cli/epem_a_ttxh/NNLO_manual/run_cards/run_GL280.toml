[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280"
name = "NNLO_manual_GL280"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL280.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

# Spatial map: q13=K3, q14=K1-K2-K3, q11=-K1+K2, and
# q11+q13+q14=0.
[[command_blocks]]
name = "approach_soft_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,74,-52,137,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e14 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_soft_e13.json""",
]

# q14=K1-K2-K3 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-122,111,24,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'e13 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_soft_e14.json""",
]

# q11=-K1+K2 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e11"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'e11 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_soft_e11.json""",
]

# Since q11+q13+q14=0, any two soft gluons force the third soft. The two
# independent soft momenta approach along independent three-vectors.
[[command_blocks]]
name = "approach_double_soft"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'independent double soft (all e11 e13 e14 soft)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_double_soft.json""",
]

# Three nonzero collinear sectors at V_36. Only sectors supported by the
# process-valid cut metadata are required; all three are retained as cross-checks.
[[command_blocks]]
name = "approach_collinear_e13_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,-117,0,0,120
      --approach-axis 0,0,0,0,0,0,-47,-29,0,47,29,0
      --axis-label 'hard e13 e14 collinear (e11 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_collinear_e13_e14.json""",
]

[[command_blocks]]
name = "approach_collinear_e13_e11"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,163,0,0,120
      --approach-axis 0,0,0,0,0,0,0,0,0,47,29,0
      --axis-label 'hard e13 e11 collinear (e14 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_collinear_e13_e11.json""",
]

[[command_blocks]]
name = "approach_collinear_e14_e11"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,163,0,0,-200
      --approach-axis 0,0,0,0,0,0,47,29,0,0,0,0
      --axis-label 'hard e14 e11 collinear (e13 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_collinear_e14_e11.json""",
]

# At q13=0, q11=-q14. The four surfaces E29=(3,7,13,14),
# E43=(5,9,11), E47=(3,7,11), and E70=(5,9,13,14) coalesce.
# With K1=0, their common eta vanishes at |K2|=395.4050785973398.
[[command_blocks]]
name = "approach_correlated_soft_e13_E29_E43_E47_E70"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,0,0,0,0,0,395.4050785973398,0,0,0
      --approach-axis 0,0,0,0,0,0,3,5,-7,47,29,-31
      --axis-label 'e13 soft with common E29/E43/E47/E70 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e13_E29_E43_E47_E70.json""",
]

# At q14=0, q11=-q13 and the same four surfaces coalesce.
[[command_blocks]]
name = "approach_correlated_soft_e14_E29_E43_E47_E70"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,395.4050785973398,0,0,-395.4050785973398
      --approach-axis 0,0,0,3,5,-7,0,0,0,47,29,-31
      --axis-label 'e14 soft with common E29/E43/E47/E70 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e14_E29_E43_E47_E70.json""",
]

# At q11=0, E33=(5,7), E39=(3,9), E43, and E47 reduce to the
# common two-top surface. K3 remains generic and hard.
[[command_blocks]]
name = "approach_correlated_soft_e11_E33_E39_E43_E47"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,31,-47,59
      --approach-axis 0,0,0,3,5,-7,47,29,-31,0,0,0
      --axis-label 'e11 soft with common E33/E39/E43/E47 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e11_E33_E39_E43_E47.json""",
]

[[command_blocks]]
name = "approach_correlated_soft_e11_E33_E39_E43_E47_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,31,-47,59
      --approach-axis 0,0,0,3,5,-7,47,29,-31,0,0,0
      --axis-label 'e11 soft common E33/E39/E43/E47 threshold Arb adjudicator' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e11_E33_E39_E43_E47_arb.json""",
]

# A second q11-soft intersection isolates the E29/E70 pair while the
# two-edge and q11-containing surfaces remain away from threshold.
[[command_blocks]]
name = "approach_correlated_soft_e11_E29_E70"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,0,0,0,327
      --approach-axis 0,0,0,3,5,-7,47,29,-31,0,0,0
      --axis-label 'e11 soft with common E29/E70 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e11_E29_E70.json""",
]

# At the rank-six all-gluon soft locus, all six active surfaces reduce to
# the common two-top threshold at |K1|=|K2|=sqrt(500^2-MT^2).
[[command_blocks]]
name = "approach_correlated_double_soft_all_thresholds"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'double soft with common E29/E33/E39/E43/E47/E70 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_double_soft_all_thresholds.json""",
]

# Precision adjudicators are kept as explicit card commands so the exact
# complete-orientation paths can be reproduced when f64 cancellation is poor.
[[command_blocks]]
name = "approach_soft_e13_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,74,-52,137,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e13 soft Arb precision adjudicator' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_soft_e13_arb.json""",
]

[[command_blocks]]
name = "approach_collinear_e13_e14_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,-91,64,-117,0,0,120
      --approach-axis 0,0,0,0,0,0,-47,-29,0,47,29,0
      --axis-label 'hard e13 e14 collinear Arb precision adjudicator' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_collinear_e13_e14_arb.json""",
]

[[command_blocks]]
name = "correlated_approaches"
commands = [
  "run approach_correlated_soft_e13_E29_E43_E47_E70",
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_correlated_soft_e11_E33_E39_E43_E47",
  "run approach_correlated_soft_e11_E29_E70",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "remaining_correlated_approaches"
commands = [
  "run approach_correlated_soft_e14_E29_E43_E47_E70",
  "run approach_correlated_soft_e11_E29_E70",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run approach_soft_e13",
  "run approach_soft_e14",
  "run approach_soft_e11",
  "run approach_double_soft",
  "run approach_collinear_e13_e14",
  "run approach_collinear_e13_e11",
  "run approach_collinear_e14_e11",
]

[[command_blocks]]
name = "all_required_approaches"
commands = [
  "run all_approaches",
  "run correlated_approaches",
]

[[command_blocks]]
name = "integrate"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [integrator]
    n_start = 100
    n_increase = 0
    n_max = 10000000000
    seed = 1337

    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"

    [stability]
    escalate_if_exact_zero = false
    loop_momenta_norm_escalation_factor = -1.0
    rotation_axis = [{ type = "z" }]

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 1.0e99
    '""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration
      --restart""",
]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
generate_events = true
store_additional_weights_in_event = true
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
esurface_existence_threshold = 1.0e-7

[default_runtime_settings.integrator]
n_start = 100
n_increase = 0
n_max = 10000000000
seed = 1337

[default_runtime_settings.integrator.observables_output]
format = ["hwu", "json"]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
lmb_channel_weight = "ose"

[default_runtime_settings.stability]
escalate_if_exact_zero = false
loop_momenta_norm_escalation_factor = -1.0

[[default_runtime_settings.stability.rotation_axis]]
type = "z"

[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 1.0e-5
required_precision_for_im = 1.0e-5
escalate_for_large_weight_threshold = 1.0e99

[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = false
summed = false
summed_function_map = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[cli_settings.global.generation.uv]
softct = true
inner_products = true
generate_integrated = true
subtract_uv = true

[cli_settings.global.n_cores]
feyngen = 1
generate = 4
compile = 0
integrate = 3

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = false
