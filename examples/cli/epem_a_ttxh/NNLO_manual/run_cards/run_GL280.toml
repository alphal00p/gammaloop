      --approach-axis 0,0,0,0,0,0,3,5,-7,47,29,-31
      --axis-label 'e13 soft with common E29/E43/E47/E70 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL280/approach_correlated_soft_e13_E29_E43_E47_E70.json""",
]

[[command_blocks]]
name = "approach_correlated_soft_e13_E29_E43_E47_E70_arb"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,98.80480725802502,61.75300453626564,148.20721088703755,-123.50600907253128,37.05180272175939,370.51802721759384,0,0,0
      --approach-axis 0,0,0,0,0,0,3,5,-7,47,29,-31
      --axis-label 'e13 soft with common E29/E43/E47/E70 threshold Arb adjudicator' --parameter-name lambda
