# In LMB 0=(4,5,11,12), q13=K2-K1. Split the two single-coordinate
# limits and their joint scaling into independent five-point batches so every
# completed batch serializes before broader UV work is considered.
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile_final_g0_lmb0_mask2_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 29020260809
      --uv-ray-directions 37,126,-109,3,5,-7,-11,13,17,47,29,-31
      --uv-ray-norms 1000,1100,1300,1700
      --graph-index 0 --lmb-index 0 --loop-subset-mask 2 --subset-cardinality 1
