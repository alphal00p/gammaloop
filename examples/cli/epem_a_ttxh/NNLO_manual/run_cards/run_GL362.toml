[cli_settings]
override_state = true

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL362"
name = "NNLO_manual_GL362"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL362.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

# Structural-only parent probe after the mandatory UV-bearing generation attempts.
# This does not produce an acceptable campaign state or numerical result.
[[command_blocks]]
name = "probe_threshold_structure"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation orientation cuts --show-threshold-functions",
]

# Numerical threshold-structure probe only: UV subtraction is absent, so these
# results cannot replace the mandatory UV-bearing state or its final regressions.
[[command_blocks]]
name = "probe_projected_approaches_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run all_approaches",
  "run approach_corr_e13_E7_E51_E61_threshold_off",
  "run threshold_only_approaches",
]

[[command_blocks]]
name = "probe_projected_arb_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_corr_e13_E7_E51_E61_arb",
]

[[command_blocks]]
name = "probe_threshold_only_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run threshold_only_approaches",
]

# Candidate triage: the known-bad q13 threshold overlap is checked first, then
# the e12/E8-E21 regression gate, before spending time on the complete suite.
[[command_blocks]]
name = "probe_candidate_quick_no_uv"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false global.generation.uv.subtract_uv=false",
  "generate existing -p epem_a_tth -i NNLO",
  "run approach_corr_e13_E7_E51_E61",
  "run approach_corr_e12_E8_E21",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

# Mandatory remediation UV audit: every visible LMB subset and orientation.
# The fixed seed and scale range make the JSON directly reproducible.
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "uv_profile"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 8 --max-scaling 12
      --per-orientation --seed 36220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL362/uv_profiles/base_exp8_12_seed36220260809""",
]

# Adaptive fallbacks, run only if the baseline tail is incomplete, adverse, or
# fails the overlapping-window drift gate.
[[command_blocks]]
name = "uv_profile_high_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 10 --max-scaling 14 --use_f128
      --per-orientation --seed 36220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL362/uv_profiles/high_f128_exp10_14_seed36220260809""",
]

[[command_blocks]]
name = "uv_profile_low_f128"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 33 --min-scaling 6 --max-scaling 10 --use_f128
      --per-orientation --seed 36220260809
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL362/uv_profiles/low_f128_exp6_10_seed36220260809""",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_approach_threshold_off"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

