      --momentum-space --graph-id 0
      --point 91,64,83,-91,64,83,31,-47,59,213,-47,59
      --approach-axis 211,-157,193,0,0,0,0,0,0,0,0,0
      --axis-label 'e12 soft (q12=K1+K3-K0-K2)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL362/approach_soft_e12.json""",
