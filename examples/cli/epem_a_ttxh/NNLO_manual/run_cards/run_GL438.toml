[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438"
name = "NNLO_manual_GL438"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL438.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

# q12=K3.
[[command_blocks]]
name = "approach_soft_e12"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,74,-52,137,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'e12 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_soft_e12.json""",
]

# q13=K1-K2-K3 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-122,111,24,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'e13 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_soft_e13.json""",
]

# q14=-K1+K2 in spatial momentum.
[[command_blocks]]
name = "approach_soft_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'e14 soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_soft_e14.json""",
]

# Since q12+q13+q14=0, any two soft gluons force the third soft. The two
# independent soft momenta approach along independent three-vectors.
[[command_blocks]]
name = "approach_double_soft"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,83,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'independent double soft (all e12 e13 e14 soft)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_double_soft.json""",
]

# Hard nonzero collinear sectors at V_36. In each path only the two independent
# relative transverse components vanish; the third gluon carries the recoil.
[[command_blocks]]
name = "approach_collinear_e12_e13"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,-117,0,0,120
      --approach-axis 0,0,0,0,0,0,-47,-29,0,47,29,0
      --axis-label 'hard e12 e13 collinear (e14 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_collinear_e12_e13.json""",
]

[[command_blocks]]
name = "approach_collinear_e12_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,163,0,0,120
      --approach-axis 0,0,0,0,0,0,0,0,0,47,29,0
      --axis-label 'hard e12 e14 collinear (e13 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_collinear_e12_e14.json""",
]

[[command_blocks]]
name = "approach_collinear_e13_e14"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,-91,64,163,0,0,-200
      --approach-axis 0,0,0,0,0,0,47,29,0,0,0,0
      --axis-label 'hard e13 e14 collinear (e12 opposite)' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_collinear_e13_e14.json""",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run base_ir_approaches",
  "run correlated_ir_approaches",
]

[[command_blocks]]
name = "integrate"
commands = [
  """set process -p epem_a_tth -i NNLO string '
    [integrator]
    n_start = 100
    n_increase = 0
    n_max = 10000000000
    seed = 1337

    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channels = "monte_carlo"
    lmb_channel_weight = "ose"

    [stability]
    escalate_if_exact_zero = false
    loop_momenta_norm_escalation_factor = -1.0
    rotation_axis = [{ type = "z" }]

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 1.0e99
    '""",
  """integrate -p epem_a_tth -i NNLO --n-cores 3
      --renderer tabled --batch-size 10 --show-phase both
      --show-max-weight-info --show-top-discrete-grid
      --show-discrete-contributions-sum --write-results-for-each-iteration
      --restart""",
]

[[command_blocks]]
name = "base_ir_approaches"
commands = [
  "run approach_soft_e12",
  "run approach_soft_e13",
  "run approach_soft_e14",
  "run approach_double_soft",
  "run approach_collinear_e12_e13",
  "run approach_collinear_e12_e14",
  "run approach_collinear_e13_e14",
]

# q12=0 makes e11 and e7/e8 carry the same spatial momentum, so E28=(7,8)
# and E40=(8,11,12) meet on the two-top threshold.
[[command_blocks]]
name = "approach_correlated_soft_e12_E28_E40"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,0,0,469.11725613113,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,47,211,-157,193
      --axis-label 'e12 soft with common E28/E40 two-top threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e12_E28_E40.json""",
]

# The second q12-soft root simultaneously joins E27/E39/E43/E45 and E22/E51.
[[command_blocks]]
name = "approach_correlated_soft_e12_bridges"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,395.4050785973398,0,0,0
      --approach-axis 0,0,0,0,0,0,3,5,-7,47,29,-31
      --axis-label 'e12 soft with E27/E39/E43/E45 and E22/E51 thresholds' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e12_bridges.json""",
]

# q13=0 gives q14=-q12 and e11=K1. Three threshold pairs meet at the
# common m+sqrt(m^2+x^2)+x=Ecm root.
[[command_blocks]]
name = "approach_correlated_soft_e13_bridges"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,395.4050785973398,0,0,0,0,0,395.4050785973398
      --approach-axis 0,0,0,47,29,-31,0,0,0,3,5,-7
      --axis-label 'e13 soft with E54/E40, E27/E45, and E22/E51 thresholds' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e13_bridges.json""",
]

# q14=0 has three distinct threshold-energy regions.
[[command_blocks]]
name = "approach_correlated_soft_e14_two_top"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,31,-47,59
      --approach-axis 0,0,0,0,0,0,47,29,-31,0,0,0
      --axis-label 'e14 soft with common E27/E28/E51 two-top threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e14_two_top.json""",
]

[[command_blocks]]
name = "approach_correlated_soft_e14_E39_E40_E43_E54"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,0,0,0,395.4050785973398
      --approach-axis 0,0,0,0,0,0,47,29,-31,3,5,-7
      --axis-label 'e14 soft with common E39/E40/E43/E54 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e14_E39_E40_E43_E54.json""",
]

[[command_blocks]]
name = "approach_correlated_soft_e14_E22_E45"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,0,0,0,0,0,0,327
      --approach-axis 0,0,0,0,0,0,47,29,-31,3,5,-7
      --axis-label 'e14 soft with common E22/E45 threshold' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_soft_e14_E22_E45.json""",
]

[[command_blocks]]
name = "approach_correlated_double_soft_all_thresholds"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,0,0,469.11725613113,0,0,469.11725613113,0,0,0
      --approach-axis 0,0,0,0,0,0,98,-86,342,211,-157,193
      --axis-label 'double soft with all active thresholds coalescing' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL438/approach_correlated_double_soft_all_thresholds.json""",
]

[[command_blocks]]
name = "correlated_ir_approaches"
commands = [
  "run approach_correlated_soft_e12_E28_E40",
  "run approach_correlated_soft_e12_bridges",
  "run approach_correlated_soft_e13_bridges",
  "run approach_correlated_soft_e14_two_top",
  "run approach_correlated_soft_e14_E39_E40_E43_E54",
  "run approach_correlated_soft_e14_E22_E45",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "remaining_correlated_ir_approaches"
commands = [
  "run approach_correlated_soft_e13_bridges",
  "run approach_correlated_soft_e14_two_top",
  "run approach_correlated_soft_e14_E39_E40_E43_E54",
  "run approach_correlated_soft_e14_E22_E45",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "q14_and_double_correlated_approaches"
commands = [
  "run approach_correlated_soft_e14_two_top",
  "run approach_correlated_soft_e14_E39_E40_E43_E54",
  "run approach_correlated_soft_e14_E22_E45",
  "run approach_correlated_double_soft_all_thresholds",
]

[[command_blocks]]
name = "outer_and_double_correlated_approaches"
commands = [
  "run approach_correlated_soft_e14_E22_E45",
  "run approach_correlated_double_soft_all_thresholds",
]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
generate_events = true
store_additional_weights_in_event = true
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
esurface_existence_threshold = 1.0e-7

[default_runtime_settings.integrator]
n_start = 100
n_increase = 0
n_max = 10000000000
seed = 1337

[default_runtime_settings.integrator.observables_output]
format = ["hwu", "json"]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
lmb_channel_weight = "ose"

[default_runtime_settings.stability]
escalate_if_exact_zero = false
loop_momenta_norm_escalation_factor = -1.0

[[default_runtime_settings.stability.rotation_axis]]
type = "z"

[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 1.0e-5
required_precision_for_im = 1.0e-5
escalate_for_large_weight_threshold = 1.0e99

[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = false
summed = false
summed_function_map = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[cli_settings.global.generation.uv]
softct = true
inner_products = true
generate_integrated = true
subtract_uv = true

[cli_settings.global.n_cores]
feyngen = 1
generate = 4
compile = 0
integrate = 3

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = false
