[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL703"
name = "NNLO_manual_GL703"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL703.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run approach_soft_e9_e10",
  "run approach_soft_e12_e13",
  "run approach_double_soft_d_families",
  "run approach_soft_e7_e8_common",
  "run approach_soft_e7_e8_crosscheck",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

# K2 and K3 span the two cut-fermion soft constraints and the common internal
# gluon-soft constraint in LMB 0=(2,4,7,9).
[[command_blocks]]
name = "uv_profile_final_random_g0_lmb0_masks4_8_12_15_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 70320260809
      --graph-index 0 --lmb-index 0 --loop-subset-mask 4,8,12,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL703/uv_profiles/final_random_g0_lmb0_masks4_8_12_15_per_orientation_n5_exp6_10_seed70320260809""",
]

[[command_blocks]]
name = "approach_soft_e9_e10"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0
      --point=74,-52,137,-91,64,83,37,126,-109,0,0,0
      --approach-axis=0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'common e9 e10 soft locus' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL703/approach_soft_e9_e10.json""",
]

