# Repeat every accepted physical family in exact arithmetic so that a bounded
# plateau is not rejected solely by a low-R2 near-zero log-log fit.
[[command_blocks]]
name = "approach_soft_e9_e10_arb16"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point=74,-52,137,-91,64,83,37,126,-109,0,0,0
      --approach-axis=0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'common e9 e10 exact plateau' --parameter-name lambda
      --n-points 16 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL703/approaches/soft_e9_e10_arb16.json""",
]

