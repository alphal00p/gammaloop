# q14=K2-K1, q12=K3, q13=K1-K2-K3, and the overall limit are masks
# 6, 8, 14, and 15 in the pristine generation basis (2,4,6,12).
[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "remediation_uv_random_masks6_8_14_15"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10
      --per-orientation --seed 13220260810
      --graph-index 0 --lmb-index 0
      --loop-subset-mask 6,8,14,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL132/uv_profiles/remediation_random_g0_lmb0_masks6_8_14_15_n5_exp6_10_seed13220260810""",
]

