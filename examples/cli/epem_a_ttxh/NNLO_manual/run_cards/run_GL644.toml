      -x 0.30199293070450633 0.39312954491695024 0.84259541693936035 0.29257929846873310 0.31334846951067974 0.66900785577932353 0.14836645670235690 0.54860756795223764 0.81853897820508225 0.095359869454906349 0.51574220500996248 0.85804377020848532
      -d 0,0""",
