[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194"
name = "NNLO_manual_GL194"

[[command_blocks]]
name = "setup"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO_manual/graphs/GL194.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
]

[[command_blocks]]
name = "generate_full"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=true",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "generate_local_only"
commands = [
  "run setup",
  "set global kv global.generation.uv.generate_integrated=false",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[[command_blocks]]
name = "display_generation"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category generation",
]

[[command_blocks]]
name = "display_structure"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category orientation cuts --show-threshold-functions",
]

[[command_blocks]]
name = "display_lmb"
commands = [
  "display integrand --process epem_a_tth --integrand-name NNLO --category loop_momentum_basis cuts --show-threshold-functions",
]

[[command_blocks]]
name = "runtime_approach"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "runtime_threshold_off_diagnostic"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=true",
]

[[command_blocks]]
name = "runtime_uv_profile"
commands = [
  "set process -p epem_a_tth -i NNLO kv general.evaluator_method=SingleParametric general.generate_events=false general.store_additional_weights_in_event=false subtraction.disable_threshold_subtraction=false",
]

# In LMB 0=(2,4,7,9), K2 and K3 span every physical massless soft
# constraint. Profile each coordinate, their joint sector, and the overall UV
# limit on an independent seeded-random ray.
[[command_blocks]]
name = "uv_profile_final_random_g0_lmb0_masks4_8_12_15_n5_exp6_10"
commands = [
  "run runtime_uv_profile",
  """profile ultra-violet -p epem_a_tth -i NNLO
      --n-points 5 --min-scaling 6 --max-scaling 10 --per-orientation --seed 19420260809
      --graph-index 0 --lmb-index 0 --loop-subset-mask 4,8,12,15
      --output ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/uv_profiles/final_random_g0_lmb0_masks4_8_12_15_per_orientation_n5_exp6_10_seed19420260809""",
]

# q7=-q8=K2: both gluons share one independent soft momentum.
[[command_blocks]]
name = "approach_soft_K2_gluons"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,0,0,0,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'K2 soft: e7/e8 gluons' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approach_soft_K2_gluons.json""",
]

# q9/q10=K3: the first light-quark pair shares one soft momentum.
[[command_blocks]]
name = "approach_soft_K3_light"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,31,-47,59,0,0,0
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'K3 soft: e9/e10 light quarks' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approach_soft_K3_light.json""",
]

# q12/q13=K3-K2: the second light-quark pair has a third soft locus.
[[command_blocks]]
name = "approach_soft_K3mK2_light"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,31,-47,59,31,-47,59
      --approach-axis 0,0,0,0,0,0,0,0,0,211,-157,193
      --axis-label 'K3-K2 soft: e12/e13 light quarks' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approach_soft_K3mK2_light.json""",
]

# K2=K3=0 makes all three massless momentum families soft at rank six.
[[command_blocks]]
name = "approach_double_soft"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,0,0,0,0,0,0
      --approach-axis 0,0,0,0,0,0,211,-157,193,98,-86,342
      --axis-label 'rank-six K2/K3 double soft' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approach_double_soft.json""",
]

# Conservative non-V36 check: all massless legs at each V74 are hard and
# collinear; only the two transverse components are constrained.
[[command_blocks]]
name = "approach_collinear_V74"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO
      --momentum-space --graph-id 0
      --point 37,126,-109,-91,64,83,0,0,120,0,0,300
      --approach-axis 0,0,0,0,0,0,0,0,0,47,29,0
      --axis-label 'hard V74 q-qbar-g collinear sector' --parameter-name lambda
      --n-points 50 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approach_collinear_V74.json""",
]

[[command_blocks]]
name = "all_approaches"
commands = [
  "run approach_soft_K2_gluons",
  "run approach_soft_K3_light",
  "run approach_soft_K3mK2_light",
  "run approach_double_soft",
  "run approach_collinear_V74",
]

# Exact repeats distinguish bounded plateaus from low-R2 fits in every
# independent physical constraint family.
[[command_blocks]]
name = "approach_soft_K2_gluons_arb16"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,0,0,0,31,-47,59
      --approach-axis 0,0,0,0,0,0,211,-157,193,0,0,0
      --axis-label 'K2 gluons exact plateau' --parameter-name lambda
      --n-points 16 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 3
      --output-results ./examples/cli/epem_a_ttxh/NNLO_manual/states/state_GL194/approaches/soft_K2_gluons_arb16.json""",
]

