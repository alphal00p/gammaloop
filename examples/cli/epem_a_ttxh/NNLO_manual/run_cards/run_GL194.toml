[[command_blocks]]
name = "remediation_arb_plateaus"
commands = [
  "run approach_soft_K2_gluons_arb16",
  "run approach_soft_K3_light_arb16",
  "run approach_soft_K3mK2_light_arb16",
  "run approach_double_soft_arb16",
  "run approach_collinear_V74_arb16",
