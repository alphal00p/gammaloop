[[command_blocks]]
name = "approach_double_soft_arb16"
commands = [
  "run runtime_approach",
  """approach -p epem_a_tth -i NNLO --momentum-space --graph-id 0 --use_arb_prec
      --point 37,126,-109,-91,64,83,0,0,0,0,0,0
      --approach-axis 0,0,0,0,0,0,211,-157,193,98,-86,342
