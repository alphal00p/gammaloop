[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO/gammaloop_state_GL638"
name = "epem_a_ttxh_NNLO_test_GL638"

[[command_blocks]]
name = "generate_diagrams"
commands = [
  "import model sm-default.json",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/graphs/GL638.dot --process-spec 'e+ e- > t t~ h | e+ e- g t t~ h d d~ ghG ghG~ a QCD^2==4 QED^2==6 [{{4}} QCD=2]' -p epem_a_tth -i NNLO -o",
  "save dot",
]

[[command_blocks]]
name = "generate_integrands"
commands = [
  "set global kv global.n_cores.generate=10",
  "generate existing -p epem_a_tth -i NNLO",
  "save state -o",
]

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
  [500.0, 0.0, 0.0, 500.0],
  [500.0, 0.0, 0.0, -500.0],
]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
debug_cache = false
generate_events = false
store_additional_weights_in_event = false
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188

[default_runtime_settings.integrator.observables_output]
format = ["hwu", "json"]

[cli_settings.global.generation.orientation_pattern]
pat = "(+,+,+,+,-,-,-,+,-,0,+,0,+,-,+)"

[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = false
summed = false
summed_function_map = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[default_runtime_settings.subtraction]
esurface_existence_threshold = 1.0e-7
disable_threshold_subtraction = false

[cli_settings.global.generation.compile]
compilation_mode = "assembly"
optimization_level = "O3"
fast_math = true
unsafe_math = true
custom = []

[cli_settings.global.generation.uv]
softct = false
inner_products = true
generate_integrated = true
subtract_uv = true

[cli_settings.global.n_cores]
feyngen = 10
generate = 10
compile = 10
integrate = 10

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = false

[[default_runtime_settings.stability.rotation_axis]]
type = "z"

[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 0.0000000001
required_precision_for_im = 0.0000000001
escalate_for_large_weight_threshold = 0.9

[[default_runtime_settings.stability.levels]]
precision = "Quad"
required_precision_for_re = 0.00001
required_precision_for_im = 0.00001
escalate_for_large_weight_threshold = -1.0

[[default_runtime_settings.stability.levels]]
precision = "Arb"
required_precision_for_re = 0.00001
required_precision_for_im = 0.00001
escalate_for_large_weight_threshold = -1.0

[[command_blocks]]
name = "integrate"
commands = [
  "run set_model_parameters",
  "set process -p epem_a_tth kv integrator.discrete_dim_learning_rate=0.0",
  "set process -p epem_a_tth kv integrator.continuous_dim_learning_rate=0.25",
  "set process -p epem_a_tth kv integrator.n_bins=16",
  """set process -p epem_a_tth string '
    [sampling]
    graphs = "monte_carlo"
    orientations = "summed"
    lmb_multichanneling = true
    lmb_channel_weight = "ose"
    lmb_channels = "summed"
    '""",
  """set process -p epem_a_tth string '
    [h_function]
    function = "poly_exponential"
    sigma = 1.0
    power = 3
    '""",
  """set process -p epem_a_tth string '
    [[stability.rotation_axis]]
    type = "x"
    [[stability.rotation_axis]]
    type = "y"

    [[stability.levels]]
    precision = "Double"
    required_precision_for_re = 1.0e-5
    required_precision_for_im = 1.0e-5
    escalate_for_large_weight_threshold = 0.99

    [[stability.levels]]
    precision = "Quad"
    required_precision_for_re = 1.0e-8
    required_precision_for_im = 1.0e-8
    escalate_for_large_weight_threshold = -1.0
    '""",
  "remove processes -p epem_a_tth -i NNLO_m_uv_up",
  "duplicate integrand -p epem_a_tth -i NNLO --output_process_name epem_a_tth --output_integrand_name NNLO_m_uv_up",
  """set process -p epem_a_tth -i NNLO kv
    integrator.n_increase=0
    integrator.n_start=100000
    integrator.n_max=10000000000
    integrator.seed=1337
    general.m_uv=91.188
    """,
  "set process -p epem_a_tth -i NNLO_m_uv_up kv general.m_uv=1459.008",
  """integrate -p epem_a_tth -i NNLO -p epem_a_tth -i NNLO_m_uv_up --n-cores 3
    --renderer ratatui
    --batch-size 1000
    --show-phase both
    --show-max-weight-info
    --show-top-discrete-grid
    --show-discrete-contributions-sum
    --write-results-for-each-iteration
    --restart
    """,
]

[[command_blocks]]
name = "set_model_parameters"
commands = [
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]
