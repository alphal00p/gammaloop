[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO/analyses/gl638_multiplier_components/gammaloop_state"
name = "gl638_multiplier_components"

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/graphs/GL638.dot -p epem_a_tth -i GL638_ir_safe -o",
  "generate existing -p epem_a_tth -i GL638_ir_safe",
  "save state -o",
]

[[command_blocks]]
name = "inspect_full_cut_samples"
commands = [
  "run runtime_events",
  "inspect -p epem_a_tth -i GL638_ir_safe -x 0.120 0.421 0.722 0.292 0.593 0.163 0.464 0.765 0.335 0.636 0.206 0.507",
  "inspect -p epem_a_tth -i GL638_ir_safe -x 0.335 0.636 0.206 0.507 0.808 0.378 0.679 0.249 0.550 0.120 0.421 0.722",
]

[[command_blocks]]
name = "approach_safe"
commands = [
  "run runtime_events",
  "approach -p epem_a_tth -i GL638_ir_safe --momentum-space --graph-id 0 --orientation-id 0 -x 31 -47 83 -59 101 -73 127 41 -109 67 -89 53 --approach-axis 0.03,-0.02,0.01,-0.01,0.04,0.02,0.02,0.01,-0.03,-0.04,0.02,0.01 --n-points 5 --logarithmic --min-abs-t 0.001 --n-cores 1 --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl638_multiplier_components/component_approach.json",
]

# This path reaches q13=0 and both right-side threshold surfaces of cut
# (2,4,12) at t=0.  With lambda=10^-2 t, K0=K*+lambda*a and
# K3=K*+lambda*(a+d), so q13=-lambda*d while eta(eset(5,10)) and
# eta(eset(5,12,13))
# both vanish linearly.  The midpoint is excluded because it is singular.
[[command_blocks]]
name = "approach_q13_correlated"
commands = [
  "run runtime_events",
  "approach -p epem_a_tth -i GL638_ir_safe --momentum-space --graph-id 0 --orientation-id 0 -x 108.257828337953 -144.343771117271 433.031313351812 -59 101 -73 127 41 -109 108.257828337953 -144.343771117271 433.031313351812 --approach-axis 0.47,0.29,-0.31,0,0,0,0,0,0,2.58,-1.28,1.62 --n-points 7 --logarithmic --min-abs-t 0.0001 --skip-midpoint --n-cores 1 --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl638_multiplier_components/q13_correlated.json",
]

[[command_blocks]]
name = "runtime_events"
commands = [
  "set process -p epem_a_tth -i GL638_ir_safe kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true",
]

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
generate_events = true
store_additional_weights_in_event = true

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
esurface_existence_threshold = 1.0e-7

[cli_settings.global.generation]
force_cuts = [
  ["e2", "e6", "e12", "e13"],
  ["e2", "e6", "e10"],
  ["e2", "e6", "e7", "e13", "e14"],
  ["e2", "e4", "e12"],
  ["e2", "e4", "e10", "e13"],
  ["e2", "e4", "e7", "e14"],
]

[cli_settings.global.generation.orientation_pattern]
pat = "(+,+,+,+,-,-,-,+,-,0,+,0,+,-,+)"

[cli_settings.global.generation.evaluator]
do_algebra = false
store_atom = true
compile = false
summed = false
summed_function_map = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[cli_settings.global.generation.uv]
softct = true
inner_products = true
generate_integrated = false
subtract_uv = true

[cli_settings.global.n_cores]
generate = 1
compile = 1
