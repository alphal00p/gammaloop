[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_correlated_soft_threshold/gammaloop_state"
name = "gl297_correlated_soft_threshold"

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_correlated_soft_threshold/GL297_legacy.dot -p epem_a_tth_legacy -i GL297_legacy -o",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/graphs/GL297.dot -p epem_a_tth_forced -i GL297_ir_safe -o",
  "generate existing -p epem_a_tth_legacy -i GL297_legacy",
  "generate existing -p epem_a_tth_forced -i GL297_ir_safe",
  "save state -o",
]

