[cli_settings]

[cli_settings.state]
folder = "./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/gammaloop_state"
name = "gl297_forced_subspace_cure"

[[command_blocks]]
name = "setup_model"
commands = [
  "import model sm-default.json",
  "set model MT=173.0",
  "set model MH=125.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[command_blocks]]
name = "generate"
commands = [
  "run setup_model",
  "remove processes",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/GL297_legacy.dot -p gl297_legacy -i GL297_legacy -o",
  "import graphs ./examples/cli/epem_a_ttxh/NNLO/graphs/GL297.dot -p gl297_forced -i GL297_forced -o",
  "generate existing -p gl297_legacy -i GL297_legacy",
  "generate existing -p gl297_forced -i GL297_forced",
  "save state -o",
]

[[command_blocks]]
name = "runtime_events"
commands = [
  "set process -p gl297_legacy -i GL297_legacy kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
  "set process -p gl297_forced -i GL297_forced kv general.evaluator_method=SingleParametric general.generate_events=true general.store_additional_weights_in_event=true subtraction.disable_threshold_subtraction=false",
]

[[command_blocks]]
name = "approach_e12"
commands = [
  "run runtime_events",
  "set process -p gl297_forced -i GL297_forced kv subtraction.disable_threshold_subtraction=true",
  """approach -p gl297_forced -i GL297_forced
      --momentum-space --graph-id 0 --orientation-id 0
      --point 236.257828337953,-82.3437711172707,241.031313351812,-91,64,83,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 258,-128,162,0,0,0,0,0,0,47,29,-31
      --axis-label 'e12 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e12_threshold_off.json""",
  """approach -p gl297_legacy -i GL297_legacy
      --momentum-space --graph-id 0 --orientation-id 0
      --point 236.257828337953,-82.3437711172707,241.031313351812,-91,64,83,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 258,-128,162,0,0,0,0,0,0,47,29,-31
      --axis-label 'e12 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e12_legacy.json""",
  "set process -p gl297_forced -i GL297_forced kv subtraction.disable_threshold_subtraction=false",
  """approach -p gl297_forced -i GL297_forced
      --momentum-space --graph-id 0 --orientation-id 0
      --point 236.257828337953,-82.3437711172707,241.031313351812,-91,64,83,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 258,-128,162,0,0,0,0,0,0,47,29,-31
      --axis-label 'e12 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e12_forced.json""",
]

[[command_blocks]]
name = "approach_e13"
commands = [
  "run runtime_events",
  "set process -p gl297_forced -i GL297_forced kv subtraction.disable_threshold_subtraction=true",
  """approach -p gl297_forced -i GL297_forced
      --momentum-space --graph-id 0 --orientation-id 0
      --point 110,-73,57,108.257828337953,-144.343771117271,433.031313351812,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 0,0,0,47,29,-31,0,0,0,258,-128,162
      --axis-label 'e13 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e13_threshold_off.json""",
  """approach -p gl297_legacy -i GL297_legacy
      --momentum-space --graph-id 0 --orientation-id 0
      --point 110,-73,57,108.257828337953,-144.343771117271,433.031313351812,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 0,0,0,47,29,-31,0,0,0,258,-128,162
      --axis-label 'e13 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e13_legacy.json""",
  "set process -p gl297_forced -i GL297_forced kv subtraction.disable_threshold_subtraction=false",
  """approach -p gl297_forced -i GL297_forced
      --momentum-space --graph-id 0 --orientation-id 0
      --point 110,-73,57,108.257828337953,-144.343771117271,433.031313351812,37,126,-109,108.257828337953,-144.343771117271,433.031313351812
      --approach-axis 0,0,0,47,29,-31,0,0,0,258,-128,162
      --axis-label 'e13 correlated soft + threshold'
      --parameter-name lambda
      --n-points 7 --logarithmic --min-abs-t 1e-6 --max-abs-t 1e-2
      --skip-midpoint --n-cores 1
      --output-results ./examples/cli/epem_a_ttxh/NNLO/analyses/gl297_forced_subspace_cure/e13_forced.json""",
]

[[command_blocks]]
name = "all"
commands = ["run generate", "run approach_e12", "run approach_e13"]

[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
generate_events = true
store_additional_weights_in_event = true

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
esurface_existence_threshold = 1.0e-7

[cli_settings.global.generation]
force_cuts = [
  ["e2", "e11", "e14"],
  ["e2", "e9", "e12", "e14"],
  ["e2", "e7", "e13", "e14"],
  ["e2", "e6", "e11", "e13"],
  ["e2", "e6", "e9", "e12", "e13"],
  ["e2", "e6", "e7"],
  ["e2", "e4", "e11", "e12"],
  ["e2", "e4", "e9"],
  ["e2", "e4", "e7", "e12", "e13"],
]

[cli_settings.global.generation.orientation_pattern]
pat = "(+,+,-,+,+,+,+,-,0,-,0,-,-,+,+)"

[cli_settings.global.generation.evaluator]
do_algebra = false
store_atom = true
compile = false
summed = false
summed_function_map = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[cli_settings.global.generation.uv]
softct = true
inner_products = true
generate_integrated = true
subtract_uv = true

[cli_settings.global.n_cores]
generate = 4
compile = 4
integrate = 1
