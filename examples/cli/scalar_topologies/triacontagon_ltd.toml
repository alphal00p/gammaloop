# https://arxiv.org/pdf/1906.06138, Eq. (1), Table I and Appendix B.1.
# Unit scalar numerator: integral d^4k/(2pi)^4 product_i 1/(q_i^2-m_i^2+i0).
# Published reference: +i * 0.358640 (original MadLoop value: 0.35864077119483945).
# No UV or E-surface subtraction is needed.
# The arXiv appendix misprints p_1z=p_2z=2.5, violating momentum conservation
# by 0.5 GeV. The authors' original Tringigon_P1_no_ellipse fixture has 2.25:
# https://github.com/alphal00p/alphaloop/blob/d20cb27786aaff58fa4dc8e413ff02d10dbcc72d/LTD/manually_crafted_topologies.py#L3002
# Use its full-precision external data below.
# Run from the repository root:
#   gammaloop examples/cli/scalar_topologies/triacontagon_ltd.toml run generate integrate
commands = []

[cli_settings.state]
folder = "./examples/cli/scalar_topologies/gammaloop_state/triacontagon_ltd"
name = "triacontagon_ltd"

[[command_blocks]]
name = "generate"
commands = [
    "import model scalars-default.json",
    "remove processes",
    "import graphs examples/cli/scalar_topologies/triacontagon_ltd.dot -p triacontagon -i scalar",
    "generate existing -p triacontagon -i scalar",
    "save state -o",
]

[[command_blocks]]
name = "integrate"
commands = [
    "integrate -p triacontagon -i scalar --n-cores 1 --restart",
]

[cli_settings.global.generation]
"three_dimensional_representations" = ["ltd"]

[cli_settings.global.generation.evaluator]
compile = false
store_atom = true
summed = false
summed_function_map = true
iterative_orientation_optimization = false

[cli_settings.global.generation.uv]
local_uv_cts_from_expanded_4d_integrands = true
subtract_uv = false
generate_integrated = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
integral_unit = "none"
disable_flux_factor = true

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

# Center each channel on a propagator momentum. This resolves the narrow
# nearly-collinear peak without sampling the individual LTD residues.
[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
coordinate_system = "spherical"
mapping = "linear"
b = 0.02

# Dual H-surface cancellation becomes severe with many nearly collinear legs.
# Start in quad precision and retain an arbitrary-precision LTD rescue; rotating
# the complete sum detects precision loss without introducing a CFF evaluator.
[default_runtime_settings.stability]
rotation_axis = [{ type = "euler_angles", alpha = 0.1, beta = 0.2, gamma = 0.3 }]
levels = [
    { precision = "Quad", "three_dimensional_representation" = "ltd", required_precision_for_re = 1e-7, required_precision_for_im = 1e-7, escalate_for_large_weight_threshold = -1.0 },
    { precision = "Arb", "three_dimensional_representation" = "ltd", required_precision_for_re = 1e-7, required_precision_for_im = 1e-7, escalate_for_large_weight_threshold = -1.0 },
]

[default_runtime_settings.kinematics]
# Sampling scale; the spacelike benchmark momenta below define the kinematics.
e_cm = 5.0
[default_runtime_settings.kinematics.externals]
type = "constant"
[default_runtime_settings.kinematics.externals.data]
# Momenta p_1,...,p_29 from the original author fixture, in GeV, all incoming.
# Momentum conservation fixes p_30; this removes rounding in its printed value.
