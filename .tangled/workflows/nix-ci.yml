# Linux-only port of .github/workflows/nix.yml for Tangled spindle.
# Required pipeline secrets:
# - SYMBOLICA_LICENSE

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 1
  submodules: false

dependencies:
  nixpkgs:
    - bash
    - cacert
    - coreutils
    - findutils
    - gawk
    - git
    - gnugrep
    - gnused
    - nix
    - python3
    - just

environment:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

steps:
  - name: "Run Linux Nix CI"
    command: |
      set -euo pipefail
      CI_FLAKE_SOURCE=$(python3 scripts/tracked_source.py --print-source)
      export CI_FLAKE_SOURCE

      # Tangled runs these Nix builds without sandboxing, and stdenv expects the
      # fallback HOME path to be absent in that mode.
      rm -rf /homeless-shelter

      system="$(env -u SYMBOLICA_LICENSE -u SYMBOLICA_LICENSE_SIGNED nix eval --impure --raw --expr builtins.currentSystem)"

      just nix-build "checks.${system}.gammaloop-fmt" --print-build-logs
      just nix-build "checks.${system}.gammaloop-clippy" --print-build-logs
      just ci-runtime-check "$CI_FLAKE_SOURCE"
      just nix-run nix-ci-check-gammaloop-nextest
      just nix-run nix-ci-check-gammaloop-doctest
      just nix-build "checks.${system}.gammaloop-doc" --print-build-logs
      just nix-run nix-ci-check-alphal00p-docs
      just nix-build "packages.${system}.gammaloop-llvm-coverage" --print-build-logs
