name: Nix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HESTIA_CACHE_WRITABLE: true
  HESTIA_DRAIN_TIMEOUT: 7200
  # Bump this only for an intentional Hestia cache-format migration.
  HESTIA_CACHE_VERSION_SALT: gammaloop-no-closure-v1
  RUST_BACKTRACE: "1"

jobs:
  # Publish shared roots here so consumers wait on their manifest before
  # running in parallel.
  prepare:
    name: Prepare shared artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.filter-matrix.outputs.matrix }}
      any-jobs: ${{ steps.filter-matrix.outputs.any-jobs }}
      runtime-matrix: ${{ steps.runtime-matrix.outputs.matrix }}
      any-runtime-jobs: ${{ steps.runtime-matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the main test license
        if: github.ref == 'refs/heads/main'
        env:
          LICENSE: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}
        run: |
          if [ -z "$LICENSE" ]; then
            echo "::error::Main test coverage requires the Symbolica license secret"
            exit 1
          fi
      - uses: ./.github/actions/nix-ci-cache
        with:
          netrc: ${{ secrets.NIXCI_NETRC }}
      - name: Check producer disk budget
        shell: bash
        run: |
          set -euo pipefail
          df -h /nix/store "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          # The publication closure can approach 8 GiB; reserve another 4 GiB
          # before starting compiler work. Nix collects unrooted paths below
          # its 4 GiB watermark and runs only one derivation at a time.
          for path in /nix/store "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            available=$(df --output=avail -B1 "$path" | tail -n 1)
            if [ "$available" -lt $((12 * 1024 * 1024 * 1024)) ]; then
              echo "::error::Shared Nix artifacts require at least 12 GiB free on $path before building"
              exit 1
            fi
          done
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          drain-timeout: ${{ env.HESTIA_DRAIN_TIMEOUT }}
          no-closure: true
          upstream-cache-filter: true
      - name: Build and publish shared artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Avoid publishing every large intermediate Crane merge tree.
          test -z "$(nix --option post-build-hook "" config show post-build-hook)"
          # Keep all roots alive through publication and matrix evaluation,
          # including while the daemon collects unneeded build intermediates.
          producer_roots="$RUNNER_TEMP/nix-shared-artifacts"
          mkdir -p "$producer_roots"
          producer_output_lines=$(
            nix --option post-build-hook "" build \
              --keep-going \
              --out-link "$producer_roots/result" \
              --print-build-logs \
              --print-out-paths \
              .#packages.x86_64-linux.alphal00p-docs-cargo-artifacts \
              .#packages.x86_64-linux.crane-ci-prebuild \
              .#packages.x86_64-linux.gammaloop \
              .#packages.x86_64-linux.gammaloop-python-module \
              .#checks.x86_64-linux.gammaloop-nextest-binaries \
              .#packages.x86_64-linux.ci-runtime-environment \
              .#packages.x86_64-linux.cargoCheckArtifacts
          )
          mapfile -t producer_outputs <<< "$producer_output_lines"
          test "${#producer_outputs[@]}" -eq 7
          df -h /nix/store "$RUNNER_TEMP"
          publish_path_lines=$(
            nix-store --query --requisites "${producer_outputs[@]}" | LC_ALL=C sort -u
          )
          mapfile -t publish_paths <<< "$publish_path_lines"
          test "${#publish_paths[@]}" -gt 0
          # no-closure makes this explicit, compact path set the upload boundary.
          closure_bytes=$(nix path-info --json --recursive "${producer_outputs[@]}" |
            jq '[.[] | .narSize] | add')
          echo "Selected producer closure: $closure_bytes raw NAR bytes (${#publish_paths[@]} paths)"
          test "$closure_bytes" -lt $((8 * 1024 * 1024 * 1024))
          "$HESTIA_BIN" hook --socket "$HESTIA_SOCKET" "${publish_paths[@]}"
          "$HESTIA_BIN" drain \
            --socket "$HESTIA_SOCKET" \
            --timeout "$HESTIA_DRAIN_TIMEOUT"
          if [ "$HESTIA_CACHE_WRITABLE" = true ]; then
            # The hook is deliberately non-fatal, so verify its committed roots.
            for output in "${producer_outputs[@]}"; do
              store_hash=${output#/nix/store/}
              store_hash=${store_hash%%-*}
              curl -fsS "http://$HESTIA_LISTEN/$store_hash.narinfo" >/dev/null
            done
          fi
      # The composite matrix action treats a drain timeout as non-fatal. Keep
      # the producer barrier enforceable with the CLI's manifest-version output.
      - id: matrix
        name: Create Hestia matrix
        shell: bash
        run: |
          set -euo pipefail
          check_collection=hydraJobs.x86_64-linux
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            check_collection=hydraJobsMain.x86_64-linux
          fi
          "$HESTIA_BIN" matrix \
            --flake ".#$check_collection" \
            --socket "$HESTIA_SOCKET" \
            --nix-eval-jobs "nix run nixpkgs#nix-eval-jobs" \
            --attr-prefix "$check_collection" \
            --drain-timeout "$HESTIA_DRAIN_TIMEOUT"
      - id: filter-matrix
        name: Record pure build matrix
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "any-jobs=$(jq -r '.include | length > 0' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
      - id: runtime-matrix
        name: Select runtime jobs independently of cached outputs
        run: |
          set -euo pipefail
          selection=ci-runtime-jobs
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            selection=ci-runtime-jobs-main
          fi
          matrix_path=$(nix build --no-link --print-out-paths ".#$selection")
          matrix=$(cat "$matrix_path")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any-jobs=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"
      - name: Confirm producer manifest
        if: (steps.filter-matrix.outputs.any-jobs == 'true' || steps.runtime-matrix.outputs.any-jobs == 'true') && env.HESTIA_CACHE_WRITABLE == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.matrix.outputs.manifest-version }}
        run: test "$MANIFEST_VERSION" -gt 0
      - name: Record final disk use and release job resources
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nixci.netrc"
          df -h /nix/store "$RUNNER_TEMP" || true
          rm -rf "$RUNNER_TEMP/nix-shared-artifacts"

  build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: prepare
    if: needs.prepare.outputs.any-jobs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-ci-cache
        with:
          netrc: ${{ secrets.NIXCI_NETRC }}
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          drain-timeout: ${{ env.HESTIA_DRAIN_TIMEOUT }}
          no-closure: true
          upstream-cache-filter: true
          wait-manifest-version: ${{ needs.prepare.outputs.manifest-version }}
      - id: build-check
        name: Build checks
        env:
          CHECK_ATTR: ${{ matrix.attr }}
        run: |
          set -euo pipefail
          df -h /nix/store "$RUNNER_TEMP"
          result_dir=target/ci-results
          mkdir -p "$result_dir"
          printf 'check=%s\ncommit=%s\nrun=%s/%s/actions/runs/%s\nattempt=%s\n' \
            "$CHECK_ATTR" "$GITHUB_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$result_dir/provenance.txt"
          exec 3> >(tee "$result_dir/nix-build.log" >&2)
          log_pid=$!
          set +e
          nix build \
            --keep-going \
            --out-link "$RUNNER_TEMP/nix-check-result" \
            --print-build-logs \
            --print-out-paths \
            ".#$CHECK_ATTR" \
            > "$result_dir/output-paths.txt" 2>&3
          build_status=$?
          exec 3>&-
          wait "$log_pid"
          log_status=$?
          set -e
          printf 'build-exit-code=%s\n' "$build_status" >> "$result_dir/provenance.txt"
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi
          if [ "$log_status" -ne 0 ]; then
            exit "$log_status"
          fi
          exit 0
      - name: Record final disk use and release job resources
        if: always()
        shell: bash
        run: |
          trap 'rm -f "$RUNNER_TEMP/nixci.netrc"' EXIT
          # A worker's post-build hook can still have queued uploads. Drain
          # them while the completed checks remain protected from collection.
          if [ -n "${HESTIA_BIN:-}" ]; then
            "$HESTIA_BIN" drain --socket "$HESTIA_SOCKET" --timeout "$HESTIA_DRAIN_TIMEOUT"
          fi
          df -h /nix/store "$RUNNER_TEMP" || true
          rm -f "$RUNNER_TEMP"/nix-check-result*

  runtime:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: prepare
    if: needs.prepare.outputs.any-runtime-jobs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.runtime-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-ci-cache
        with:
          netrc: ${{ secrets.NIXCI_NETRC }}
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          drain-timeout: ${{ env.HESTIA_DRAIN_TIMEOUT }}
          no-closure: true
          upstream-cache-filter: true
          wait-manifest-version: ${{ needs.prepare.outputs.manifest-version }}
      - name: Prepare runtime launcher
        env:
          RUNNER_PACKAGE: ${{ matrix.package }}
        run: |
          nix build --out-link "$RUNNER_TEMP/runtime-launcher" ".#$RUNNER_PACKAGE"
      - id: execute
        name: Execute tests on every invocation
        env:
          RUNNER_PACKAGE: ${{ matrix.package }}
          CHECK_NAME: ${{ matrix.name }}
          SYMBOLICA_LICENSE_SIGNED: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}
        run: |
          set +x
          set -euo pipefail
          result_dir="$PWD/target/ci-results"
          mkdir -p "$result_dir"
          printf 'check=%s\ncommit=%s\nrun=%s/%s/actions/runs/%s\nattempt=%s\n' \
            "$CHECK_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$result_dir/provenance.txt"
          set +e
          "$RUNNER_TEMP/runtime-launcher/bin/$RUNNER_PACKAGE" --report-dir "$result_dir/reports"
          runtime_status=$?
          set -e
          printf 'runtime-exit-code=%s\n' "$runtime_status" >> "$result_dir/provenance.txt"
          shopt -s nullglob
          reports=("$result_dir/reports/"*.xml)
          export_status=0
          if [ "${#reports[@]}" -gt 0 ]; then
            python3 .github/scripts/export-test-timings.py \
              --check "$CHECK_NAME" --output "$result_dir/metrics.csv" \
              "${reports[@]}" || export_status=$?
          fi
          [ "$runtime_status" -eq 0 ] || exit "$runtime_status"
          exit "$export_status"
      - name: Upload test timing metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-runtime-metrics-${{ matrix.name }}-${{ matrix.system }}
          path: target/ci-results/metrics.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Drain producer uploads and release roots
        if: always()
        run: |
          trap 'rm -f "$RUNNER_TEMP/nixci.netrc"; rm -f "$RUNNER_TEMP/runtime-launcher"' EXIT
          "$HESTIA_BIN" drain --socket "$HESTIA_SOCKET" --timeout "$HESTIA_DRAIN_TIMEOUT"

  flake-checks:
    name: Flake checks
    needs: [prepare, build, runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm matrix result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          ANY_RUNTIME_JOBS: ${{ needs.prepare.outputs.any-runtime-jobs }}
          ANY_JOBS: ${{ needs.prepare.outputs.any-jobs }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$ANY_JOBS" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$ANY_JOBS" = false
            test "$BUILD_RESULT" = skipped
          fi
          if [ "$ANY_RUNTIME_JOBS" = true ]; then
            test "$RUNTIME_RESULT" = success
          else
            test "$ANY_RUNTIME_JOBS" = false
            test "$RUNTIME_RESULT" = skipped
          fi
