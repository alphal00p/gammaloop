name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      zenodo: ${{ steps.filter.outputs.zenodo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - 'justfile'
              - '.github/workflows/**'
            zenodo:
              - '.github/scripts/*zenodo*.py'
              - '.github/workflows/release.yml'
              - '.github/workflows/zenodo*.yml'
              - '.zenodo/**'
              - 'CITATION.cff'
              - 'crates/*/CITATION.cff'

  # Aggregate matrix and checks into one status for branch protection.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, test-matrix, checks, zenodo-tests]
    if: always()
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Tests failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  test-matrix:
    name: Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 100

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            form \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            just \
            libmpc-dev \
            python3 \
            python3-dev

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install pkg-config openssl@3 gmp mpfr libmpc just form

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest@0.9.140

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-${{ matrix.os }}

      - name: Verify external tools
        run: |
          command -v form
          form
          command -v python3
          python3 --version

      - name: Run tests
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        env:
          SYMBOLICA_LICENSE: >-
            ${{ github.event_name == 'push' && secrets.SYMBOLICA_LICENSE || 'GAMMALOOP_USER' }}
        run: just --unstable test-ci

      - name: Run tests
        if: startsWith(matrix.os, 'macos-')
        env:
          SYMBOLICA_LICENSE: >-
            ${{ github.event_name == 'push' && secrets.SYMBOLICA_LICENSE || 'GAMMALOOP_USER' }}
        run: just test-ci-mac

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  zenodo-tests:
    name: Zenodo release tests
    needs: [changes]
    if: needs.changes.outputs.zenodo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release metadata and scripts
        run: |
          python3 -m json.tool .zenodo/records.json > /dev/null
          python3 -m json.tool .zenodo/backfill.json > /dev/null
          python3 -m unittest discover \
            --start-directory .github/scripts \
            --pattern 'test_zenodo*.py' \
            --verbose

  checks-matrix:
    name: Checks (${{ matrix.check }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, fmt, doc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            python3 \
            just \
            python3-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.check != 'fmt'
        with:
          key: cargo-ubuntu-latest

      - name: Run clippy
        if: matrix.check == 'clippy'
        env:
          SYMBOLICA_LICENSE: >-
            ${{ github.event_name == 'push' && secrets.SYMBOLICA_LICENSE || 'GAMMALOOP_USER' }}
        run: just --unstable clippy -- -D warnings

      - name: Run fmt
        if: matrix.check == 'fmt'
        run: just --unstable fmt -- --check

      - name: Run doc
        if: matrix.check == 'doc'
        env:
          SYMBOLICA_LICENSE: >-
            ${{ github.event_name == 'push' && secrets.SYMBOLICA_LICENSE || 'GAMMALOOP_USER' }}
        run: just --unstable doc

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: [changes, checks-matrix]
    if: always()
    steps:
      - name: Checks successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Checks failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
