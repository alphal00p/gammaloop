name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
  push:
    branches:
      - main
      - feynkit
  merge_group:
env:
  CARGO_TERM_COLOR: always
  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      tydenso: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tydenso == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tydenso/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - '.config/**'
              - 'flake.nix'
              - 'nix-ci.nix'
              - 'nix/**'
              - 'justfile'
              - 'just/**'
              - '.github/scripts/**'
              - '.github/workflows/**'
            tydenso:
              - 'tydenso/**'
              - 'crates/idenso/**'
              - 'crates/linnet/**'
              - 'crates/spenso/**'
              - 'crates/spenso-macros/**'
              - 'crates/spynso3/**'
              - 'crates/symbolica-utils/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.github/workflows/**'

  tydenso:
    name: Tydenso Wasm and Typst
    needs: [changes]
    if: needs.changes.outputs.tydenso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact Symbolica Typst plugin revision
        uses: actions/checkout@v4
        with:
          repository: symbolica-dev/symbolica-typst-plugin
          ref: 18e0491628f9eac5c788659cabfcdb7575f6986d
          path: tymbolica-pinned

      - uses: NixOS/nix-installer-action@main

      - name: Install Binaryen 130
        run: |
          binaryen_dir="$RUNNER_TEMP/binaryen"
          mkdir -p "$binaryen_dir"
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz \
            --output "$binaryen_dir/archive.tar.gz"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  $binaryen_dir/archive.tar.gz" | sha256sum --check
          tar -xzf "$binaryen_dir/archive.tar.gz" -C "$binaryen_dir" --strip-components=1
          echo "$binaryen_dir/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tydenso -> target
          cache-directories: ${{ github.workspace }}/target/tymbolica
          key: tydenso-wasm

      - name: Build and validate Tydenso
        env:
          TYMBOLICA_CHECKOUT: ${{ github.workspace }}/tymbolica-pinned
          TYPST_IGNORE_SYSTEM_FONTS: 'true'
        run: |
          just --unstable check-symbolica-feature-isolation
          just --unstable tydenso::check

      - name: Run Tydenso payload-boundary tests
        run: |
          cargo test \
            --manifest-path tydenso/Cargo.toml \
            --package tydenso-plugin \
            --locked \
            -- \
            --test-threads=1

      - name: Verify Spynso packages its renderer
        run: |
          cargo package -p spynso3 --allow-dirty --list > /tmp/spynso-package-files
          grep -qx 'typst/notation.typ' /tmp/spynso-package-files
          grep -qx 'typst/render.typ' /tmp/spynso-package-files

  # Aggregate matrix and checks into one status for branch protection.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, test-matrix, checks, tydenso]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Tests failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  test-matrix:
    name: Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            form \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            just \
            libmpc-dev \
            python3 \
            python3-dev

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install pkg-config openssl@3 gmp mpfr libmpc just form

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ matrix.os }}

      - name: Set fallback Symbolica license
        run: |
          if [ -z "${SYMBOLICA_LICENSE:-}" ]; then
            echo "SYMBOLICA_LICENSE=GAMMALOOP_USER" >> "$GITHUB_ENV"
          fi

      - name: Verify external tools
        run: |
          command -v form
          form
          command -v python3
          python3 --version

      - name: Run tests
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        run: just --unstable test-ci

      - name: Run tests
        if: startsWith(matrix.os, 'macos-')
        run: just --unstable test-ci-mac

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci_gammaloop/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  checks-matrix:
    name: Checks (${{ matrix.check }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [boundaries, clippy, fmt, doc, stubs]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            python3 \
            just \
            python3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: matrix.check != 'fmt'
        with:
          key: cargo-ubuntu-latest

      - name: Run clippy
        if: matrix.check == 'clippy'
        run: just --unstable clippy -- -D warnings

      - name: Check FeynKit dependency boundaries
        if: matrix.check == 'boundaries'
        run: python3 .github/scripts/check-feynkit-boundaries.py

      - name: Run fmt
        if: matrix.check == 'fmt'
        run: just --unstable fmt -- --check

      - name: Run doc
        if: matrix.check == 'doc'
        run: just --unstable doc

      - name: Check FeynKit Python stubs
        if: matrix.check == 'stubs'
        run: |
          cargo run --locked -p feynkit-py --features python_stubgen --bin feynkit-stubgen
          test -z "$(git status --porcelain -- crates/feynkit-py/python/symbolica)"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: [changes, checks-matrix]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - name: Checks successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Checks failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
