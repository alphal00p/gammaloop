name: Continuous integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
  SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      tydenso: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tydenso == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tydenso/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - '.config/**'
              - 'flake.nix'
              - 'nix-ci.nix'
              - 'nix/**'
              - 'justfile'
              - 'just/**'
              - '.github/scripts/**'
              - '.github/workflows/**'
            tydenso:
              - 'tydenso/**'
              - 'crates/idenso/**'
              - 'crates/linnet/**'
              - 'crates/spenso/**'
              - 'crates/spenso-macros/**'
              - 'crates/spynso3/**'
              - 'crates/symbolica-utils/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.github/workflows/**'

  tydenso:
    name: Tydenso Wasm and Typst
    needs: [changes]
    if: needs.changes.outputs.tydenso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact Symbolica Typst plugin revision
        uses: actions/checkout@v4
        with:
          repository: symbolica-dev/symbolica-typst-plugin
          ref: b96c1f3ebd1c2563bf91079a0dd6dc5ec82191c0
          path: tymbolica-pinned

      - uses: NixOS/nix-installer-action@main

      - name: Install Binaryen 130
        run: |
          binaryen_dir="$RUNNER_TEMP/binaryen"
          mkdir -p "$binaryen_dir"
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz \
            --output "$binaryen_dir/archive.tar.gz"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  $binaryen_dir/archive.tar.gz" | sha256sum --check
          tar -xzf "$binaryen_dir/archive.tar.gz" -C "$binaryen_dir" --strip-components=1
          echo "$binaryen_dir/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tydenso -> target
          cache-directories: ${{ github.workspace }}/target/tymbolica
          key: tydenso-wasm

      - name: Build and validate Tydenso
        env:
          TYMBOLICA_CHECKOUT: ${{ github.workspace }}/tymbolica-pinned
          TYPST_IGNORE_SYSTEM_FONTS: 'true'
        run: |
          just --unstable check-symbolica-feature-isolation
          just --unstable tydenso::check

      - name: Run Tydenso payload-boundary tests
        run: |
          cargo test \
            --manifest-path tydenso/Cargo.toml \
            --package tydenso-plugin \
            --locked \
            -- \
            --test-threads=1

      - name: Verify Spynso packages its renderer
        run: |
          cargo package -p spynso3 --allow-dirty --list > /tmp/spynso-package-files
          grep -qx 'typst/notation.typ' /tmp/spynso-package-files
          grep -qx 'typst/render.typ' /tmp/spynso-package-files

  # Aggregate matrix and checks into one status for branch protection.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, test-matrix, soft-ct-acceptance, checks, tydenso]
    if: always()
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Tests failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  test-matrix:
    name: Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE_SIGNED }}
      # Hosted runners have fewer CPUs than the local CI profile's 16-test cap.
      NEXTEST_TEST_THREADS: num-cpus
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            form \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            just \
            libmpc-dev \
            python3 \
            python3-dev

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install pkg-config openssl@3 gmp mpfr libmpc just form

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ matrix.os }}

      - name: Set fallback Symbolica license
        run: |
          if [ -z "${SYMBOLICA_LICENSE:-}" ]; then
            echo "SYMBOLICA_LICENSE=GAMMALOOP_USER" >> "$GITHUB_ENV"
          fi

      - name: Verify external tools
        run: |
          command -v form
          form
          command -v python3
          python3 --version

      - name: Run tests
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        run: just --unstable test-ci

      - name: Run tests
        if: startsWith(matrix.os, 'macos-')
        run: just --unstable test-ci-mac

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci_gammaloop/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  soft-ct-acceptance:
    name: Local soft-CT acceptance (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: massless-bubble
            test: paper_figure_b1_massless_bubble_uses_a_complete_soft_wood
          - name: double-triangle
            test: paper_figure_b1_double_triangle_is_a_non_vacuous_uv_fixture
          - name: nested-soft
            test: local_nested_soft_fixture_generates
          - name: appendix-b1
            test: paper_appendix_b1_ir_specialization_generates_and_profiles
          - name: top-bubble-orientations
            test: gamma_star_ddbar_top_bubble_child_only_has_two_power_soft_improvement
          - name: top-bubble
            test: gamma_star_ddbar_top_bubble_has_two_power_soft_improvement
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
      RUST_MIN_STACK: 134217728
      # Bound exact-algebra parallelism on shared runners during each long
      # symbolic-plus-numerical acceptance shard.
      RAYON_NUM_THREADS: 8
      # Preserve generated states and profile JSON when a later assertion fails.
      GAMMALOOP_TESTS_NO_CLEAN_STATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            form \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            just \
            libmpc-dev \
            python3 \
            python3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-ubuntu-latest

      - name: Set fallback Symbolica license
        run: |
          if [ -z "${SYMBOLICA_LICENSE:-}" ]; then
            echo "SYMBOLICA_LICENSE=GAMMALOOP_USER" >> "$GITHUB_ENV"
          fi

      - name: Verify external tools
        run: |
          command -v form
          form
          command -v python3
          python3 --version

      - name: Run mandatory local soft-CT acceptance shard
        run: |
          cargo nextest run \
            --cargo-profile ci-optim \
            --profile soft_ct_acceptance \
            --locked \
            --no-fail-fast \
            -p gammaloop-integration-tests \
            --test uv \
            -E 'test(/^slow::${{ matrix.test }}$/)'

      - name: Upload local soft-CT acceptance JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-soft-ct-acceptance-${{ matrix.name }}
          path: target/nextest/soft_ct_acceptance/junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload local soft-CT failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soft-ct-acceptance-failure-${{ matrix.name }}
          path: tests/artifacts/
          if-no-files-found: warn
          retention-days: 7

  checks-matrix:
    name: Checks (${{ matrix.check }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, fmt, doc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            python3 \
            just \
            python3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: matrix.check != 'fmt'
        with:
          # Cache entries are immutable; each compilation mode must save its own artifacts.
          key: cargo-ubuntu-latest-${{ matrix.check }}

      - name: Run clippy
        if: matrix.check == 'clippy'
        run: just --unstable clippy -- -D warnings

      - name: Run fmt
        if: matrix.check == 'fmt'
        run: just --unstable fmt -- --check

      - name: Run doc
        if: matrix.check == 'doc'
        run: just --unstable doc

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: [changes, checks-matrix]
    if: always()
    steps:
      - name: Checks successful
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Checks failing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
