name: Community graph WebAssembly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# This builds the shared Symbolica Community host, which ships graph, HEP toolkit
# and tensor modules together. There is no standalone wheel build in this workflow.
# Keep full builds on main/manual dispatch; PR performance gating is separate.
jobs:
  wheel:
    name: PyEmscripten wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-emscripten

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notice packaging tool
        run: python3 -m pip install maturin==1.15.0

      - name: Bootstrap and check source drawing notice packaging regressions
        run: python3 tests/packaging/test_drawing_notices.py --prepare-offline-fixtures -v
        env:
          CARGO_BUILD_JOBS: "2"

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: examples/notebooks/symbolica-host
        env:
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_ENVIRONMENT_PYODIDE: CARGO_PROFILE_RELEASE_LTO=thin CARGO_BUILD_JOBS=2
          CIBW_PLATFORM: pyodide

      - uses: actions/upload-artifact@v4
        with:
          name: community-graph-pyemscripten-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
