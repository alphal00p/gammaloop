name: Community graph WebAssembly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# The standalone linnet_py wheel was replaced by the shared Symbolica
# Community host, which ships graph, HEP toolkit and tensor modules together.
# Keep full builds on main/manual dispatch; PR performance gating is separate.
jobs:
  wheel:
    name: PyEmscripten wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-emscripten

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: examples/notebooks/symbolica-host
        env:
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_ENVIRONMENT_PYODIDE: CARGO_PROFILE_RELEASE_LTO=thin CARGO_BUILD_JOBS=2
          CIBW_PLATFORM: pyodide

      - uses: actions/upload-artifact@v4
        with:
          name: community-graph-pyemscripten-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
