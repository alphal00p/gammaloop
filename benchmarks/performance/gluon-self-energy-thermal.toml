# Two-loop gluon self-energy GL1 in thermodynamic equilibrium at finite muB.
# Its quark loop and triple-gluon vertex supply QCD numerators with thermal
# weights. Without vacuum subtraction the two-loop forest nests both
# overlapping one-loop counterterms. Integrated addbacks would more than
# triple generation time, beyond the case budget, so only local terms are built.
commands = [
  "import model sm-thermal",
  "remove processes",
  "import graphs benchmarks/performance/gluon-self-energy-gl1.dot --process-spec 'g > g [{2}] | g u' -p double_triangle -i 2L",
  "generate existing -p double_triangle -i 2L",
  "quit",
]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = false

[cli_settings.global.generation.uv]
subtract_uv = true
softct = false
generate_integrated = false

[cli_settings.global.n_cores]
feyngen = 1
generate = 1

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[cli_settings.global.generation.evaluator]
iterative_orientation_optimization = false
store_atom = false
compile = false
summed = false
summed_function_map = true
do_algebra = true
do_fn_map_replacements = false

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false
check_esurface_at_generation = false

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
inverse_temperature = 1.0
m_uv = 1.0
mu_r = 2.0
renormalization_localization_scale = 2.0

[default_runtime_settings.model]
aS = [1.0, 0.0]
muB = [3.0, 0.0]

[default_runtime_settings.kinematics]
e_cm = 1.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [[1.0, 0.0, 0.0, 0.5], "dependent"]
helicities = [1, 1]

[default_runtime_settings.stability]
rotation_axis = []
