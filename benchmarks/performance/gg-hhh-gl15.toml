# Physical threshold-subtracted GL15 fixture shared with test_runs/utils.rs.
# Both revisions receive this exact card and save their own generated state.
commands = [
  "import model ./assets/models/json/sm/sm-default.json",
  "set global kv global.generation.evaluator.iterative_orientation_optimization=false global.generation.evaluator.store_atom=false global.generation.evaluator.compile=false global.generation.evaluator.summed=false global.generation.evaluator.summed_function_map=true",
  "set global kv global.generation.threshold_subtraction.enable_thresholds=true global.generation.threshold_subtraction.check_esurface_at_generation=true",
  "remove processes",
  '''generate amp g g > h h h / u d c s b QED==3 [{1}]
      --only-diagrams
      --numerator-grouping only_detect_zeroes
      --select-graphs GL15
      --loop-momentum-bases GL15=8
      --global-prefactor-projector 'gammalooprs::ϵ(0,spenso::mink(4,gammalooprs::hedge(0)))
                                     * gammalooprs::ϵ(1,spenso::mink(4,gammalooprs::hedge(1)))
                                     * (1/8)*spenso::g(spenso::coad(8,gammalooprs::hedge(0)),spenso::coad(8,gammalooprs::hedge(1)))'
      -p gg_hhh -i 1L''',
  "generate",
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "quit",
]

[cli_settings.global.n_cores]
feyngen = 1
generate = 1
compile = 1
integrate = 1

[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
debug_cache = false
generate_events = true
store_additional_weights_in_event = true

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
  [500.0, 0.0, 0.0, 500.0],
  [500.0, 0.0, 0.0, -500.0],
  [438.5555662246945, 155.3322001835378, 348.0160396513587, -177.3773615718412],
  [356.3696374921922, -16.802389008511, -318.7291102436005, 97.48719163688098],
  "dependent",
]
helicities = [1, 1, 0, 0, 0]

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "monte_carlo"
lmb_multichanneling = true
lmb_channels = "monte_carlo"

[default_runtime_settings.stability]
rotation_axis = []

[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
