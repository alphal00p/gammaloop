# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
rust-version = "1.92"
name = "typst-svg"
version = "0.15.1"
authors = ["The Typst Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SVG exporter for Typst."
homepage = "https://typst.app"
readme = "README.md"
keywords = ["typst"]
categories = ["compilers"]
license = "Apache-2.0"
repository = "https://github.com/typst/typst"
resolver = "2"

[features]
default = []
pdf = ["dep:typst-assets", "dep:hayro", "dep:hayro-svg", "typst-library/pdf"]

[lib]
name = "typst_svg"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22"

[dependencies.comemo]
version = "0.5.1"

[dependencies.ecow]
version = "0.2.6"
features = ["serde"]

[dependencies.flate2]
version = "1"
features = ["zlib-rs"]

[dependencies.hayro]
optional = true
version = "0.7.1"
default-features = false

[dependencies.hayro-svg]
optional = true
version = "0.7.0"
default-features = false

[dependencies.image]
version = "0.25.5"
features = [
    "png",
]
default-features = false

[dependencies.indexmap]
version = "2"
features = [
    "serde",
    "rayon",
]

[dependencies.itoa]
version = "1"

[dependencies.rustc-hash]
version = "2.1"

[dependencies.ryu]
version = "1"

[dependencies.ttf-parser]
version = "0.25.0"

[dependencies.typst-assets]
optional = true
version = "0.15.1"

[dependencies.typst-layout]
version = "0.15.1"

[dependencies.typst-library]
version = "0.15.1"

[dependencies.typst-macros]
version = "0.15.1"

[dependencies.typst-timing]
version = "0.15.1"

[dependencies.typst-utils]
version = "0.15.1"

[dependencies.xmlwriter]
version = "0.1.0"

[lints.clippy]
blocks_in_conditions = "allow"
comparison_chain = "allow"
derived_hash_with_manual_eq = "allow"
disallowed_methods = "warn"
iter_over_hash_type = "warn"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
mutable_key_type = "allow"
uninlined_format_args = "warn"
wildcard_in_or_patterns = "allow"
