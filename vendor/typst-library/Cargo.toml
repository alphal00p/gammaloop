[package]
edition = "2024"
rust-version = "1.92"
name = "typst-library"
version = "0.15.1"
authors = ["The Typst Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Typst's standard library."
homepage = "https://typst.app"
readme = "README.md"
keywords = ["typst"]
categories = ["compilers"]
license = "Apache-2.0"
repository = "https://github.com/typst/typst"
resolver = "2"

[features]
default = []
full = ["bibliography", "plugins", "syntax-highlighting", "pdf", "raster-formats"]
bibliography = ["dep:hayagriva"]
plugins = ["dep:wasmi"]
syntax-highlighting = ["dep:syntect", "dep:two-face"]
pdf = ["dep:hayro-syntax"]
raster-formats = ["image/jpeg", "image/gif", "image/webp"]

[lib]
name = "typst_library"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7.4"

[dependencies.az]
version = "1.2"

[dependencies.bitflags]
version = "2.10"
features = ["serde"]

[dependencies.bumpalo]
version = "3.15.4"
features = [
    "boxed",
    "collections",
]

[dependencies.ciborium]
version = "0.2.1"

[dependencies.codex]
version = "0.3.0"

[dependencies.comemo]
version = "0.5.1"

[dependencies.csv]
version = "1"

[dependencies.ecow]
version = "0.2.6"
features = ["serde"]

[dependencies.either]
version = "1"

[dependencies.flate2]
version = "1"
features = ["zlib-rs"]

[dependencies.fontdb]
version = "0.23"
default-features = false

[dependencies.glidesort]
version = "0.1.2"

[dependencies.hayagriva]
optional = true
version = "0.10.1"

[dependencies.hayro-syntax]
optional = true
version = "0.7.2"

[dependencies.icu_properties]
version = "2.2.0"
