    "serde",
    "rayon",
]

[dependencies.kamadak-exif]
version = "0.6"

[dependencies.kurbo]
version = "0.13"

[dependencies.libm]
version = "0.2.11"

[dependencies.lipsum]
version = "0.9"

[dependencies.memchr]
version = "2"

[dependencies.moxcms]
version = "0.8.1"

[dependencies.palette]
version = "0.7.3"
features = [
    "approx",
    "libm",
]
default-features = false

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.phf]
version = "0.13"
features = ["macros"]

[dependencies.png]
version = "0.18"

[dependencies.rayon]
version = "1.7.0"

[dependencies.regex]
version = "1"

[dependencies.regex-syntax]
version = "0.8"

[dependencies.roxmltree]
version = "0.21"

[dependencies.rust_decimal]
version = "1.36.0"
features = ["maths"]
default-features = false

[dependencies.rustc-hash]
version = "2.1"

[dependencies.rustybuzz]
version = "0.20"

[dependencies.serde]
version = "1.0.184"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_yaml]
version = "0.9"

[dependencies.siphasher]
version = "1"

[dependencies.smallvec]
version = "1.11.1"
features = [
    "union",
    "const_generics",
    "const_new",
]

[dependencies.syntect]
optional = true
version = "5.3"
features = [
    "parsing",
    "regex-fancy",
    "plist-load",
    "yaml-load",
]
default-features = false

[dependencies.time]
version = "0.3.20"
