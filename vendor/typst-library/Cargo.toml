[dependencies.typst-timing]
version = "0.15.1"

[dependencies.typst-utils]
version = "0.15.1"

[dependencies.unicode-math-class]
version = "0.1"

[dependencies.unicode-normalization]
version = "0.1.24"

[dependencies.unicode-segmentation]
