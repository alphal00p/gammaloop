[target.x86_64-unknown-linux-gnu]
linker = "cc"

[target.wasm32-unknown-unknown]
linker = "rust-lld"
# `getrandom` 0.3 requires an explicit opt-in for JavaScript's Web Crypto
# backend on the otherwise capability-free wasm32-unknown-unknown target.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[env]
# Visible to every rustc and every build script in the workspace build.
SYMBOLICA_OEM_LICENSE = { value = "SYMBOLICA_OEM_GAMMALOOP", force = false }

