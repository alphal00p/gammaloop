[target.x86_64-unknown-linux-gnu]
linker = "cc"

[target.wasm32-unknown-unknown]
linker = "rust-lld"

[env]
# Public GammaLoop OEM selector, visible throughout builds started in this checkout.
# Cargo does not inherit dependency-local configuration, so crates.io consumers
# must set the same compile-time variable in their own build environment.
SYMBOLICA_OEM_LICENSE = { value = "SYMBOLICA_OEM_GAMMALOOP", force = false }

