[package]
name = "alphal00p-notebook-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "core"
crate-type = ["cdylib"]

[dependencies]
feynkit-py = { path = "../../../crates/feynkit-py", default-features = false, features = ["ufo"] }
spynso3 = { path = "../../../crates/spynso3", default-features = false }
symbolica = { version = "=3.0.0", default-features = false, features = ["python_export", "python_abi3"] }
pyo3 = { version = "0.28", features = ["abi3", "extension-module"] }

[features]
default = ["native"]
native = ["feynkit-py/native", "spynso3/native"]
wasm = ["feynkit-py/wasm", "spynso3/wasm"]

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "06906976bca24fefc5203aee699d90d62ebe08cd" }

[profile.dev]
debug = 0
