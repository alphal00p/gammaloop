commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-thermal",
  "set model aS=1.0 muB=0.0",
  "remove processes",
  "import graphs ./tests/resources/graphs/thermal_gluon_quark_ring.dot -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring",
  "generate existing -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring",
]

[[command_blocks]]
name = "generate_muv"
commands = [
  "set global kv global.generation.uv.renormalization_prescription.massless_power_divergent=MUV",
  "run generate",
]

[[command_blocks]]
name = "profile_uv"
commands = [
  "profile ultra-violet -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring --selected-limits only-divergent --min-scaling=3 --max-scaling=6 --n-points 8 --seed 1337 --use_f128 --allow-vanishing-missing-fits",
]

[[command_blocks]]
name = "profile_uv_finite_mu"
commands = [
  "set model muB=3.0",
  "run profile_uv",
]

[[command_blocks]]
name = "profile_soft"
commands = [
  "profile bulk -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring --select 'thermal_gluon_quark_ring S(e0)' --min-scaling=-2 --max-scaling=-5 --n-points 15 --seed 1337",
]

[[command_blocks]]
name = "profile_soft_finite_mu"
commands = [
  "set model muB=3.0",
  "run profile_soft",
]

[[command_blocks]]
name = "profile_joint_soft"
commands = [
  "profile bulk -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring --select 'thermal_gluon_quark_ring S(e0)S(e4)' --min-scaling=-2 --max-scaling=-5 --n-points 15 --seed 1337",
]

[[command_blocks]]
name = "profile_joint_soft_finite_mu"
commands = [
  "set model muB=3.0",
  "run profile_joint_soft",
]

[[command_blocks]]
name = "approach_soft"
commands = [
  "approach -p thermal_gluon_quark_ring -i thermal_gluon_quark_ring --momentum-space -x 0,0,0,0.71,0.23,0.43,-0.37,0.61,0.29 --approach-axis 1,0.2,-0.3,0,0,0,0,0,0 --n-points 12 --logarithmic --min-abs-t 1e-5 --max-abs-t 1e-2 --skip-midpoint --use_arb_prec",
]

[cli_settings.global.generation]
override_lmb_heuristics = true

[cli_settings.global.generation.medium]
mode = "thermodynamic_equilibrium"
vacuum_subtraction = true

[cli_settings.global.generation.uv]
subtract_uv = true
generate_integrated = false
add_marker = false
inner_products = true
orchestrator = "hedge_poset"

[cli_settings.global.generation.uv.renormalization_prescription]
log_divergent = "MUV"
massive_power_divergent = "MUV"
# The containing power-divergent components must use IR as well as each bubble.
# Vacuum subtraction keeps the all-loop counterterm only as the plain U that subtracts
# the reduced cograph of each frozen soft branch; on all other branches it vanishes.
massless_power_divergent = "IR"

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.tropical_subgraph_table]
disable_tropical_generation = true

[cli_settings.global.generation.evaluator]
iterative_orientation_optimization = false
compile = false

[default_runtime_settings.general]
inverse_temperature = 1.0
evaluator_method = "SingleParametric"
m_uv = 1.0
mu_r = 2.0

[default_runtime_settings.kinematics]
e_cm = 1.0

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true
