commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default",
  "set model MT=173.0 WT=0.0",
  "remove processes",
  "import graphs ./tests/resources/graphs/local_os_top_self_energy.dot -p local_os_top_self_energy -i local_os_top_self_energy",
  "generate existing -p local_os_top_self_energy -i local_os_top_self_energy",
]

[[command_blocks]]
name = "profile_uv"
commands = [
  "profile ultra-violet -p local_os_top_self_energy -i local_os_top_self_energy --min-scaling 8 --max-scaling 12 --n-points 25 --seed 1337 --per-orientation",
]

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
  [180.08053753806934, 0.0, 0.0, 50.0],
  "dependent",
]
helicities = [1, 1]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"

[cli_settings.global]
logfile_directive = "off"
display_directive = "info"

[cli_settings.global.generation]
explicit_orientation_sum_only = true

[cli_settings.global.generation.uv]
# This fixed point is independent of the live external on-shell momentum.
on_shell_subtraction_velocity = ["5/4", "1/4", "1/2", "1/2"]
generate_integrated = true
local_uv_cts_from_expanded_4d_integrands = true
add_marker = false
inner_products = true
orchestrator = "hedge_poset"

[[cli_settings.global.generation.uv.renormalization_prescription.overrides]]
prescription = "OS"

[cli_settings.global.generation.uv.renormalization_prescription.overrides.ct_identifier]
external_pdg_set = [-6, 6]
internal_pdg_set = [6, 21]

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = false
disable_tropical_generation = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

# The local fixed reference must be preserved by every stability probe.
[[default_runtime_settings.stability.rotation_axis]]
type = "axis_angle"
axis = [1.0, 2.0, 2.0]
cos_theta = 0.0
