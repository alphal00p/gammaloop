commands = []

[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default",
  "set model MT=173.0 WT=0.0",
  "remove processes",
  "import graphs ./tests/resources/graphs/local_nested_soft_top_self_energy.dot -p integrated_nested_os_top_self_energy -i integrated_nested_os_top_self_energy",
  "generate existing -p integrated_nested_os_top_self_energy -i integrated_nested_os_top_self_energy",
]

[[command_blocks]]
name = "inspect"
commands = [
  "inspect -p integrated_nested_os_top_self_energy -i integrated_nested_os_top_self_energy -m -x 19.0 -29.0 37.0 11.0 43.0 -23.0 --graph-id 0",
  "inspect -p integrated_nested_os_top_self_energy -i integrated_nested_os_top_self_energy -m -x -41.0 13.0 23.0 29.0 -17.0 31.0 --graph-id 0",
]

[[command_blocks]]
name = "profile_uv"
commands = [
  "profile ultra-violet -p integrated_nested_os_top_self_energy -i integrated_nested_os_top_self_energy --min-scaling 8 --max-scaling 12 --n-points 25 --seed 1337 --per-orientation",
]

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
  [180.08053753806934, 0.0, 0.0, 50.0],
  "dependent",
]
helicities = [1, 1]

[default_runtime_settings.general]
evaluator_method = "SingleParametric"

[cli_settings.global]
logfile_directive = "[{#generation,#profile}]=debug"
display_directive = "info"

[cli_settings.global.generation]
explicit_orientation_sum_only = true

[cli_settings.global.generation.uv]
generate_integrated = true
local_uv_cts_from_expanded_4d_integrands = true
add_marker = false
inner_products = true
orchestrator = "hedge_poset"

[[cli_settings.global.generation.uv.renormalization_prescription.overrides]]
prescription = "OS"

[cli_settings.global.generation.uv.renormalization_prescription.overrides.ct_identifier]
external_pdg_set = [-6, 6]
internal_pdg_set = [6, 21]

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = false
disable_tropical_generation = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = false

[cli_settings.global.generation.evaluator]
# The public two-loop forest includes local and analytically integrated OS terms.
# SingleParametric avoids constructing an unused iterative evaluator.
iterative_orientation_optimization = false
